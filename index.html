      logs.push(M(caster.name+' stuns '+target.name+'!',caster.name+' оглушает '+target.name+'!'));
      if(ability.id==='tackle'){
        target.status.push({type:'mark',tag:'exposed',duration:2,label:M('exposed','уязвим')});
        logs.push(M(target.name+" is left wide open — the company can capitalize on it.",target.name+' остаётся без защиты — отряд может этим воспользоваться.'));
      }
    } else {
      logs.push(M(caster.name+' swings at nothing.',caster.name+' бьёт в пустоту.'));
    }
  } else if(ability.type==='swap_row'){
    if(target&&target.alive){
      target.row = target.row==='front'?'back':'front';
      logs.push(M(caster.name+' shoves '+target.name+' to the '+rowLabel(target.row)+' row!',caster.name+' толкает '+target.name+' в '+rowLabel(target.row)+' ряд!'));
    } else {
      logs.push(M(caster.name+' finds no one to shove.',caster.name+' не находит, кого толкнуть.'));
    }
  }
  logs.fx=fx;
  return logs;
}

function tickStatus(unit){
  const logs=[];
  const keep=[];
  unit.status.forEach(function(s){
    if(s.type==='dot'){
      unit.hp=Math.max(0,unit.hp-s.amount);
      logs.push(M(unit.name+' burns for '+s.amount+'.',unit.name+' горит и получает '+s.amount+' урона.'));
      if(unit.hp<=0 && unit.alive){
        if(hasRelic(unit,'revive')&&!unit.usedPhoenix){
          unit.usedPhoenix=true;unit.hp=1;
          const rn=unit.equip.relic.name;
          logs.push(M(unit.name+"'s "+rn+' flares — they cling to life at 1 HP!',unit.name+' спасён («'+rn+'») — остаётся жить с 1 HP!'));
        } else {
          unit.alive=false;
          if(unit.isHero&&RUN.combat)RUN.heroDied=true;
          logs.push(M(unit.name+' falls.',unit.name+' падает замертво.'));
        }
      }
    }
    const nd=s.duration-1;
    if(nd>0)keep.push(Object.assign({},s,{duration:nd}));
  });
  unit.status=keep;
  return logs;
}

function buildTurnOrder(){
  const all=RUN.combat.party.concat(RUN.combat.enemies).filter(function(c){return c.alive;});
  all.sort(function(a,b){return statOf(b,'spd')-statOf(a,'spd');});
  return all;
}

function startCombat(node){
  RUN.combat={
    node:node,
    enemies:buildEncounter(node),
    party:RUN.party,
    queue:[],
    qi:0,
    round:1,
    log:[],
    selectedAbility:null,
    targetingUnit:null,
    over:false,
    autoBattle:false,
  };
  recordBestiary(RUN.combat.enemies);
  RUN.party.forEach(function(h){h.abilities.forEach(function(a){a.cdLeft=0;});h.status=[];});
  logCombat(M(
    'The company braces as '+RUN.combat.enemies.map(function(e){return e.name;}).join(', ')+' close in.',
    'Отряд готовится к бою: приближаются '+RUN.combat.enemies.map(function(e){return e.name;}).join(', ')+'.'
  ));
  show('screen-combat');
  renderTopbar();
  newRound();
}
function logCombat(msg){RUN.combat.log.push(msg);renderCombatLog();}
/* Resume a battle that was left mid-fight (page reload / closed browser). Every combat
   checkpoint saves RUN.combat.phase alongside the state it describes, so we just re-enter
   at that exact phase instead of restarting the encounter. */
function resumeCombat(){
  if(!RUN.combat)return;
  renderCombat();
  const phase=RUN.combat.phase;
  const unit=RUN.combat.activeUnit;
  if(phase==='hero_choose'||phase==='hero_target'){
    renderActionPanel();
    if(phase==='hero_choose'&&RUN.combat.autoBattle&&unit)setTimeout(function(){autoActHero(unit);},500);
  } else if(phase==='enemy_turn'&&unit&&unit.alive){
    renderActionPanel();
    setTimeout(function(){enemyAct(unit);},550);
  } else {
    advanceTurn();
  }
}

function newRound(){
  RUN.combat.queue=buildTurnOrder();
  RUN.combat.qi=0;
  advanceTurn();
}
function checkCombatEnd(){
  if(RUN.combat.over)return true;
  const heroesAlive=anyAlive(RUN.combat.party).length>0;
  const enemiesAlive=anyAlive(RUN.combat.enemies).length>0;
  if(RUN.combat.isArena){
    if(!enemiesAlive){RUN.combat.over=true;onArenaCombatEnd(true);return true;}
    if(!heroesAlive){RUN.combat.over=true;onArenaCombatEnd(false);return true;}
    return false;
  }
  if(!enemiesAlive){RUN.combat.over=true;onCombatWin();return true;}
  if(!heroesAlive){RUN.combat.over=true;onCombatLoss();return true;}
  return false;
}
function advanceTurn(){
  if(checkCombatEnd())return;
  if(RUN.combat.qi>=RUN.combat.queue.length){RUN.combat.round++;newRound();return;}
  const unit=RUN.combat.queue[RUN.combat.qi];
  if(!unit.alive){RUN.combat.qi++;RUN.combat.phase='advance';advanceTurn();return;}
  const dl=tickStatus(unit);
  dl.forEach(logCombat);
  if(checkCombatEnd())return;
  if(!unit.alive){RUN.combat.qi++;RUN.combat.phase='advance';advanceTurn();return;}
  unit.abilities.forEach(function(a){if(a.cdLeft>0)a.cdLeft--;});
  if(unit.boss&&!unit.enraged&&unit.hp<=unit.maxHp*0.5){
    unit.enraged=true;unit.atk=Math.round(unit.atk*1.3);
    logCombat(M(unit.name+' enters a hollow rage!',unit.name+' впадает в бездушную ярость!'));
  }
  if(unit.elite&&!unit.enraged&&unit.hp<=unit.maxHp*0.5){
    unit.enraged=true;unit.atk=Math.round(unit.atk*1.25);
    logCombat(M(unit.name+' finds a second wind!',unit.name+' обретает второе дыхание!'));
  }
  if(unit.status.some(function(s){return s.type==='stun';})){
    logCombat(M(unit.name+' is stunned and cannot act.',unit.name+' оглушён и не может действовать.'));
    RUN.combat.qi++;RUN.combat.phase='advance';advanceTurn();return;
  }
  RUN.combat.activeUnit=unit;
  if(unit.side==='hero'){
    RUN.combat.activeHero=unit;
    RUN.combat.phase='hero_choose';
    renderCombat();
    renderActionPanel();
    if(RUN.combat.autoBattle)setTimeout(function(){autoActHero(unit);},500);
  } else {
    RUN.combat.activeHero=null;
    RUN.combat.phase='enemy_turn';
    RUN.combat.enemyIntent=buildEnemyIntent(unit);
    renderCombat();
    renderActionPanel();
    setTimeout(function(){enemyAct(unit);},550);
  }
}
function buildEnemyIntent(unit){
  const usable=unit.abilities.filter(function(a){return a.cdLeft<=0 && (!a.requiresEnrage||unit.enraged) && abilityHasTargets(a,unit);});
  if(!usable.length)return null;
  const healAbility=usable.find(function(a){return a.type==='heal';});
  const allyList=anyAlive(RUN.combat.enemies);
  const hurtAllies=allyList.filter(function(a){return a.hp/a.maxHp<0.55;});
  let ability;
  if(healAbility&&hurtAllies.length&&Math.random()<0.85){
    ability=healAbility;
  } else {
    const dmgAbilities=usable.filter(function(a){return a.type==='damage';});
    const utilAbilities=usable.filter(function(a){return a.type!=='damage'&&a.type!=='heal';});
    if(dmgAbilities.length){
      if(utilAbilities.length&&Math.random()<0.18){
        ability=pick(utilAbilities);
      } else {
        dmgAbilities.sort(function(a,b){return (b.mult||0)-(a.mult||0);});
        ability = Math.random()<0.72 ? dmgAbilities[0] : pick(dmgAbilities);
      }
    } else {
      ability=usable[0];
    }
  }
  let target=null;
  if(ability.type==='heal'){
    target=hurtAllies.slice().sort(function(a,b){return (a.hp/a.maxHp)-(b.hp/b.maxHp);})[0]||allyList[0];
  } else if(ability.targets==='single-ally'){
    const valid=getValidTargets(ability,unit);
    target=valid.length?pick(valid):null;
  } else if(ability.targets==='single'){
    const valid=getValidTargets(ability,unit);
    if(valid.length){
      const execTarget=valid.find(function(t){return t.hp/t.maxHp<0.3;});
      if(execTarget){
        target=execTarget;
      } else {
        const healerTargets=valid.filter(function(t){return t.isHero&&t.abilities&&t.abilities.some(function(a){return a.type==='heal'&&a.cdLeft<=0;});});
        if(healerTargets.length&&Math.random()<0.45){
          target=pick(healerTargets);
        } else {
          target=valid.slice().sort(function(a,b){return (a.hp/a.maxHp)-(b.hp/b.maxHp);})[0];
        }
      }
    }
  }
  const enemyIdx=RUN.combat.enemies.indexOf(unit);
  let targetSide=null,targetIdx=-1;
  if(target){
    const pIdx=RUN.combat.party.indexOf(target);
    if(pIdx>=0){targetSide='party';targetIdx=pIdx;}
    else{targetSide='enemies';targetIdx=RUN.combat.enemies.indexOf(target);}
  }
  return {enemyIdx:enemyIdx,abilityId:ability.id,abilityName:ability.name,abilityType:ability.type,targetSide:targetSide,targetIdx:targetIdx};
}
function enemyAct(unit){
  if(!unit.alive){RUN.combat.qi++;RUN.combat.phase='advance';RUN.combat.enemyIntent=null;renderCombat();setTimeout(advanceTurn,50);return;}
  const intent=RUN.combat.enemyIntent;
  const ability=intent?unit.abilities.find(function(a){return a.id===intent.abilityId;}):null;
  if(!intent||!ability){
    logCombat(M(unit.name+' finds no target and holds.',unit.name+' не находит цель и медлит.'));
    RUN.combat.qi++;
    RUN.combat.activeUnit=null;
    RUN.combat.enemyIntent=null;
    RUN.combat.phase='advance';
    renderCombat();
    setTimeout(advanceTurn,350);
    return;
  }
  const target = intent.targetSide==='party'?RUN.combat.party[intent.targetIdx]:(intent.targetSide==='enemies'?RUN.combat.enemies[intent.targetIdx]:null);
  ability.cdLeft=ability.cd;
  const logs=applyAbilityEffect(unit,ability,target);
  logs.forEach(logCombat);
  RUN.combat.qi++;
  RUN.combat.activeUnit=null;
  RUN.combat.enemyIntent=null;
  RUN.combat.phase='advance';
  renderCombat();
  playCombatFx(logs.fx);
  setTimeout(advanceTurn,450);
}

function autoChooseForHero(unit){
  const usableAbilities=unit.abilities.filter(function(a){return a.cdLeft<=0&&(!a.minLevel||(unit.level||1)>=a.minLevel)&&abilityHasTargets(a,unit);});
  const healAbility=usableAbilities.find(function(a){return a.type==='heal';});
  if(healAbility){
    const allies=anyAlive(RUN.combat.party);
    const hurt=allies.filter(function(a){return a.hp/a.maxHp<0.6;});
    if(hurt.length){
      const target=healAbility.targets==='all-ally'?null:hurt.sort(function(a,b){return (a.hp/a.maxHp)-(b.hp/b.maxHp);})[0];
      return {ability:healAbility,target:target};
    }
  }
  const dmgAbilities=usableAbilities.filter(function(a){return a.type==='damage';});
  if(!dmgAbilities.length)return null;
  dmgAbilities.sort(function(a,b){return (b.mult||0)-(a.mult||0);});
  const ability=dmgAbilities[0];
  let target=null;
  if(ability.targets==='single'){
    const valid=getValidTargets(ability,unit);
    target=valid.sort(function(a,b){return a.hp-b.hp;})[0];
  }
  return {ability:ability,target:target};
}
function autoActHero(unit){
  if(!RUN.combat||!RUN.combat.autoBattle||RUN.combat.activeHero!==unit||!unit.alive)return;
  const decision=autoChooseForHero(unit);
  if(!decision){
    logCombat(M(unit.name+' finds no target and holds.',unit.name+' не находит цель и медлит.'));
    RUN.combat.activeHero=null;
    RUN.combat.activeUnit=null;
    RUN.combat.qi++;
    RUN.combat.phase='advance';
    renderCombat();
    setTimeout(advanceTurn,300);
    return;
  }
  resolveHeroAbility(decision.ability,decision.target);
}
function heroChooseAbility(ability){
  if(ability.cdLeft>0)return;
  if(ability.minLevel&&(RUN.combat.activeHero.level||1)<ability.minLevel)return;
  if(!abilityHasTargets(ability,RUN.combat.activeHero))return;
  RUN.combat.selectedAbility=ability;
  const needsTarget = ability.targets==='single'||ability.targets==='single-ally';
  if(!needsTarget){
    resolveHeroAbility(ability,null);
    return;
  }
  RUN.combat.phase='hero_target';
  renderActionPanel();
  renderCombat();
}
function resolveHeroAbility(ability,target){
  if(RUN.combat.isLivePvp){liveResolveHeroAbility(ability,target);return;}
  const unit=RUN.combat.activeHero;
  ability.cdLeft=ability.cd;
  const logs=applyAbilityEffect(unit,ability,target);
  logs.forEach(logCombat);
  RUN.combat.selectedAbility=null;
  RUN.combat.activeHero=null;
  RUN.combat.activeUnit=null;
  RUN.combat.qi++;
  RUN.combat.phase='advance';
  renderCombat();
  playCombatFx(logs.fx);
  setTimeout(advanceTurn,250);
}
function heroChooseTarget(target){
  if(!RUN.combat.selectedAbility)return;
  resolveHeroAbility(RUN.combat.selectedAbility,target);
}

function onCombatWin(){
  logCombat(M('The foes are defeated.','Враги повержены.'));
  RUN.layersCleared=Math.max(RUN.layersCleared,RUN.combat.node.layer+1);
  const node=RUN.combat.node;
  if(node.type==='boss'){
    saveRun();
    setTimeout(function(){onVictory();},700);
    return;
  }
  let baseGold=14+node.layer*5+randInt(0,10);
  if(RUN.modifiers&&RUN.modifiers.brokenWard)baseGold=Math.round(baseGold*1.2);
  RUN.gold+=baseGold;
  const cards=buildRewardCards(node.layer);
  RUN.pendingReward={gold:baseGold,cards:cards,node:node};
  awardXp(node);
  saveRun();
  setTimeout(function(){renderRewardScreen();},700);
}
function onCombatLoss(){
  logCombat(M('The company has fallen.','Отряд пал.'));
  saveRun();
  setTimeout(function(){onDefeat();},900);
}

/* ============================= REWARD / NODES ============================= */

function buildRewardCards(layer){
  const tier=tierForLayer(layer);
  const cards=[];
  cards.push({type:'item',item:randomItem(tier)});
  const r=Math.random();
  if(r<0.4)cards.push({type:'gold',amount:14+tier*6+randInt(0,8)});
  else if(r<0.75)cards.push({type:'elixir'});
  else cards.push({type:'item',item:randomItem(tier)});
  const r2=Math.random();
  if(r2<0.34)cards.push({type:'gold',amount:10+tier*5+randInt(0,8)});
  else if(r2<0.67)cards.push({type:'elixir'});
  else cards.push({type:'item',item:randomItem(tier)});
  if(Math.random()<0.16)cards.push({type:'item',item:randomRelic(tier)});
  return cards;
}

function completeCurrentNode(node){
  node.cleared=true;
  RUN.currentNodeId=node.id;
  RUN.availableNodeIds=node.next;
  saveRun();
}

function goToMap(){
  show('screen-map');
  renderTopbar();
  renderMap();
  saveRun();
}

function enterNode(node){
  if(node.type==='battle'||node.type==='elite'){startCombat(node);}
  else if(node.type==='event'){startEvent(node);}
  else if(node.type==='shop'){startShop(node);}
  else if(node.type==='rest'){startRest(node);}
  else if(node.type==='boss'){startCombat(node);}
}

/* ---- events ---- */
let currentEvent=null;
function startEvent(node){
  let def=null;
  if(RUN.pendingChainEvent){
    def=EVENTS.find(function(e){return e.id===RUN.pendingChainEvent;})||null;
    RUN.pendingChainEvent=null;
  }
  if(!def)def=pick(EVENTS.filter(function(e){return !e.chainOnly;}));
  currentEvent={node:node,def:def};
  $('event-title').textContent=L(currentEvent.def.title);
  $('event-text').textContent=L(currentEvent.def.text);
  const box=$('event-choices');box.innerHTML='';
  currentEvent.def.choices.forEach(function(choice){
    const b=el('button','card-choice',L(choice.label));
    b.addEventListener('click',function(){
      RUN.pendingItemPickup=null;
      const msg=choice.resolve(RUN);
      completeCurrentNode(node);
      if(choice.special==='item'&&RUN.pendingItemPickup){
        const item=RUN.pendingItemPickup;RUN.pendingItemPickup=null;
        showEventResult(M('You find: '+item.name+'.','Вы находите: '+item.name+'.'),function(){promptEquip(item,goToMap);});
      } else {
        showEventResult(msg,goToMap);
      }
    });
    box.appendChild(b);
  });
  show('screen-event');
  renderTopbar();
}
function showEventResult(msg,after){
  $('event-title').textContent='…';
  $('event-text').textContent=msg;
  const box=$('event-choices');box.innerHTML='';
  const b=el('button','primary',M('Continue','Продолжить'));
  b.addEventListener('click',after);
  box.appendChild(b);
}

/* ---- shop ---- */
function startShop(node){
  RUN.shopStock = RUN.shopStock||buildShopStock(node.layer);
  renderShop();
  show('screen-shop');
  renderTopbar();
  RUN._shopNode=node;
}
/* Shops now carry more stock (4 gear items instead of 2, higher relic odds
   at deeper tiers) so the gold the march hands out actually has somewhere
   to go — see CHANGELOG for the economy pass this belongs to. */
function buildShopStock(layer){
  const tier=tierForLayer(layer||0);
  const stock=[
    {kind:'item',item:randomItem(tier),price:0},
    {kind:'item',item:randomItem(tier),price:0},
    {kind:'item',item:randomItem(tier),price:0},
    {kind:'item',item:randomItem(tier),price:0},
    {kind:'elixir',price:20},
    {kind:'vigor',price:32},
  ];
  const relicChance=tier>=3?0.6:(tier===2?0.4:0.25);
  if(Math.random()<relicChance)stock.push({kind:'item',item:randomRelic(tier),price:0});
  return stock.map(function(s){if(s.kind==='item')s.price=({common:20,rare:38,epic:70})[s.item.rarity];return s;});
}
function goldSuffix(){return M(' gold',' золота');}
function renderShop(){
  $('shop-gold').textContent=RUN.gold;
  const box=$('shop-items');box.innerHTML='';
  RUN.shopStock.forEach(function(stock){
    if(stock.sold)return;
    const b=el('button','card-choice');
    let label='';
    if(stock.kind==='item'){
      const hint=itemClassHint(stock.item);
      label='<strong>'+stock.item.name+'</strong> <span class="item-tag rarity-'+stock.item.rarity+'">'+rarityLabel(stock.item.rarity)+'</span><br><span style="color:var(--muted);font-size:12px;">'+itemDescText(stock.item)+(hint?' · <span style="color:var(--accent);">'+hint+'</span>':'')+'</span>';
    }
    else if(stock.kind==='elixir')label='<strong>'+M('Elixir','Эликсир')+'</strong><br><span style="color:var(--muted);font-size:12px;">'+M('Restores 60% of one member\'s HP.','Восстанавливает 60% здоровья одному бойцу.')+'</span>';
    else if(stock.kind==='vigor')label='<strong>'+M('Vial of Deep Vigor','Флакон глубокой бодрости')+'</strong><br><span style="color:var(--muted);font-size:12px;">'+M('+6 max HP, permanently, to one member.','Даёт одному бойцу +6 к макс. здоровью навсегда.')+'</span>';
    label+='<br><span class="gold-badge" style="font-size:13px;">'+stock.price+goldSuffix()+'</span>';
    b.innerHTML=label;
    b.disabled=RUN.gold<stock.price;
    b.addEventListener('click',function(){
      if(RUN.gold<stock.price)return;
      RUN.gold-=stock.price;stock.sold=true;SFX.coin();
      if(stock.kind==='item'){promptEquip(stock.item,function(){renderShop();saveRun();});}
      else if(stock.kind==='elixir'){promptChooseHero(M('Elixir on whom?','Кому дать эликсир?'),function(h){h.hp=Math.min(h.maxHp,h.hp+Math.round(h.maxHp*0.6));renderShop();saveRun();});}
      else if(stock.kind==='vigor'){promptChooseHero(M('Vigor for whom?','Кому дать флакон бодрости?'),function(h){h.maxHp+=6;h.hp+=6;renderShop();saveRun();});}
    });
    box.appendChild(b);
  });
  if(!box.children.length)box.appendChild(el('div','','<span style="color:var(--muted);">'+M('The cart is empty. Nothing left to buy.','Тележка пуста. Больше нечего купить.')+'</span>'));
  renderShopCraft();
}
/* ---- crafting: spend shards (from salvaging unwanted gear) on an item of a
   chosen slot & rarity. The exact item within that slot/rarity is still
   random, same as a battle drop, but the player controls what kind of
   upgrade they're gambling shards on instead of pure chance. */
const CRAFT_RECIPES=[
  {slot:'weapon',rarity:'common',cost:10},{slot:'weapon',rarity:'rare',cost:20},{slot:'weapon',rarity:'epic',cost:38},
  {slot:'armor',rarity:'common',cost:10},{slot:'armor',rarity:'rare',cost:20},{slot:'armor',rarity:'epic',cost:38},
  {slot:'trinket',rarity:'common',cost:9},{slot:'trinket',rarity:'rare',cost:18},{slot:'trinket',rarity:'epic',cost:34},
  {slot:'relic',rarity:'rare',cost:26},{slot:'relic',rarity:'epic',cost:45},
];
function craftItemFromRecipe(r){
  if(r.slot==='relic'){
    const base=pick(relicsOfRarity(r.rarity));
    return Object.assign({},base,{name:L(base.name),passiveDesc:L(base.passiveDesc)});
  }
  const pool=ITEM_POOL.filter(function(it){return it.slot===r.slot&&it.rarity===r.rarity;});
  const base=pick(pool);
  return Object.assign({},base,{name:L(base.name)});
}
function renderShopCraft(){
  const box=$('shop-craft');box.innerHTML='';
  const shardsLine=el('div','',"<span style='color:var(--muted);font-size:12px;'>"+M('Shards: ','Осколки: ')+'<strong>'+(RUN.shards||0)+'</strong> · '+M('earned by salvaging gear in the backpack (Formation & Gear).','получены разбором снаряжения в рюкзаке (Строй и снаряжение).')+"</span>");
  box.appendChild(shardsLine);
  CRAFT_RECIPES.forEach(function(r){
    const b=el('button','card-choice');
    b.innerHTML='<strong>'+M('Craft ','Скрафтить ')+slotName(r.slot)+'</strong> <span class="item-tag rarity-'+r.rarity+'">'+rarityLabel(r.rarity)+'</span><br><span style="color:var(--muted);font-size:12px;">'+M('Random item of this slot &amp; rarity.','Случайный предмет этого слота и редкости.')+'</span><br><span class="gold-badge" style="font-size:13px;">'+r.cost+' '+M('shards','осколков')+'</span>';
    b.disabled=(RUN.shards||0)<r.cost;
    b.addEventListener('click',function(){
      if((RUN.shards||0)<r.cost)return;

function modsToText(mods){
  const parts=[];
  if(mods.str)parts.push((mods.str>0?'+':'')+mods.str+' '+statAbbr('str'));
  if(mods.int)parts.push((mods.int>0?'+':'')+mods.int+' '+statAbbr('int'));
  if(mods.atk)parts.push((mods.atk>0?'+':'')+mods.atk+' '+M('power (STR/INT)','сила/инт.'));
  if(mods.def)parts.push((mods.def>0?'+':'')+mods.def+' '+statAbbr('def'));
  if(mods.mdef)parts.push((mods.mdef>0?'+':'')+mods.mdef+' '+statAbbr('mdef'));
  if(mods.spd)parts.push((mods.spd>0?'+':'')+mods.spd+' '+statAbbr('spd'));
  if(mods.hp)parts.push((mods.hp>0?'+':'')+mods.hp+' '+statAbbr('hp'));
  return parts.join(', ');
}
function itemDescText(item){
  const parts=[];
  const mt=modsToText(item.mods||{});
  if(mt)parts.push(mt);
  if(item.passiveDesc)parts.push(item.passiveDesc);
  return parts.join(' · ')||M('No bonus','Без бонуса');
}

const MAP_FLAVOR_BY_TIER={
  1:{en:'The road is quiet, for now.',ru:'Пока дорога спокойна.'},
  2:{en:'The ash grows thicker; the going gets harder.',ru:'Пепел сгущается — идти становится тяжелее.'},

function renderMapFlavor(){
  const cur=RUN.currentNodeId?findNode(RUN.map,RUN.currentNodeId):null;
  const li=cur?Math.min(cur.layer+1,TOTAL_MAP_LAYERS-1):0;
  const tier=tierForLayer(li);
  const el2=$('map-flavor');
  if(el2)el2.textContent=L(MAP_FLAVOR_BY_TIER[tier]||MAP_FLAVOR_BY_TIER[1]);
}
function renderMap(){
  renderMapFlavor();
  const map=RUN.map;
  const layers=map.layers;
  const totalLayers=layers.length+1;
  const maxPerLayer=layers.reduce(function(m,l){return Math.max(m,l.length);},1);
  const w=70+totalLayers*112;
  const h=Math.max(300,110+(maxPerLayer-1)*116);
  const svg=$('map-svg');
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.setAttribute('width',w);
  svg.setAttribute('height',h);
  svg.innerHTML='';
  const NS='http://www.w3.org/2000/svg';
  function coordsFor(node){
    const arr = node.type==='boss'?[node]:layers[node.layer];
    const n=arr.length;
    const y = n<=1?h/2:55+node.idx*((h-110)/(n-1));
    const x = 55+node.layer*112;
    return {x:x,y:y};
  }
  const allNodes=mapAllNodes(map);
  const posMap={};
  allNodes.forEach(function(n){posMap[n.id]=coordsFor(n);});

  /* Decorative tier bands behind the path, so the march's four difficulty
     stretches read visually instead of only through node color. Purely
     cosmetic — never affects which nodes are reachable. */
  let bandStart=0,bandTier=tierForLayer(0);
  for(let li=1;li<=layers.length;li++){
    const t=li<layers.length?tierForLayer(li):-1;
    if(t!==bandTier){
      const x1=55+bandStart*112-56, x2=55+(li-1)*112+56;
      const band=document.createElementNS(NS,'rect');
      band.setAttribute('x',x1);band.setAttribute('y',0);
      band.setAttribute('width',Math.max(0,x2-x1));band.setAttribute('height',h);
      band.setAttribute('fill',bandTier%2===0?'var(--map-band-a)':'var(--map-band-b)');
      svg.insertBefore(band,svg.firstChild);
      const label=document.createElementNS(NS,'text');
      label.setAttribute('class','map-tier-label');
      label.setAttribute('x',(x1+x2)/2);label.setAttribute('y',18);
      label.setAttribute('text-anchor','middle');
      label.textContent=M('Tier ','Ярус ')+bandTier;
      svg.appendChild(label);
      bandStart=li;bandTier=t;
    }
  }

  allNodes.forEach(function(n){
    n.next.forEach(function(nid){
      const p1=posMap[n.id],p2=posMap[nid];
      const line=document.createElementNS(NS,'line');
      line.setAttribute('x1',p1.x);line.setAttribute('y1',p1.y);
      line.setAttribute('x2',p2.x);line.setAttribute('y2',p2.y);
      line.setAttribute('stroke', n.cleared?'var(--map-line-cleared)':'var(--map-line)');
      line.setAttribute('stroke-width','2.5');
      svg.appendChild(line);
    });
  });
  allNodes.forEach(function(n){
    const p=posMap[n.id];
    const g=document.createElementNS(NS,'g');
    const available=RUN.availableNodeIds&&RUN.availableNodeIds.indexOf(n.id)>=0;
    g.setAttribute('class','map-node'+(available?'':' locked'));
    const r = n.type==='boss'?24:(n.type==='elite'?19:16);
    const circle=document.createElementNS(NS,'circle');
    circle.setAttribute('cx',p.x);circle.setAttribute('cy',p.y);circle.setAttribute('r',r);
    let fill=nodeColor(n.type);
    if(n.cleared)fill='var(--map-line-cleared)';
    else if(!available)fill='var(--map-locked)';
    circle.setAttribute('fill',fill);
    circle.setAttribute('stroke', n.id===RUN.currentNodeId?'var(--text)':'var(--border)');
    circle.setAttribute('stroke-width', n.id===RUN.currentNodeId?'2.5':'1');
    g.appendChild(circle);
    if(available&&!n.cleared){
      const glow=document.createElementNS(NS,'circle');
      glow.setAttribute('cx',p.x);glow.setAttribute('cy',p.y);glow.setAttribute('r',r+6);
      glow.setAttribute('fill','none');glow.setAttribute('stroke',fill);
      glow.setAttribute('stroke-width','1.5');glow.setAttribute('opacity','.45');
      svg.appendChild(glow);
    }
    const text=document.createElementNS(NS,'text');
    text.setAttribute('class', n.cleared?'':'map-node-icon');
    text.setAttribute('x',p.x);text.setAttribute('y',p.y+(n.cleared?4:5));text.setAttribute('text-anchor','middle');
    /* Locked nodes keep a dark, low-contrast fill circle, so their icon needs
       a light fill to stay legible; available/cleared nodes have a bright
       fill circle, so the icon stays dark. Inline style so it beats the
       ".map-node text{fill:...}" stylesheet rule. */
    text.style.fill = (available||n.cleared) ? 'var(--bg)' : 'var(--muted)';
    text.textContent = n.cleared? '✓' : nodeIcon(n.type);
    g.appendChild(text);
    g.addEventListener('click',function(){showNodePreviewModal(n,available);});
    svg.appendChild(g);
  });
}

function statusTooltip(s){
  if(s.type==='dot')return M('Burning: loses '+s.amount+' HP at the start of each turn.','Горит: теряет '+s.amount+' HP в начале каждого хода.');
  if(s.type==='stun')return M('Stunned: skips their next turn.','Оглушён: пропускает следующий ход.');
  if(s.type==='dodge')return M('Will dodge the next attack against them.','Уклонится от следующей атаки по себе.');
  if(s.type==='buff')return M(statAbbr(s.stat)+' '+(s.amount>0?'+':'')+s.amount+' for '+s.duration+' more turn(s).',statAbbr(s.stat)+' '+(s.amount>0?'+':'')+s.amount+' ещё '+s.duration+' ход(а/ов).');
  if(s.type==='debuff')return M(statAbbr(s.stat)+' '+s.amount+' for '+s.duration+' more turn(s).',statAbbr(s.stat)+' '+s.amount+' ещё '+s.duration+' ход(а/ов).');
  if(s.type==='mark'&&s.tag==='exposed')return M('Exposed: the next Backstab or Assassinate against them deals +40% bonus damage (combo).','Уязвим: следующий Удар в спину или Убийство по нему наносит +40% урона (комбо).');
  if(s.type==='mark'&&s.tag==='rally')return M("Vow of protection: this hero's next attack deals bonus damage (combo).","Клятва защиты: следующая атака этого героя наносит бонусный урон (комбо).");
  if(s.type==='mark'&&s.tag==='blessed')return M("Blessed: this hero's next attack deals +25% bonus damage (combo).","Благословение: следующая атака этого героя наносит +25% урона (комбо).");
  if(s.type==='mark'&&s.tag==='pinned')return M('Pinned: the next basic strike from Bram, Doran or Torvin against them deals +30% bonus damage (combo).','Пригвождён: следующий базовый удар Брама, Дорана или Торвина по нему наносит +30% урона (комбо).');
  if(s.type==='mark'&&s.tag==='scorched')return M("Scorched: Sael's next ranged attack against them deals +35% bonus damage (combo).",'Обожжён: следующая дальняя атака Саэль по нему наносит +35% урона (комбо).');
  if(s.type==='mark'&&s.tag==='staggered')return M("Staggered: Doran's next Claw Strike against them deals +25% bonus damage (combo).",'Сбит с ног: следующий Удар когтем Дорана по нему наносит +25% урона (комбо).');
  if(s.type==='mark'&&s.tag==='bleeding')return M("Bleeding: Morwen's next Withering Touch or Soul Siphon against them deals +25% bonus damage and extra lifesteal (combo).",'Кровотечение: следующее Иссушающее касание или Похищение душ Морвены по нему наносит +25% урона и лечит её сильнее (комбо).');
  return '';
}

}
function unitCard(unit,isTargetable,isAllyTargetable,intentBadge,isIntentTarget){
  const card=el('div','unit-card'+(unit.alive?'':' dead'));
  if(unit.uid)card.dataset.uid=unit.uid;
  if(RUN.combat.activeUnit===unit)card.classList.add('active-turn');
  if(isTargetable)card.classList.add('targetable');
  if(isAllyTargetable)card.classList.add('ally-targetable');
  if(isIntentTarget)card.classList.add('intent-target');
  const av=el('div','unit-avatar',avatarContent(unit));
  av.style.background=unit.color;
  if(intentBadge){
    const ib=el('span','intent-badge',intentIcon(intentBadge.type));
    ib.title=intentBadge.name;
    av.appendChild(ib);
  }
  if(!unit.isHero&&unit.res){
    /* res:'magic' units were built with high MDEF / low DEF (magic-resistant, armor-light) —
       so they're vulnerable to physical attacks. res:'phys' units are the reverse: hardy
       physical armor, thin magic wards, vulnerable to magic. Shown as a small corner badge
       so players can make an informed call without reading the bestiary. */
    const weak=unit.res==='magic'?'phys':'magic';
    const rb=el('span','res-badge weak-'+weak,weak==='phys'?'⚔':'✦');
    rb.title=weak==='phys'?M('Vulnerable to physical (STR) attacks','Уязвим к физическим атакам (СИЛА)'):M('Vulnerable to magic (INT) attacks','Уязвим к магическим атакам (ИНТ)');
    av.appendChild(rb);
  }
  card.appendChild(av);
  card.title=unit.isHero?(unit.name+' · '+unit.cls+' · '+M('Lv','Ур.')+' '+(unit.level||1)):unit.name;
  card.appendChild(el('div','unit-name',unit.name));
  if(unit.isHero)card.appendChild(el('div','unit-class',unit.cls+' · '+M('Lv','Ур.')+(unit.level||1)));
  card.appendChild(el('div','unit-row-tag',rowLabel(unit.row)+(unit.elite?(' · '+M('elite','элита')):'')+(unit.boss?(' · '+M('boss','босс')):'')));
  const pct=Math.max(0,unit.hp/unit.maxHp*100);
  const bar=el('div','hpbar');
  const fill=el('div','hpbar-fill'+(pct<30?' low':''));fill.style.width=pct+'%';
  bar.appendChild(fill);card.appendChild(bar);
  card.appendChild(el('div','hp-num',unit.hp+'/'+unit.maxHp));
  const icons=el('div','status-icons');
  unit.status.forEach(function(s){
    const cls=s.type==='dot'?'debuff':(s.type==='debuff'?'debuff':'buff');
    const sign=(typeof s.amount==='number')?(s.amount>0?'+':'')+s.amount+' ':'';
    const icon=el('span','status-icon '+cls, sign+(s.label||s.type)+' '+s.duration);
    icon.title=statusTooltip(s);
    icons.appendChild(icon);
  });
  card.appendChild(icons);
  if(isTargetable){card.addEventListener('click',function(){heroChooseTarget(unit);});}
  if(isAllyTargetable){card.addEventListener('click',function(){heroChooseTarget(unit);});}
  return card;
}

    if(ability.targets==='single')targetableEnemies=getValidTargets(ability,active);
    if(ability.targets==='single-ally')targetableAllies=getValidTargets(ability,active);
  }
  const intent=RUN.combat.enemyIntent;
  const intentUnit=intent?RUN.combat.enemies[intent.enemyIdx]:null;
  const intentTarget=intent&&intent.targetSide?((intent.targetSide==='party'?RUN.combat.party:RUN.combat.enemies)[intent.targetIdx]):null;
  const eb=$('enemy-row-back'),ef=$('enemy-row-front');

/* ============================= RUN END ============================= */

function computeEmbers(win){
  const allNodes = mapAllNodes(RUN.map);
  const cleared = allNodes.filter(function(n){return n.cleared;}).length;
  let embers = cleared*2 + RUN.ascension*3;
  if(win)embers+=15;
  return Math.max(1,Math.round(embers));
}
function renderAchievementUnlocks(unlocked){
  const box=$('go-achievements');box.innerHTML='';
  if(!unlocked.length)return;
  box.appendChild(el('div','eyebrow',M('Achievements unlocked','Открытые достижения')));
  unlocked.forEach(function(a){
    box.appendChild(el('div','card',
      "<strong>"+L(a.name)+"</strong> <span class='gold-badge'>+"+a.reward+M(' embers',' угольков')+"</span><br><span style='color:var(--muted);font-size:12px;'>"+L(a.desc)+"</span>"
    ));
  });
}
function onVictory(){
  const embers=computeEmbers(true);
  META.embers+=embers;
  META.wins++;
  META.bestLayer=Math.max(META.bestLayer,TOTAL_STEPS);
  META.ascensionUnlocked=Math.max(META.ascensionUnlocked,Math.min(5,RUN.ascension+1));
  if(RUN.daily){META.dailyLastDate=RUN.daily;META.dailyLastResult={win:true,layer:TOTAL_STEPS};META.embers+=10;META.dailyWinsCount=(META.dailyWinsCount||0)+1;restoreRandom();}
  const unlocked=evaluateAchievements(true);
  checkHeroUnlocks();
  recordRunHistory(true,embers);
  saveMeta();
  clearRun();
  $('go-banner').textContent=M('The March is Won','Поход завершён победой');
  $('go-banner').className='gameover-banner win';
  $('go-text').textContent=M(
    'The company breaks through the last of the ash and finds open sky. The road behind them is finally quiet.',
    'Отряд пробивается сквозь последний пепел и находит открытое небо. Дорога позади них наконец затихает.'
  );
  $('go-layers').textContent=TOTAL_STEPS+' / '+TOTAL_STEPS;
  $('go-embers').textContent=embers;
  renderAchievementUnlocks(unlocked);
  /* Endless March: offered only right after beating the final boss — the run's party,
     gold and gear are still in memory (clearRun() above only drops the localStorage
     checkpoint), so pressing on just keeps using them for one more scaled fight at a
     time instead of ending the session here. */
  $('btn-go-endless').hidden=false;
  show('screen-gameover');
  SFX.victory();
}
/* Starts (or resumes, after a reload) the Endless March: an unbroken chain of
   scaled battle encounters past the final boss, ending only when the company
   falls. See buildEndlessEncounter()/nextEndlessEncounter()/finishRewardNode(). */
function startEndlessMode(){
  if(!RUN||!RUN.party||!RUN.party.length)return;
  RUN.endless=true;
  RUN.endlessDepth=0;
  RUN.combat=null;
  RUN.pendingReward=null;
  saveRun();
  nextEndlessEncounter();
}
function nextEndlessEncounter(){
  const depth=RUN.endlessDepth||0;
  const node={id:'endless-'+depth,type:'battle',layer:TOTAL_MAP_LAYERS+depth,endless:true,endlessDepth:depth,cleared:false,next:[]};
  startCombat(node);
}
function onDefeat(){
  $('btn-go-endless').hidden=true;
  const endlessRun=!!(RUN&&RUN.endless);
  const depth=(RUN&&RUN.endlessDepth)||0;
  const embers=computeEmbers(false)+(endlessRun?depth*3:0);
  META.embers+=embers;
  META.bestLayer=Math.max(META.bestLayer,RUN.layersCleared);
  if(endlessRun){
    META.bestEndlessDepth=Math.max(META.bestEndlessDepth||0,depth);
    recordEndlessDepth(depth);
  }
  if(RUN.daily){META.dailyLastDate=RUN.daily;META.dailyLastResult={win:false,layer:RUN.layersCleared};META.embers+=5;restoreRandom();}
  const unlocked=evaluateAchievements(false);
  checkHeroUnlocks();
  recordRunHistory(false,embers,endlessRun?depth:null);
  saveMeta();
  clearRun();
  if(endlessRun){
    $('go-banner').textContent=M('The Endless March Ends','Бесконечный поход завершён');
    $('go-banner').className='gameover-banner lose';
    $('go-text').textContent=M(
      'The company falls '+depth+' fight'+(depth===1?'':'s')+' beyond the March. Best depth so far: '+(META.bestEndlessDepth||0)+'.',
      'Отряд пал, пройдя '+depth+' боёв сверх похода. Лучшая глубина: '+(META.bestEndlessDepth||0)+'.'
    );
    $('go-layers').textContent=(TOTAL_STEPS+depth)+' / ∞';
  } else {
    $('go-banner').textContent=M('The Company Falls','Отряд погиб');
    $('go-banner').className='gameover-banner lose';
    $('go-text').textContent=M(
      'The ash takes what remains. Somewhere behind, the next company is already being mustered.',
      'Пепел забирает всё, что осталось. Где-то позади уже собирают следующий отряд.'
    );
    $('go-layers').textContent=(RUN.layersCleared)+' / '+TOTAL_STEPS;
  }
  $('go-embers').textContent=embers;
  renderAchievementUnlocks(unlocked);
  show('screen-gameover');
  SFX.defeat();
}

/* Achievements list can get long once most are unlocked; collapsed by default
   to just the unlocked ones + a summary count, with a button to reveal the
   locked ones too. Not persisted — resets to collapsed each visit, which is
   fine since it's a display preference, not progress. */
let achievementsExpanded=false;
let legacyActiveTab='upgrades';
function applyLegacyTabUI(){
  document.querySelectorAll('#legacy-tabs .legacy-tab').forEach(function(btn){
    btn.classList.toggle('active', btn.dataset.tab===legacyActiveTab);
  });
  document.querySelectorAll('.legacy-tab-panel').forEach(function(panel){
    panel.hidden = panel.dataset.tab!==legacyActiveTab;
  });
}
function renderLegacy(){
  $('leg-embers').textContent=META.embers;
  const acctEl=$('legacy-account-user');
  if(acctEl)acctEl.textContent=CURRENT_USER?M('Logged in as ','Вы вошли как ')+CURRENT_USER:'';
  const up=$('leg-upgrades');up.innerHTML='';
  function reqMet(def){
    if(def.requires)return (META.upgrades[def.requires.key]||0)>=def.requires.rank;
    if(def.requires2)return def.requires2.every(function(r){return (META.upgrades[r.key]||0)>=r.rank;});
    return true;
  }
  function reqLabel(def){
    const reqs=def.requires?[def.requires]:(def.requires2||[]);
    return reqs.map(function(r){const rd=UPGRADE_DEFS.find(function(d){return d.key===r.key;});return L(rd.name)+' '+M('rank ','ур. ')+r.rank;}).join(' + ');
  }
  UPGRADE_DEFS.forEach(function(def){
    const rank=META.upgrades[def.key]||0;
    const maxed=rank>=def.max;
    const cost=def.cost(rank);
    const locked=!reqMet(def);
    const row=el('div','upgrade-row'+(locked?' locked':''));
    const dots=el('div','stack-dots');
    for(let i=0;i<def.max;i++)dots.appendChild(el('span','stack-dot'+(i<rank?' filled':'')));
    const branchTag=(def.requires||def.requires2)?("<span style='color:var(--accent,var(--good));font-size:11px;'>&#9492;&#9472; "+M('Branch','Ветка')+"</span> "):'';
    const reqText=locked?("<br><span style='color:var(--danger);font-size:11px;'>"+M('Requires: ','Требуется: ')+reqLabel(def)+"</span>"):'';
    const left=el('div','',branchTag+"<strong>"+L(def.name)+"</strong><br><span style='color:var(--muted);font-size:12px;'>"+L(def.desc)+"</span>"+reqText);
    left.style.flex='1';
    row.appendChild(left);
    row.appendChild(dots);
    const btn=el('button',maxed||locked?'':'primary',locked?M('Locked','Заблокировано'):(maxed?M('Maxed','Максимум'):(M('Buy','Купить')+' · '+cost)));
    btn.disabled = maxed || locked || META.embers<cost;
    btn.addEventListener('click',function(){
      if(META.embers<cost||maxed||locked)return;
      META.embers-=cost;META.upgrades[def.key]=(META.upgrades[def.key]||0)+1;SFX.coin();saveMeta();renderLegacy();
    });
    row.appendChild(btn);
    up.appendChild(row);
  });
  const rec=$('leg-recruits');rec.innerHTML='';
  ['ashra','doran','morwen','torvin'].forEach(function(key){
    const def=HERO_DEFS[key];
    const owned=META.heroesUnlocked[key];
    const isNew=owned&&!(META.seenHeroes||[]).includes(key);
    const achId=HERO_UNLOCK_ACHIEVEMENT[key];
    const ach=ACHIEVEMENTS.find(function(a){return a.id===achId;});
    const row=el('div','upgrade-row'+(owned?'':' locked'));
    const reqText=owned?'':("<br><span style='color:var(--danger);font-size:11px;'>"+M('Requires achievement: ','Требуется трофей: ')+(ach?L(ach.name):achId)+"</span>");

    left.style.flex='1';
    row.appendChild(left);
    const btn=el('button','',owned?M('Recruited','Нанят'):M('Locked','Заблокировано'));
    btn.disabled=true;
    row.appendChild(btn);
    rec.appendChild(row);
  });
  const ascWrap=$('leg-ascension');ascWrap.innerHTML='';
  for(let i=-1;i<=5;i++){
    const locked=i>META.ascensionUnlocked;
    const label=i===-1?M('S','И'):i;
    const pip=el('div','asc-pip'+(locked?' locked':'')+(META.ascensionChoice===i?' selected':''),label);
    if(!locked)pip.addEventListener('click',function(){META.ascensionChoice=i;saveMeta();renderLegacy();});
    ascWrap.appendChild(pip);
  }
  const ascInfo=$('leg-ascension-info');
  if(ascInfo){
    const pct=Math.round(META.ascensionChoice*12);
    ascInfo.textContent=META.ascensionChoice===-1
      ? M('Story Mode: enemies have 12% less HP and ATK. A gentler march, no embers penalty.','Режим истории: у врагов на 12% меньше HP и атаки. Более спокойный поход, без штрафа к уголькам.')
      : META.ascensionChoice===0
      ? M('Ascension 0: no modifiers.','Сложность 0: без модификаторов.')
      : M('Ascension '+META.ascensionChoice+': enemies have +'+pct+'% HP and ATK, and you gain +'+(META.ascensionChoice*3)+' bonus embers per march.',
          'Сложность '+META.ascensionChoice+': у врагов +'+pct+'% к HP и атаке, а вы получаете +'+(META.ascensionChoice*3)+' угольков за поход.');
  }
  const modWrap=$('leg-modifiers');
  if(modWrap){
    modWrap.innerHTML='';
    MODIFIER_DEFS.forEach(function(md){
      const on=!!(META.modifiers&&META.modifiers[md.key]);
      const pip=el('div','mod-pip'+(on?' selected':''),"<strong>"+L(md.name)+"</strong><br><span style='font-size:11px;color:var(--muted);'>"+L(md.desc)+"</span>");
      pip.addEventListener('click',function(){
        META.modifiers=META.modifiers||{};
        META.modifiers[md.key]=!META.modifiers[md.key];
        saveMeta();renderLegacy();
      });
      modWrap.appendChild(pip);
    });
  }
  const statsBox=$('leg-stats');
  if(statsBox){
    const st=computeRunStats();
    if(!st.total){
      statsBox.innerHTML="<span style='color:var(--muted);font-size:12px;'>"+M('No completed marches yet — stats appear after your first one.','Пока нет завершённых походов — статистика появится после первого.')+"</span>";
    } else {
      const favDef=st.favKey?getHeroDef(st.favKey):null;
      const favName=favDef?L(favDef.name):st.favKey;
      const lines=[
        M('Marches completed: <strong>'+st.total+'</strong> ('+st.wins+' won, '+st.winRate+'%)','Завершено походов: <strong>'+st.total+'</strong> (побед: '+st.wins+', '+st.winRate+'%)'),
        st.avgLossLayer?M('Average layer on defeat: <strong>'+st.avgLossLayer+' / '+TOTAL_STEPS+'</strong>','Средний слой при поражении: <strong>'+st.avgLossLayer+' / '+TOTAL_STEPS+'</strong>'):null,
        favDef?M('Most-used hero: <strong>'+favName+'</strong> ('+st.favCount+' of '+st.heroRunsCounted+' tracked marches)','Чаще всего в отряде: <strong>'+favName+'</strong> ('+st.favCount+' из '+st.heroRunsCounted+' походов с данными)'):null,
        st.customRuns?M('Marches with a custom hero: <strong>'+st.customRuns+'</strong>','Походов с кастомным героем: <strong>'+st.customRuns+'</strong>'):null,
      ].filter(Boolean);
      statsBox.innerHTML=lines.map(function(l){return "<div style='font-size:12px;margin-bottom:4px;'>"+l+"</div>";}).join('');
    }
  }
  const histBox=$('leg-history');
  if(histBox){
    histBox.innerHTML='';

    if(!hist.length){
      histBox.appendChild(el('div','',"<span style='color:var(--muted);font-size:12px;'>"+M('No completed marches yet.','Пока нет завершённых походов.')+"</span>"));

        histBox.appendChild(row);
      });
    }
  }
  const endlessBoard=$('leg-endless-board');

      });
    }
  }
  const achBox=$('leg-achievements');

    const summary=$('leg-achievements-summary');

    const visible=achievementsExpanded?ACHIEVEMENTS:ACHIEVEMENTS.filter(function(a){return !!(META.achievements&&META.achievements[a.id]);});
    if(!visible.length){
      achBox.appendChild(el('div','',"<span style='color:var(--muted);font-size:12px;'>"+M('No achievements unlocked yet.','Пока нет открытых достижений.')+"</span>"));
    }
    visible.forEach(function(a){
      const unlocked=!!(META.achievements&&META.achievements[a.id]);
      const isNew=unlocked&&!(META.seenAchievements||[]).includes(a.id);
      const row=el('div','ach-row'+(unlocked?'':' locked'));
      row.appendChild(el('div','ach-icon',unlocked?'&#9733;':'&#128274;'));
      const info=el('div','',(isNew?"<span class='gold-badge' style='margin-right:6px;'>"+M('NEW','НОВОЕ')+"</span>":'')+"<strong>"+L(a.name)+"</strong><br><span style='color:var(--muted);font-size:12px;'>"+L(a.desc)+" &middot; +"+a.reward+M(' embers',' угольков')+"</span>");
      info.style.flex='1';

    const toggleBtn=$('btn-toggle-achievements');
    if(toggleBtn){
      const lockedCount=ACHIEVEMENTS.length-unlockedCount;
      if(lockedCount<=0){
        toggleBtn.hidden=true;
      }else{
        toggleBtn.hidden=false;
        toggleBtn.textContent=achievementsExpanded?M('Show unlocked only','Показать только открытые'):M('Show '+lockedCount+' locked','Показать заблокированные ('+lockedCount+')');
        toggleBtn.onclick=function(){achievementsExpanded=!achievementsExpanded;renderLegacy();};
      }
    }
    const newHeroes=Object.keys(META.heroesUnlocked).filter(function(k){return META.heroesUnlocked[k];});
    const newAch=ACHIEVEMENTS.filter(function(a){return META.achievements&&META.achievements[a.id];}).map(function(a){return a.id;});
    let sawSomethingNew=newHeroes.some(function(k){return !(META.seenHeroes||[]).includes(k);})||newAch.some(function(k){return !(META.seenAchievements||[]).includes(k);});
    if(sawSomethingNew){
      META.seenHeroes=newHeroes;META.seenAchievements=newAch;saveMeta();
    }
  }
  const bestiarySummary=$('leg-bestiary-summary');
  if(bestiarySummary){
    const total=Object.keys(ENEMY_DEFS).length+Object.keys(BOSS_DEFS).length;
    const known=Object.keys(META.bestiary||{}).length;
    bestiarySummary.textContent=known+' / '+total;
  }
  const bestiaryBtn=$('btn-open-bestiary');
  if(bestiaryBtn)bestiaryBtn.onclick=openBestiaryModal;
  const animBtn=$('btn-toggle-animations');
  if(animBtn){
    const on=META.settings.animations!==false;
    animBtn.classList.toggle('on',on);
  }
  const soundBtn=$('btn-toggle-sound');
  if(soundBtn){
    const on=META.settings.sound!==false;
    soundBtn.classList.toggle('on',on);
  }
  const sizeBtns=$('text-size-btns');
  if(sizeBtns){
    sizeBtns.innerHTML='';
    [{k:0.9,l:'S'},{k:1,l:'M'},{k:1.15,l:'L'}].forEach(function(opt){
      const b=el('button','seg-btn'+(META.settings.textScale===opt.k?' selected':''),opt.l);
      b.type='button';
      b.addEventListener('click',function(){META.settings.textScale=opt.k;saveMeta();applySettings();renderLegacy();});
      sizeBtns.appendChild(b);
    });
  }
  renderLangSwitch();
  applyLegacyTabUI();
  show('screen-legacy');
}

function exportSave(){
  let code='';
  try{code='EMBERMARCH1:'+btoa(unescape(encodeURIComponent(JSON.stringify(META))));}catch(e){code='';}
  const wrap=el('div','stack');
  wrap.appendChild(el('h3','',M('Export Save Code','Экспорт кода сохранения')));
  wrap.appendChild(el('div','',"<span style='color:var(--muted);font-size:12px;'>"+M('Copy this code and keep it somewhere safe. Paste it back in on another device to restore your progress.','Скопируйте этот код и сохраните его. Вставьте его на другом устройстве, чтобы восстановить прогресс.')+"</span>"));
  const ta=document.createElement('textarea');
  ta.className='save-code';ta.readOnly=true;ta.value=code;
  wrap.appendChild(ta);
  const row=el('div','row');
  const copyBtn=el('button','primary',M('Copy','Копировать'));
  copyBtn.addEventListener('click',function(){
    ta.select();
    try{navigator.clipboard&&navigator.clipboard.writeText(code);}catch(e){}
    try{document.execCommand('copy');}catch(e){}
    copyBtn.textContent=M('Copied!','Скопировано!');
  });
  const close=el('button','',M('Close','Закрыть'));
  close.addEventListener('click',closeModal);
  row.appendChild(copyBtn);row.appendChild(close);
  wrap.appendChild(row);
  openModal(wrap);
}
function importSave(){
  const wrap=el('div','stack');
  wrap.appendChild(el('h3','',M('Import Save Code','Импорт кода сохранения')));
  wrap.appendChild(el('div','',"<span style='color:var(--muted);font-size:12px;'>"+M('Pasting a code will overwrite your current progress on this device.','Вставка кода перезапишет текущий прогресс на этом устройстве.')+"</span>"));
  const ta=document.createElement('textarea');
  ta.className='save-code';ta.placeholder=M('Paste save code here…','Вставьте код сохранения сюда…');
  wrap.appendChild(ta);
  const err=el('div','',"");err.style.cssText='color:var(--danger);font-size:12px;min-height:14px;';
  wrap.appendChild(err);
  const row=el('div','row');
  const load=el('button','primary',M('Load','Загрузить'));
  load.addEventListener('click',function(){
    let raw=ta.value.trim();
    if(raw.indexOf('EMBERMARCH1:')===0)raw=raw.slice('EMBERMARCH1:'.length);
    try{
      const parsed=JSON.parse(decodeURIComponent(escape(atob(raw))));
      META=Object.assign(defaultMeta(),parsed,{upgrades:Object.assign(defaultMeta().upgrades,parsed.upgrades),heroesUnlocked:Object.assign(defaultMeta().heroesUnlocked,parsed.heroesUnlocked),customHeroes:parsed.customHeroes||[],achievements:parsed.achievements||{},history:parsed.history||[],theme:parsed.theme==='light'?'light':'dark',settings:Object.assign(defaultMeta().settings,parsed.settings),biomeChoice:BIOME_DEFS[parsed.biomeChoice]?parsed.biomeChoice:'ashfall',modifiers:Object.assign(defaultMeta().modifiers,parsed.modifiers),bestiary:parsed.bestiary||{},gearPresets:parsed.gearPresets||[]});
      saveMeta();applyTheme();applySettings();closeModal();renderLegacy();
    }catch(e){
      err.textContent=M('That code could not be read. Check for typos and try again.','Не удалось прочитать код. Проверьте на опечатки и попробуйте снова.');
    }
  });
  const cancel=el('button','',M('Cancel','Отмена'));
  cancel.addEventListener('click',closeModal);
  row.appendChild(load);row.appendChild(cancel);
  wrap.appendChild(row);
  openModal(wrap);
}

let heroSelectState=[];
function heroUnlockedForSelect(key){
  if(META.heroesUnlocked&&Object.prototype.hasOwnProperty.call(META.heroesUnlocked,key))return !!META.heroesUnlocked[key];
  return (META.customHeroes||[]).some(function(c){return c.id===key;});
}
function updateHeroSelectButtons(){
  $('btn-confirm-heroes').disabled=heroSelectState.length!==3;
  const saveBtn=$('btn-save-hero-preset');
  if(saveBtn)saveBtn.disabled=heroSelectState.length!==3;
}
function renderHeroPickCard(list,key,def,unlocked,isCustom){
  const card=el('div','hero-pick'+(unlocked?'':' locked'));
  if(unlocked&&heroSelectState.indexOf(key)>=0)card.classList.add('selected');
  const av=el('div','hero-avatar',def.custom?customPortraitSVG(def):(HERO_ICON_SVG[def.tplKey||key]||def.icon));av.style.background=def.color;
  card.appendChild(av);
  const info=el('div','hero-info');
  info.appendChild(el('div','name',L(def.name)+(unlocked?'':M(' (locked)',' (заблокировано)'))));
  info.appendChild(el('div','cls',L(def.cls)));
  const heroDt=HERO_DMG_TYPE[def.tplKey||key]||'str';
  const stats=el('div','hero-stats',statAbbr('hp')+' '+def.baseHp+' &middot; '+statAbbr(heroDt)+' '+(heroDt==='str'?def.baseStr:def.baseInt)+' &middot; '+statAbbr('def')+' '+def.baseDef+' &middot; '+statAbbr('spd')+' '+def.baseSpd);
  info.appendChild(stats);
  if(def.passive){
    const pd=customPassiveDef(def.passive);
    info.appendChild(el('div','cls',"<span style='color:var(--accent,var(--good));'>"+L(pd.name)+'</span> — '+L(pd.desc)));
  }
  card.appendChild(info);
  if(isCustom){
    const del=el('button','',M('Delete','Удалить'));
    del.style.cssText='flex-shrink:0;align-self:center;font-size:11px;padding:5px 8px;';
    del.addEventListener('click',function(e){
      e.stopPropagation();
      META.customHeroes=META.customHeroes.filter(function(c){return c.id!==key;});
      saveMeta();renderHeroSelect();
    });
    card.appendChild(del);
  }
  if(unlocked){
    card.addEventListener('click',function(){
      const idx=heroSelectState.indexOf(key);
      if(idx>=0)heroSelectState.splice(idx,1);
      else if(heroSelectState.length<3)heroSelectState.push(key);
      card.classList.toggle('selected',heroSelectState.indexOf(key)>=0);
      updateHeroSelectButtons();
    });
  }

/* ============================= ARENA (asynchronous PvP) =============================
   One persistent "champion" (1-3 heroes, snapshotted at save time) per account, kept on
   the server. Fighting pulls a random opponent's snapshot and plays it out locally with
   the exact same combat engine as a march — the opponent's heroes just sit on the
   'enemy' side of RUN.combat, AI-piloted by the same buildEnemyIntent()/enemyAct() the
   game already uses for monsters, since that logic only ever looks at unit.side and
   ability shapes, never at what kind of unit it is. No server-side combat simulation,
   no real-time connection: the result is reported back once, under a short-lived
   single-use token the server issued when the matchup was fetched (see arena/opponent

/* Builds a fresh, disposable RUN (isArenaTemp:true, never persisted — see saveRun())
   so the normal march combat engine can run a hero-vs-hero duel untouched: the
   opponent's snapshot heroes sit on RUN.combat.enemies with side:'enemy', which makes
   every existing enemy-AI function (buildEnemyIntent/enemyAct) pilot them exactly like
   it pilots monsters, since that code only ever looks at unit.side. */
function cloneArenaUnit(h,side){
  const c=JSON.parse(JSON.stringify(h));
  c.uid=nextUid();c.side=side;c.alive=true;c.hp=c.maxHp;c.status=[];c.usedPhoenix=false;
  if(!c.equip)c.equip={weapon:null,armor:null,trinket:null,relic:null};
  return c;
}
function startArenaCombat(){
  if(!ARENA_CHAMPION||!ARENA_OPPONENT)return;
  if(loadRun()){
    $('arena-body').innerHTML="<span style='color:var(--danger);'>"+M('Finish or abandon your current march first.','Сначала заверши или прерви текущий поход.')+"</span>";
    return;
  }
  const myHeroes=ARENA_CHAMPION.heroes.map(function(h){return cloneArenaUnit(h,'hero');});
  const oppHeroes=ARENA_OPPONENT.heroes.map(function(h){return cloneArenaUnit(h,'enemy');});
  RUN={isArenaTemp:true,party:myHeroes,gold:0,ascension:0,modifiers:{},biome:'ashfall',inventory:[],combat:null};
  RUN.combat={
    isArena:true,
    enemies:oppHeroes,
    party:RUN.party,
    queue:[],qi:0,round:1,log:[],
    selectedAbility:null,targetingUnit:null,over:false,autoBattle:false,
  };
  show('screen-combat');
  renderTopbar();
  $('tb-layer').textContent=M('Arena Duel','Арена — дуэль');
  logCombat(M(
    'The arena gates open — '+ARENA_OPPONENT.name+' ('+ARENA_OPPONENT.username+') steps forward.',
    'Ворота арены открываются — '+ARENA_OPPONENT.name+' ('+ARENA_OPPONENT.username+') выходит навстречу.'
  ));
  newRound();
}
function onArenaCombatEnd(didWin){
  logCombat(didWin?M('Victory! The crowd roars.','Победа! Толпа ревёт.'):M('Defeat. The company withdraws.','Поражение. Отряд отступает.'));
  const battleToken=ARENA_OPPONENT&&ARENA_OPPONENT.battleToken;
  const finish=function(ratingText){
    setTimeout(function(){
      RUN=null;
      ARENA_OPPONENT=null;
      ARENA_VIEW='hub';
      show('screen-arena');
      apiGetChampion().then(function(champ){ARENA_CHAMPION=champ;renderArenaBody();
        if(ratingText){const note=el('div','eyebrow',ratingText);$('arena-body').insertBefore(note,$('arena-body').firstChild);}
      }).catch(function(){renderArenaBody();});
    },900);
  };
  if(!battleToken){finish(null);return;}
  apiReportArena(battleToken,didWin?'win':'loss').then(function(res){
    const delta=res.ratingDelta;
    finish((delta>=0?'+':'')+delta+M(' rating (now ',' рейтинга (теперь ')+res.newRating+')');
  }).catch(function(){finish(M('Could not report the result to the server.','Не удалось отправить результат на сервер.'));});
}
/* ============================= LIVE PvP (real-time, server-authoritative) ============================= */
/* Companion to the async arena above: same saved ARENA_CHAMPION squad (first hero of it
   fights), but resolved live over a WebSocket against a human opponent instead of a
   snapshot. The SERVER computes every damage/heal/turn outcome (see live-pvp.js +
   combat-engine.js on the backend) — this client only displays what it's told and
   submits {abilityId,targetUid} on its own turn. It reuses the entire existing combat
   screen/engine machinery (unitCard, renderCombat, playCombatFx, heroChooseAbility/Target)
   the same way the async arena duel does (RUN.combat.isArena) via a parallel
   RUN.combat.isLivePvp flag — see resolveHeroAbility()'s branch near the bottom of the
   combat engine section, and liveStateToLocal() below for how server state becomes a
   normal-looking RUN.combat.party/enemies pair. */
let LIVE=null; // {ws,status,matchId,mySide,you,opponent,inviteCode,pendingPrompt}
function liveWsUrl(){return API_BASE.replace(/^http/,'ws')+'/arena/live?token='+encodeURIComponent(AUTH_TOKEN);}
function liveEnsure(onReady){
  if(LIVE&&LIVE.ws&&(LIVE.ws.readyState===WebSocket.OPEN||LIVE.ws.readyState===WebSocket.CONNECTING)){
    if(LIVE.status==='connected'||LIVE.status==='queued'||LIVE.status==='inviting'||LIVE.status==='in_match'){onReady&&onReady();return;}
    const prev=LIVE._onReady;LIVE._onReady=function(){prev&&prev();onReady&&onReady();};
    return;
  }
  LIVE={ws:null,status:'connecting',matchId:null,mySide:null,you:null,opponent:null,inviteCode:null,pendingPrompt:null,_onReady:onReady};
  let ws;
  try{ws=new WebSocket(liveWsUrl());}catch(e){LIVE.status='error';renderLiveDuelPanel();return;}
  LIVE.ws=ws;
  ws.addEventListener('open',function(){});
  ws.addEventListener('close',function(){
    const wasInMatch=LIVE&&LIVE.status==='in_match';
    if(LIVE)LIVE.status='disconnected';
    if(wasInMatch&&RUN&&RUN.combat&&RUN.combat.isLivePvp&&!RUN.combat.over){
      logCombat(M('Connection to the arena lost.','Соединение с ареной потеряно.'));
    }
    if($('arena-body')&&!$('screen-arena').hidden)renderLiveDuelPanel();
  });
  ws.addEventListener('error',function(){});
  ws.addEventListener('message',function(ev){
    let msg;try{msg=JSON.parse(ev.data);}catch(e){return;}
    liveHandleMessage(msg);
  });
  ws.addEventListener('message',function onFirst(ev){
    let msg;try{msg=JSON.parse(ev.data);}catch(e){return;}
    if(msg.type==='auth_ok'){
      ws.removeEventListener('message',onFirst);
      LIVE.status='connected';
      const cb=LIVE._onReady;LIVE._onReady=null;
      cb&&cb();
    }
  });
}
function liveClose(){
  if(LIVE&&LIVE.ws){try{LIVE.ws.close();}catch(e){}}

}
function liveSend(obj){
  if(!LIVE||!LIVE.ws||LIVE.ws.readyState!==WebSocket.OPEN)return;
  LIVE.ws.send(JSON.stringify(obj));
}
/* Converts the server's side-neutral {party,enemies} (labelled 'hero'/'enemy' once at
   match creation, fixed for the whole match) into the local convention the rest of the
   combat engine expects: RUN.combat.party is always *my* unit(s), RUN.combat.enemies is
   always the *opponent's* — exactly how the async arena duel already sets things up
   (cloneArenaUnit), so unitCard/getValidTargets/abilityHasTargets/heroChooseAbility all
   just work unmodified. */
function liveStateToLocal(state,mySide){
  const mine=(mySide==='hero'?state.party:state.enemies).map(function(u){return Object.assign({},u,{side:'hero'});});
  const theirs=(mySide==='hero'?state.enemies:state.party).map(function(u){return Object.assign({},u,{side:'enemy'});});
  return {party:mine,enemies:theirs};
}
function liveFindLocalUnit(uid){
  if(!RUN||!RUN.combat)return null;
  return RUN.combat.party.concat(RUN.combat.enemies).find(function(u){return u.uid===uid;});
}
function liveHandleMessage(msg){
  if(!LIVE)return;
  if(msg.type==='auth_ok'){LIVE.status='connected';return;}
  if(msg.type==='queue_joined'){LIVE.status='queued';renderLiveDuelPanel();return;}
  if(msg.type==='queue_left'){LIVE.status='connected';renderLiveDuelPanel();return;}
  if(msg.type==='invite_created'){LIVE.status='inviting';LIVE.inviteCode=msg.code;renderLiveDuelPanel();return;}
  if(msg.type==='error'){
    if(RUN&&RUN.combat&&RUN.combat.isLivePvp){logCombat(M('Server: ','Сервер: ')+msg.message);RUN.combat.phase='hero_choose';renderActionPanel();}
    else{const body=$('arena-body');if(body){const n=el('div','',"<span style='color:var(--danger);'>"+msg.message+"</span>");body.insertBefore(n,body.firstChild);}}
    return;
  }
  if(msg.type==='match_found'){
    LIVE.status='in_match';LIVE.matchId=msg.matchId;LIVE.mySide=msg.side;LIVE.you=msg.you;LIVE.opponent=msg.opponent;
    liveStartCombatScreen(msg.state);
    return;
  }
  if(msg.type==='turn_prompt'){
    liveApplyTurnPrompt(msg);
    return;
  }
  if(msg.type==='combat_log'){
    (msg.logs||[]).forEach(function(l){logCombat(L(l));});
    if(RUN&&RUN.combat&&RUN.combat.isLivePvp){
      const loc=liveStateToLocal(msg.state,LIVE.mySide);
      RUN.combat.party=loc.party;RUN.combat.enemies=loc.enemies;
      renderCombat();
      playCombatFx((msg.fx||[]).map(function(f){return Object.assign({},f,{text:f.text?L(f.text):undefined});}));
    }
    return;
  }
  if(msg.type==='opponent_disconnected'){
    if(RUN&&RUN.combat&&RUN.combat.isLivePvp)logCombat(M('Your opponent disconnected — waiting for them to return…','Соперник отключился — ждём возвращения…'));
    return;
  }
  if(msg.type==='opponent_disconnected_final'){
    if(RUN&&RUN.combat&&RUN.combat.isLivePvp)logCombat(M('Your opponent never reconnected.','Соперник так и не вернулся.'));
    return;
  }
  if(msg.type==='match_end'){
    liveOnMatchEnd(msg);
    return;
  }
}
function liveStartCombatScreen(state){
  if(loadRun()){
    liveSend({type:'forfeit'});
    return;
  }
  const loc=liveStateToLocal(state,LIVE.mySide);
  RUN={isArenaTemp:true,party:loc.party,gold:0,ascension:0,modifiers:{},biome:'ashfall',inventory:[],combat:null};
  RUN.combat={
    isLivePvp:true,
    enemies:loc.enemies,
    party:RUN.party,
    queue:[],qi:0,round:1,log:[],
    selectedAbility:null,targetingUnit:null,over:false,autoBattle:false,
    activeUnit:null,activeHero:null,phase:'waiting',
  };
  show('screen-combat');
  renderTopbar();
  $('tb-layer').textContent=M('Live Duel','Живая дуэль');
  logCombat(M(
    'The live arena connects you to '+(LIVE.opponent&&LIVE.opponent.username)+' — the fight begins!',
    'Арена соединяет вас с '+(LIVE.opponent&&LIVE.opponent.username)+' — бой начинается!'
  ));
  renderCombat();
  renderActionPanel();
}
function liveApplyTurnPrompt(msg){
  if(!RUN||!RUN.combat||!RUN.combat.isLivePvp)return;
  const loc=liveStateToLocal(msg.state,LIVE.mySide);
  RUN.combat.party=loc.party;RUN.combat.enemies=loc.enemies;
  const unit=liveFindLocalUnit(msg.activeUid);
  RUN.combat.activeUnit=unit;
  RUN.combat.round=(RUN.combat.round||1);
  if(msg.yourTurn&&unit){
    RUN.combat.activeHero=unit;
    RUN.combat.phase='hero_choose';
    RUN.combat.selectedAbility=null;
    LIVE.pendingPrompt=msg;
  } else {
    RUN.combat.activeHero=null;
    RUN.combat.phase='enemy_turn';
    LIVE.pendingPrompt=null;
  }
  renderCombat();
  renderActionPanel();
}
/* Called from resolveHeroAbility() instead of the normal local-resolve path when
   RUN.combat.isLivePvp — see that function's branch. Sends the choice to the server and
   waits (phase 'hero_wait') for its authoritative combat_log + next turn_prompt instead
   of resolving anything locally. */
function liveResolveHeroAbility(ability,target){
  RUN.combat.selectedAbility=null;
  RUN.combat.phase='hero_wait';
  renderCombat();
  renderActionPanel();
  liveSend({type:'action',abilityId:ability.id,targetUid:target?target.uid:null});
}
function liveOnMatchEnd(msg){
  if(RUN&&RUN.combat)RUN.combat.over=true;
  const resultText=msg.result==='win'?M('Victory! The crowd roars.','Победа! Толпа ревёт.')
    :msg.result==='loss'?M('Defeat. You withdraw from the arena.','Поражение. Вы покидаете арену.')
    :M('A draw — the match is called.','Ничья — поединок остановлен.');
  logCombat(resultText);
  const ratingText=(typeof msg.ratingDelta==='number'&&msg.ratingDelta!==0)
    ? (msg.ratingDelta>=0?'+':'')+msg.ratingDelta+M(' rating (now ',' рейтинга (теперь ')+msg.newRating+')'
    : null;
  setTimeout(function(){
    RUN=null;
    LIVE.status='connected';LIVE.matchId=null;LIVE.mySide=null;LIVE.opponent=null;
    ARENA_VIEW='hub';
    show('screen-arena');
    apiGetChampion().then(function(champ){
      ARENA_CHAMPION=champ;renderArenaBody();renderLiveDuelPanel();
      if(ratingText){const note=el('div','eyebrow',ratingText);$('arena-body').insertBefore(note,$('arena-body').firstChild);}
    }).catch(function(){renderArenaBody();renderLiveDuelPanel();});
  },900);
}

  RUN.combat.autoBattle=!RUN.combat.autoBattle;
  if(RUN.combat.autoBattle&&RUN.combat.phase==='hero_target'){
    // Cancel any pending manual target selection so auto-battle can't get stuck
    // waiting for a click that will never come.
    RUN.combat.selectedAbility=null;
    RUN.combat.phase='hero_choose';
    renderActionPanel();renderCombat();
  }
  updateAutoBattleButton();
  saveRun();
  if(RUN.combat.autoBattle&&RUN.combat.phase==='hero_choose'&&RUN.combat.activeHero){
    setTimeout(function(){autoActHero(RUN.combat.activeHero);},400);
  }
});
$('btn-abandon').addEventListener('click',function(){
  const wrap=el('div','stack');
  wrap.appendChild(el('h3','',M('Abandon this march?','Прервать этот поход?')));
  wrap.appendChild(el('div','',"<span style='color:var(--muted);font-size:13px;'>"+M('Your embers earned so far will still be banked, but the company disperses.','Заработанные угольки сохранятся, но отряд распустят.')+"</span>"));
  const row=el('div','row');
  const yes=el('button','danger-btn',M('Abandon','Прервать'));
  yes.addEventListener('click',function(){
    const embers=computeEmbers(false);
    META.embers+=embers;META.bestLayer=Math.max(META.bestLayer,RUN.layersCleared);
    if(RUN.daily){META.dailyLastDate=RUN.daily;META.dailyLastResult={win:false,layer:RUN.layersCleared};restoreRandom();}
    saveMeta();
    clearRun();closeModal();renderTitle();
  });
  const no=el('button','',M('Keep Going','Продолжить поход'));
  no.addEventListener('click',closeModal);
  row.appendChild(yes);row.appendChild(no);
  wrap.appendChild(row);
  openModal(wrap);
});
$('btn-leave-shop').addEventListener('click',function(){afterLeaveNode(RUN._shopNode);});
$('btn-rest-heal').addEventListener('click',function(){
  RUN.party.forEach(function(h){if(h.alive)h.hp=Math.min(h.maxHp,h.hp+Math.round(h.maxHp*0.35));});
  afterLeaveNode(RUN._restNode);
});
$('btn-rest-train').addEventListener('click',function(){
  promptChooseHero(M('Train whom?','Кого тренировать?'),function(h){const dt=dmgTypeOf(h);h[dt]=(h[dt]||0)+3;h.def+=1;afterLeaveNode(RUN._restNode);});
});
$('btn-go-continue').addEventListener('click',renderTitle);
$('btn-go-endless').addEventListener('click',startEndlessMode);
$('btn-theme-toggle').addEventListener('click',toggleTheme);
$('btn-toggle-animations').addEventListener('click',function(){
  META.settings.animations = META.settings.animations===false;
  saveMeta();applySettings();renderLegacy();
});
$('btn-toggle-sound').addEventListener('click',function(){
  META.settings.sound = META.settings.sound===false;
  saveMeta();renderLegacy();
  if(META.settings.sound!==false)SFX.click();
});
$('btn-export-save').addEventListener('click',exportSave);
$('btn-import-save').addEventListener('click',importSave);
let dailyPendingSeed=null;
$('btn-daily').addEventListener('click',function(){
  const today=todayDateStr();
  if(META.dailyLastDate===today){
    const res=META.dailyLastResult;
    const wrap=el('div','stack');
    wrap.appendChild(el('h3','',M("Today's Challenge",'Испытание дня')));
    wrap.appendChild(el('div','',"<span style='color:var(--muted);font-size:13px;'>"+(res&&res.win?M("You've already completed today's challenge. Come back tomorrow for a new march!","Вы уже прошли сегодняшнее испытание. Возвращайтесь завтра за новым походом!"):M("You've already attempted today's challenge. Come back tomorrow for a new march!","Вы уже пытались пройти сегодняшнее испытание. Возвращайтесь завтра за новым походом!"))+"</span>"));
    const close=el('button','primary',M('Got it','Понятно'));
    close.addEventListener('click',closeModal);
    wrap.appendChild(close);
    openModal(wrap);
    return;
  }
  dailyPendingSeed=today;
  renderHeroSelect();
});
document.addEventListener('keydown',function(e){
  if(!RUN||!RUN.combat||RUN.combat.over)return;
  if(e.key==='Escape'&&RUN.combat.phase==='hero_target'){
    RUN.combat.selectedAbility=null;RUN.combat.phase='hero_choose';renderActionPanel();renderCombat();
    return;
  }
  if(RUN.combat.autoBattle)return;
  if(RUN.combat.phase!=='hero_choose'||!RUN.combat.activeHero)return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=9){
    const a=RUN.combat.activeHero.abilities[n-1];
    if(a)heroChooseAbility(a);
  }
});
window.addEventListener('beforeunload',function(e){
  if(RUN&&RUN.combat&&!RUN.combat.over){
    e.preventDefault();e.returnValue='';
    return '';
  }
});
function spawnEmberParticles(){
  const host=$('ember-particles');
  if(!host)return;
  host.innerHTML='';
  const n=14;
  for(let i=0;i<n;i++){
    const s=el('div','ember-spark');
    const dur=(10+Math.random()*12).toFixed(1)+'s';
    const delay=(-Math.random()*20).toFixed(1)+'s';
    const drift=Math.round((Math.random()*60-30))+'px';
    s.style.left=(Math.random()*100).toFixed(1)+'%';
    s.style.setProperty('--drift',drift);
    s.style.animationDuration=dur;
    s.style.animationDelay=delay;
    host.appendChild(s);
  }
}
$('auth-form').addEventListener('submit',onAuthSubmit);
$('auth-toggle-link').addEventListener('click',onAuthToggle);
$('btn-logout').addEventListener('click',doLogout);
$('btn-title-logout').addEventListener('click',doLogout);

applyStaticI18n();
applyTheme();
applySettings();
attemptSessionRestore();
spawnEmberParticles();
})();
</script>
