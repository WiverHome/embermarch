<title>Embermarch</title>
<style>
:root{
  --bg:#0c0a0d;
  --surface:#17141a;
  --surface2:#211c24;
  --surface3:#2b2430;
  --border:#3a3242;
  --text:#f3ead9;
  --muted:#a89a86;
  --accent:#ff8a4c;
  --accent-deep:#c9622e;
  --accent-soft:#3a2418;
  --accent2:#7bb0c9;
  --accent2-soft:#1c2f38;
  --good:#6fbb86;
  --good-soft:#1c2e22;
  --danger:#e2665c;
  --danger-soft:#331e1c;
  --gold:#e3b563;
  --title-glow:rgba(255,138,76,.14);
  --map-line:#3a3548;
  --map-line-cleared:#514a2c;
  --map-locked:#242030;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f7f1e6;
  --surface:#fffdf9;
  --surface2:#f2e8d6;
  --surface3:#e9dcc0;
  --border:#d8c8a4;
  --text:#2b2117;
  --muted:#7a6c53;
  --accent:#c9622e;
  --accent-deep:#a04d21;
  --accent-soft:#f3ddbb;
  --accent2:#3d7791;
  --accent2-soft:#d9ecf2;
  --good:#3f8a5a;
  --good-soft:#dcf0e1;
  --danger:#b8483f;
  --danger-soft:#f6dcd8;
  --gold:#a97a2e;
  --title-glow:rgba(201,98,46,.10);
  --map-line:#cdbb98;
  --map-line-cleared:#b79a58;
  --map-locked:#e9dcc0;
  color-scheme:light;
}
*{box-sizing:border-box;}
html{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Work Sans',system-ui,sans-serif;
  padding-inline:16px;
  min-height:100%;
  margin:0;
  overflow-x:hidden;
}
h1,h2,h3,.display{
  font-family:'Cormorant Garamond','Marcellus',serif;
  font-weight:600;
  letter-spacing:.02em;
  text-wrap:balance;
  margin:0;
}
.mono, .num{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
}
button{
  font-family:inherit;
  cursor:pointer;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  border-radius:8px;
  padding:10px 16px;
  font-size:14px;
  transition:background .15s,border-color .15s,transform .1s;
}
button:hover:not(:disabled){background:var(--surface3);border-color:var(--accent);}
button:active:not(:disabled){transform:translateY(1px);}
button:disabled{opacity:.4;cursor:not-allowed;}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));border-color:var(--accent);color:#1a0f07;font-weight:600;box-shadow:0 4px 16px -6px var(--title-glow);}
button.primary:hover:not(:disabled){background:linear-gradient(135deg,var(--accent),var(--accent-deep));filter:brightness(1.08);transform:translateY(-1px);}
:root[data-theme="light"] button.primary{color:#fff6e9;}
button.danger-btn{background:var(--danger-soft);border-color:var(--danger);}
#app{max-width:860px;margin:0 auto;padding:52px 16px 40px;box-sizing:border-box;zoom:calc(1.18 * var(--text-scale,1));}
#modal-root{zoom:calc(1.18 * var(--text-scale,1));}
@media (max-width:720px){
  #app{padding:56px 14px 32px;zoom:calc(1 * var(--text-scale,1));}
  #modal-root{zoom:calc(1 * var(--text-scale,1));}
  .title-actions{max-width:100%!important;}
  .title-foot{font-size:12px;padding:10px 14px;gap:10px 14px;}
  section h2{word-break:break-word;}
}
[hidden]{display:none!important;}
html.no-anim *,html.no-anim *::before,html.no-anim *::after{transition:none!important;animation:none!important;}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.seg-btns{display:flex;gap:4px;}
.seg-btn{border-radius:7px;padding:6px 11px;font-size:12px;}
.seg-btn.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.toggle-switch{width:40px;height:22px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);position:relative;cursor:pointer;padding:0;}
.toggle-switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:left .15s ease,background .15s ease;}
.toggle-switch.on{border-color:var(--accent);background:var(--accent-soft);}
.toggle-switch.on .knob{left:20px;background:var(--accent);}
.ach-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);}
.ach-row:last-child{border-bottom:none;}
.ach-row.locked{opacity:.4;}
.ach-icon{width:26px;height:26px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--surface2);border:1px solid var(--border);}
.ach-row:not(.locked) .ach-icon{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
textarea.save-code{width:100%;box-sizing:border-box;min-height:90px;font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;resize:vertical;}

.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
}
.level-up-card{border-color:var(--accent);background:var(--accent-soft);}
.level-up-card .row{margin-top:8px;}
.xp-bar{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;margin-top:2px;}
.xp-bar-fill{height:100%;background:var(--accent2);}
.stack{display:flex;flex-direction:column;gap:12px;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;}

/* ---- language switch ---- */
.lang-switch{display:flex;gap:6px;justify-content:center;margin-bottom:16px;}
.lang-btn{padding:5px 14px;font-size:11px;border-radius:99px;}
.lang-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}

/* ---- title ---- */
#screen-title{text-align:center;padding-top:4vh;position:relative;}
#screen-title::before{content:'';position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:640px;height:420px;max-width:90vw;background:radial-gradient(ellipse at center, var(--title-glow), transparent 70%);pointer-events:none;z-index:-1;}
#screen-title h1{font-size:clamp(38px,10vw,58px);font-weight:600;letter-spacing:.03em;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 40%,#fff) 0%,var(--gold) 45%,var(--accent-deep) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
#screen-title .tagline{color:var(--muted);margin-top:6px;font-size:15px;font-style:italic;}
.title-actions{margin-top:24px;display:flex;flex-direction:column;gap:10px;max-width:280px;margin-inline:auto;}
.title-actions button{padding:14px;font-size:15px;}
.title-foot{margin-top:20px;color:var(--muted);font-size:12px;line-height:1.6;display:inline-flex;gap:18px;padding:12px 20px;background:var(--surface);border:1px solid var(--border);border-radius:12px;flex-wrap:wrap;justify-content:center;}

/* ---- topbar ---- */
#topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;margin-bottom:16px;font-size:13px;gap:10px;flex-wrap:wrap;
}
#topbar .partybit{display:flex;gap:8px;}
.pb-hp{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);}
.pb-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Marcellus',serif;font-size:13px;color:#12141a;font-weight:700;}
.pb-dot svg,.hero-avatar svg,.unit-avatar svg,.to-item svg{width:62%;height:62%;display:block;}
.gold-badge{color:var(--gold);font-family:'JetBrains Mono',monospace;font-weight:600;}

/* ---- map ---- */
.map-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;overflow-x:auto;}
.map-svg{display:block;height:220px;width:auto;max-width:none;}
.map-node{cursor:pointer;}
.map-node.locked{cursor:default;}
.map-node text{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.05em;fill:var(--bg);font-weight:700;}
.map-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;}

/* ---- hero select / formation ---- */
.hero-pick{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;}
.hero-pick.selected{border-color:var(--accent);background:var(--accent-soft);}
.hero-pick.locked{opacity:.45;cursor:not-allowed;}
.hero-pick-add{border-style:dashed;justify-content:center;color:var(--accent2);font-family:'Marcellus',serif;font-size:15px;}
.hero-pick-add:hover{border-color:var(--accent);background:var(--accent-soft);}
.hero-avatar{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Marcellus',serif;font-size:18px;color:#12141a;font-weight:700;flex-shrink:0;}
.hero-info{flex:1;min-width:0;}
.hero-info .name{font-family:'Marcellus',serif;font-size:16px;}
.hero-info .cls{color:var(--muted);font-size:12px;}
.hero-stats{display:flex;gap:10px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}

/* ---- combat ---- */
.combat-zone{
  display:grid;
  grid-template-columns:1fr 1.15fr;
  grid-template-areas:"left right";
  gap:14px;
  align-items:start;
}
.combat-left{grid-area:left;display:flex;flex-direction:column;gap:14px;min-width:0;}
.combat-right{grid-area:right;display:flex;flex-direction:column;gap:14px;min-width:0;}
@media (max-width:680px){
  .combat-zone{grid-template-columns:1fr;grid-template-areas:"right" "left";}
}
.unit-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.unit-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:9px 8px;width:122px;text-align:center;position:relative;transition:box-shadow .15s,border-color .15s;
}
.unit-card.dead{opacity:.35;}
.unit-card.active-turn{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.unit-card.targetable{border-color:var(--danger);cursor:pointer;box-shadow:0 0 0 2px var(--danger-soft);}
.unit-card.ally-targetable{border-color:var(--good);cursor:pointer;box-shadow:0 0 0 2px var(--good-soft);}
.unit-avatar{width:36px;height:36px;border-radius:8px;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-family:'Marcellus',serif;font-size:16px;color:#12141a;font-weight:700;position:relative;}
.intent-badge{position:absolute;bottom:-4px;right:-6px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text);font-family:inherit;font-weight:400;}
.unit-card.intent-target{box-shadow:0 0 0 2px var(--gold);}
.unit-name{font-size:11.5px;font-weight:600;line-height:1.25;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;}
.unit-class{font-size:9.5px;color:var(--accent2);margin-top:1px;}
.unit-row-tag{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:1px;}
.hpbar{height:6px;border-radius:3px;background:var(--bg);margin-top:4px;overflow:hidden;}
.hpbar-fill{height:100%;background:var(--good);transition:width .25s;}
.hpbar-fill.low{background:var(--danger);}
.hp-num{font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px;}
.status-icons{display:flex;gap:2px;justify-content:center;margin-top:3px;flex-wrap:wrap;}
.status-icon{font-size:9px;padding:1px 3px;border-radius:3px;background:var(--surface3);color:var(--muted);}
.status-icon.buff{color:var(--good);}
.status-icon.debuff{color:var(--danger);}

.enemy-zone{background:var(--danger-soft);border:1px solid #4a2f2e;border-radius:12px;padding:12px;}
.ally-zone{background:var(--good-soft);border:1px solid #2c4636;border-radius:12px;padding:12px;}
.zone-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:'JetBrains Mono',monospace;}

#combat-log{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;font-size:12.5px;color:var(--muted);max-height:180px;min-height:60px;overflow-y:auto;
  display:flex;flex-direction:column-reverse;gap:5px;line-height:1.4;
}
#combat-log .l-new{color:var(--text);}

.turn-order{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
.to-item{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;position:relative;
  display:flex;align-items:center;justify-content:center;font-family:'Marcellus',serif;
  font-size:13px;font-weight:700;color:#12141a;opacity:.4;transition:opacity .15s;
}
.to-item.current{opacity:1;box-shadow:0 0 0 2px var(--accent);}
.to-item.dead{opacity:.15;text-decoration:line-through;}
.to-badge{
  position:absolute;bottom:-3px;right:-3px;background:var(--bg);border:1px solid var(--border);
  border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:8px;line-height:1;
  padding:1px 2px;color:var(--text);font-weight:700;
}

.ability-bar{display:flex;gap:8px;flex-wrap:wrap;}
.ability-btn{
  flex:1;min-width:90px;text-align:left;padding:8px 10px;font-size:12px;position:relative;
}
.ability-btn .a-name{font-weight:600;display:block;}
.ability-btn .a-meta{font-size:10px;color:var(--muted);display:block;margin-top:2px;}
.ability-btn.selected{border-color:var(--accent);background:var(--accent-soft);}
.cd-badge{position:absolute;top:4px;right:6px;font-size:10px;color:var(--danger);font-family:'JetBrains Mono',monospace;}
.ult-tag{font-size:8px;color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:middle;}

/* ---- reward / shop / event ---- */
.card-choice{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:14px;text-align:left;width:100%;}
.card-choice:hover:not(:disabled){border-color:var(--accent);}
.item-tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;background:var(--surface3);color:var(--muted);margin-top:6px;}
.rarity-common{color:var(--muted);}
.rarity-rare{color:var(--accent2);}
.rarity-epic{color:var(--accent);}

.modal-backdrop{position:fixed;inset:0;background:rgba(10,11,15,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;}

.gameover-banner{font-size:26px;margin-bottom:6px;}
.gameover-banner.win{color:var(--gold);}
.gameover-banner.lose{color:var(--danger);}

.upgrade-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.upgrade-row:last-child{border-bottom:none;}
.stack-dots{display:flex;gap:4px;}
.stack-dot{width:8px;height:8px;border-radius:50%;background:var(--border);}
.stack-dot.filled{background:var(--accent);}

.asc-row{display:flex;gap:6px;}
.asc-pip{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-family:'JetBrains Mono',monospace;background:var(--surface2);}
.asc-pip.locked{opacity:.35;}
.asc-pip.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}

@media (max-width:480px){
  .unit-card{width:98px;}
  .ability-btn{min-width:100%;}
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">

<button id="btn-theme-toggle" title="Тема" aria-label="Переключить тему" style="position:fixed;top:14px;left:14px;z-index:50;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--surface2);border:1px solid var(--border);color:var(--muted);"></button>

<div id="app">

  <div id="topbar" hidden>
    <div class="row">
      <span class="eyebrow">EMBERMARCH</span>
      <span class="mono" id="tb-layer" style="color:var(--muted);font-size:12px;"></span>
    </div>
    <div class="row">
      <span class="gold-badge" id="tb-gold"></span>
      <div class="partybit" id="tb-party"></div>
    </div>
  </div>

  <section id="screen-title">
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ru">Русский</button>
      <button class="lang-btn" data-lang="en">English</button>
    </div>
    <div class="eyebrow" id="title-eyebrow" style="margin-bottom:10px;"></div>
    <h1>EMBERMARCH</h1>
    <div class="tagline" id="title-tagline"></div>
    <div class="title-actions">
      <button class="primary" id="btn-continue" hidden></button>
      <button class="primary" id="btn-new-run"></button>
      <button id="btn-daily"></button>
      <button id="btn-open-legacy"></button>
    </div>
    <div class="title-foot" id="title-stats"></div>
    <div class="title-foot" id="title-daily-info" style="margin-top:8px;"></div>
  </section>

  <section id="screen-legacy" hidden>
    <h2 id="legacy-h2" style="color:var(--accent);margin-bottom:4px;"></h2>
    <div class="eyebrow" id="legacy-eyebrow" style="margin-bottom:14px;"></div>
    <div class="card stack">
      <div class="spread">
        <span id="legacy-embers-label"></span>
        <span class="gold-badge num" id="leg-embers"></span>
      </div>
    </div>
    <div class="card stack" style="margin-top:14px;">
      <h3 id="legacy-upgrades-h3" style="font-size:15px;"></h3>
      <div id="leg-upgrades"></div>
    </div>
    <div class="card stack" style="margin-top:14px;">
      <h3 id="legacy-recruits-h3" style="font-size:15px;"></h3>
      <div id="leg-recruits"></div>
    </div>
    <div class="card stack" style="margin-top:14px;">
      <h3 id="legacy-ascension-h3" style="font-size:15px;"></h3>
      <div class="eyebrow" id="legacy-ascension-eyebrow" style="margin-bottom:8px;"></div>
      <div class="asc-row" id="leg-ascension"></div>
      <div style="color:var(--muted);font-size:11px;margin-top:6px;" id="leg-ascension-info"></div>
    </div>
    <div class="card stack" style="margin-top:14px;">
      <h3 id="legacy-history-h3" style="font-size:15px;"></h3>
      <div class="stack" id="leg-history"></div>
    </div>
    <div class="card stack" style="margin-top:14px;">
      <h3 id="legacy-achievements-h3" style="font-size:15px;"></h3>
      <div id="leg-achievements"></div>
    </div>
    <div class="card stack" style="margin-top:14px;">
      <h3 id="legacy-settings-h3" style="font-size:15px;"></h3>
      <div class="settings-row">
        <span id="settings-animations-label"></span>
        <button class="toggle-switch" id="btn-toggle-animations" type="button"><span class="knob"></span></button>
      </div>
      <div class="settings-row">
        <span id="settings-textsize-label"></span>
        <div class="seg-btns" id="text-size-btns"></div>
      </div>
    </div>
    <div class="card stack" style="margin-top:14px;">
      <h3 id="legacy-save-h3" style="font-size:15px;"></h3>
      <div class="row">
        <button id="btn-export-save"></button>
        <button id="btn-import-save"></button>
      </div>
    </div>
    <div style="margin-top:16px;"><button id="btn-legacy-back"></button></div>
  </section>

  <section id="screen-hero-select" hidden>
    <h2 id="hero-select-h2" style="color:var(--accent);"></h2>
    <div class="eyebrow" id="hero-select-eyebrow" style="margin:6px 0 14px;"></div>
    <div class="stack" id="hero-pick-list"></div>
    <div class="row" style="margin-top:16px;">
      <button class="primary" id="btn-confirm-heroes" disabled></button>
      <button id="btn-back-title"></button>
    </div>
  </section>

  <section id="screen-map" hidden>
    <div class="map-wrap">
      <svg id="map-svg" class="map-svg" viewBox="0 0 400 100"></svg>
      <div class="map-legend">

/* ---- seeded RNG for daily challenge runs ---- */
let ORIG_MATH_RANDOM=null;
function xmur3(str){
  let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;};
}
function mulberry32(a){
  return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};
}
function todayDateStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function applyDailySeed(seedStr){
  if(!ORIG_MATH_RANDOM)ORIG_MATH_RANDOM=Math.random;
  Math.random=mulberry32(xmur3(seedStr)());
}
function restoreRandom(){
  if(ORIG_MATH_RANDOM){Math.random=ORIG_MATH_RANDOM;}

/* ============================= MAP GENERATION ============================= */

function clampIdx(i,n){return clamp(i,0,n-1);}

const LAYER_PLAN = [
  {count:3, pool:['battle','battle','event']},
  {count:4, pool:['battle','battle','event','shop']},
  {count:4, pool:['battle','event','elite','battle']},
  {count:4, pool:['battle','battle','event','elite','shop']},
  {count:3, pool:['battle','event','elite']},
  {count:3, pool:['battle','elite','event','shop']},
  {count:2, pool:['rest']},
];

function generateMap(){
  const layers=[];
  LAYER_PLAN.forEach(function(def,li){
    const nodes=[];
    for(let i=0;i<def.count;i++){
      const type=pick(def.pool);
      nodes.push({id:'L'+li+'N'+i,layer:li,idx:i,type:type,cleared:false,next:[]});
    }
    layers.push(nodes);
  });
  const hasShop=layers.some(function(l){return l.some(function(n){return n.type==='shop';});});
  if(!hasShop){
    const candidates=[];
    layers.forEach(function(l,li){if(li<layers.length-1)l.forEach(function(n){if(n.type!=='rest')candidates.push(n);});});
    if(candidates.length)pick(candidates).type='shop';
  }
  const bossNode={id:'BOSS',layer:layers.length,idx:0,type:'boss',cleared:false,next:[]};

  function connect(curNodes,nextNodes){
    curNodes.forEach(function(node,i){
      const nCur=curNodes.length,nNext=nextNodes.length;
      const base=nCur<=1?Math.floor(nNext/2):Math.round(i*(nNext-1)/(nCur-1));
      const targets={};targets[clampIdx(base,nNext)]=true;
      if(Math.random()<0.5)targets[clampIdx(base+(Math.random()<0.5?1:-1),nNext)]=true;
      node.next=Object.keys(targets).map(function(k){return nextNodes[+k].id;});
    });
    nextNodes.forEach(function(n,j){
      const has=curNodes.some(function(c){return c.next.indexOf(n.id)>=0;});
      if(!has){
        const nCur=curNodes.length,nNext=nextNodes.length;
        const base=nNext<=1?Math.floor(nCur/2):Math.round(j*(nCur-1)/(nNext-1));
        curNodes[clampIdx(base,nCur)].next.push(n.id);
      }
    });
  }
  for(let li=0;li<layers.length-1;li++)connect(layers[li],layers[li+1]);
  connect(layers[layers.length-1],[bossNode]);

  return {layers:layers,bossNode:bossNode};
}
function mapAllNodes(map){
  const all=[];
  map.layers.forEach(function(l){l.forEach(function(n){all.push(n);});});
  all.push(map.bossNode);
  return all;
}
function findNode(map,id){
  if(id==='BOSS')return map.bossNode;
  let found=null;
  map.layers.forEach(function(l){l.forEach(function(n){if(n.id===id)found=n;});});
  return found;
}

/* ---- in-run leveling ---- */
const LEVEL_PERKS=[
  {key:'atk',name:{en:'Might',ru:'Мощь'},desc:{en:'+2 ATK',ru:'+2 к атаке'},apply:function(h){h.atk+=2;}},
  {key:'def',name:{en:'Warding',ru:'Стойкость'},desc:{en:'+2 DEF',ru:'+2 к защите'},apply:function(h){h.def+=2;}},
  {key:'spd',name:{en:'Swiftness',ru:'Проворство'},desc:{en:'+1 SPD',ru:'+1 к скорости'},apply:function(h){h.spd+=1;}},
  {key:'hp',name:{en:'Vitality',ru:'Живучесть'},desc:{en:'+6 Max HP',ru:'+6 к макс. здоровью'},apply:function(h){h.maxHp+=6;h.hp+=6;}},
];
function xpToNext(level){return 18+(level-1)*14;}
function xpForNode(node){
  const tier=tierForLayer(node.layer);
  let base=10+tier*6;
  if(node.type==='elite')base=Math.round(base*1.6);
  return base;
}
function sampleTwoPerks(){
  const a=LEVEL_PERKS.map(function(p){return p.key;});
  const first=a.splice(Math.floor(Math.random()*a.length),1)[0];
  const second=a.splice(Math.floor(Math.random()*a.length),1)[0];
  return [first,second];
}
function normalizeLeveling(h){
  if(typeof h.level!=='number')h.level=1;
  if(typeof h.xp!=='number')h.xp=0;
}
function grantXpToHero(h,gain){
  normalizeLeveling(h);
  RUN.pendingLevelUps=RUN.pendingLevelUps||[];
  h.xp+=gain;
  while(h.xp>=xpToNext(h.level)){
    h.xp-=xpToNext(h.level);
    h.level++;
    RUN.pendingLevelUps.push({heroKey:h.key,heroName:h.name,level:h.level,options:sampleTwoPerks()});
  }
}
function awardXp(node){
  const gain=xpForNode(node);
  RUN.pendingLevelUps=RUN.pendingLevelUps||[];
  RUN.party.forEach(function(h){
    if(!h.alive)return;
    grantXpToHero(h,gain);
  });
}
/* Used outside the reward-screen flow (map events): resolves any resulting level-up
   immediately with a random perk instead of queuing a UI choice. Returns levels gained. */
function grantXpAutoResolve(h,gain){
  normalizeLeveling(h);
  h.xp+=gain;
  let leveled=0;
  while(h.xp>=xpToNext(h.level)){
    h.xp-=xpToNext(h.level);
    h.level++;
    leveled++;
    applyLevelPerkByKey(h,pick(sampleTwoPerks()));
  }
  return leveled;
}
function applyLevelPerkByKey(hero,key){
  const perk=LEVEL_PERKS.find(function(p){return p.key===key;});
  if(perk&&hero)perk.apply(hero);
}
function resolvePendingLevelUps(){
  (RUN.pendingLevelUps||[]).forEach(function(pl){
    const h=RUN.party.find(function(x){return x.key===pl.heroKey;});
    if(h)applyLevelPerkByKey(h,pick(pl.options));
  });
  RUN.pendingLevelUps=[];
}
function finishRewardNode(node){
  resolvePendingLevelUps();
  completeCurrentNode(node);
  goToMap();
}
function applyItemToHero(hero,item){
  const old=hero.equip[item.slot];
  if(old){
    hero.atk-=old.mods.atk||0;hero.def-=old.mods.def||0;hero.spd-=old.mods.spd||0;
    hero.maxHp-=old.mods.hp||0;hero.hp=Math.min(hero.hp,hero.maxHp);
  }
  hero.equip[item.slot]=item;
  hero.atk+=item.mods.atk||0;hero.def+=item.mods.def||0;hero.spd+=item.mods.spd||0;
  if(item.mods.hp){hero.maxHp+=item.mods.hp;hero.hp+=item.mods.hp;}
}

function hydrateParty(run){
  if(!run||!run.party)return;
  run.party.forEach(function(h){
    normalizeLeveling(h);
    if(h.equip&&h.equip.relic===undefined)h.equip.relic=null;
    const def=getHeroDef(h.key);
    if(!def)return;
    h.cls=L(def.cls);
    const cdMap={};
    (h.abilities||[]).forEach(function(a){cdMap[a.id]=a.cdLeft||0;});
    h.abilities=def.abilities.map(function(a){
      return Object.assign({},a,{name:L(a.name),desc:L(a.desc),cdLeft:cdMap[a.id]||0});
    });
  });
}

function startNewRun(heroKeys,dailySeed){
  if(dailySeed)applyDailySeed(dailySeed);
  const startGold=25+META.upgrades.packs*15;
  RUN={
    ascension:dailySeed?0:META.ascensionChoice,
    map:generateMap(),
    availableNodeIds:null,
    currentNodeId:null,
    party:heroKeys.map(makeHeroInstance),
    gold:startGold,
    layersCleared:0,
    combat:null,
    pendingReward:null,
    pendingItemPickup:null,
    heroDied:false,
    bossKey:pick(Object.keys(BOSS_DEFS)),
    daily:dailySeed||null,
  };
  RUN.availableNodeIds=RUN.map.layers[0].map(function(n){return n.id;});
  if(META.upgrades.favor>0){
    const item=randomItem();applyItemToHero(RUN.party[0],item);
  }
  if(dailySeed)restoreRandom();
  saveRun();

function tierForLayer(li){return li<2?1:(li<4?2:(li<6?3:4));}

function makeEnemyInstance(defKey){

function makeBossInstance(){
  const asc=1+RUN.ascension*0.12;
  const BOSS_DEF=BOSS_DEFS[RUN.bossKey]||BOSS_DEFS.warden;
  return {
    key:'boss',name:L(BOSS_DEF.name),icon:BOSS_DEF.icon,color:BOSS_DEF.color,isHero:false,side:'enemy',
    maxHp:Math.round(BOSS_DEF.hp*asc),hp:Math.round(BOSS_DEF.hp*asc),
    atk:Math.round(BOSS_DEF.atk*asc),def:BOSS_DEF.def,spd:BOSS_DEF.spd,row:'front',boss:true,
    abilities:BOSS_DEF.abilities.map(function(a){return Object.assign({},a,{name:L(a.name),cdLeft:0});}),
    status:[],alive:true,enraged:false,
  };
}
function disambiguateNames(list){
  const counts={};
  list.forEach(function(u){counts[u.name]=(counts[u.name]||0)+1;});
  const seen={};
  const roman=['I','II','III','IV','V'];
  list.forEach(function(u){
    if(counts[u.name]>1){
      seen[u.name]=(seen[u.name]||0)+1;
      u.name=u.name+' '+(roman[seen[u.name]-1]||seen[u.name]);
    }
  });
  return list;
}
function buildEncounter(node){
  const li=node.layer;
  const tier=tierForLayer(li);
  if(node.type==='boss')return disambiguateNames([makeBossInstance()]);
  if(node.type==='elite'){
    const eliteKey=tier<=1?'revenant':(tier===2?'revenant':(tier===3?'hand':'ashlord'));
    const minions={1:['grunt'],2:['grunt','archer','hound'],3:['wraith','caster'],4:['knight','banshee']}[tier];
    const list=[makeEnemyInstance(eliteKey)];
    if(Math.random()<0.7)list.push(makeEnemyInstance(pick(minions)));
    return disambiguateNames(list);
  }
  const pools={1:['grunt','archer'],2:['grunt','archer','hound','shaman'],3:['wraith','caster','hound','shaman'],4:['knight','banshee','wraith','caster']};
  const pool=pools[tier];
  const count=randInt(2,3);
  const list=[];
  for(let i=0;i<count;i++)list.push(makeEnemyInstance(pick(pool)));
  return disambiguateNames(list);
}

function hasRelic(unit,passive){
  return !!(unit&&unit.isHero&&unit.equip&&unit.equip.relic&&unit.equip.relic.passive===passive);
}
function dmgCalc(actor,target,mult){
  const atk=statOf(actor,'atk');
  let def=statOf(target,'def');
  if(hasRelic(target,'last_stand')&&target.hp/target.maxHp<0.25)def=Math.round(def*1.3);
  let base=Math.max(1,Math.round(atk*mult - def*0.5));
  base=Math.round(base*(0.88+Math.random()*0.24));
  let crit=false;
  let critChance=0.12+(hasRelic(actor,'crit_boost')?0.15:0);
  if(Math.random()<critChance){base=Math.round(base*1.5);crit=true;}
  return {amount:Math.max(1,base),crit:crit};
}
function frontAlive(list){return list.filter(function(c){return c.alive&&c.row==='front';});}
function backAlive(list){return list.filter(function(c){return c.alive&&c.row==='back';});}
function anyAlive(list){return list.filter(function(c){return c.alive;});}
/* "Nearest row": the front row if anyone's alive there, otherwise the back row acts as the front line. */
function nearestRowAlive(list){
  const f=frontAlive(list);
  return f.length?f:backAlive(list);
}

function getValidTargets(ability,caster){
  const enemySide=caster.side==='hero'?RUN.combat.enemies:RUN.combat.party;
  const allySide=caster.side==='hero'?RUN.combat.party:RUN.combat.enemies;
  if(ability.targets==='single-ally'||ability.targets==='all-ally')return anyAlive(allySide);
  if(ability.targets==='self')return [caster];
  if(ability.reach==='melee'){
    return nearestRowAlive(enemySide);
  }
  return anyAlive(enemySide);
}
function targetsForRow(ability,caster){
  if(ability.targets!=='row')return null;
  const enemySide=caster.side==='hero'?RUN.combat.enemies:RUN.combat.party;
  return nearestRowAlive(enemySide);
}
function abilityHasTargets(ability,caster){
  if(ability.targets==='row'){
    const enemySide=caster.side==='hero'?RUN.combat.enemies:RUN.combat.party;
    return nearestRowAlive(enemySide).length>0;
  }
  if(ability.targets==='single'||ability.targets==='single-ally'){
    return getValidTargets(ability,caster).length>0;
  }
  return true;
}

function applyAbilityEffect(caster,ability,target){
  const logs=[];
  if(ability.type==='damage'){
    const targets = ability.targets==='row'?targetsForRow(ability,caster):(ability.targets==='all'?anyAlive(caster.side==='hero'?RUN.combat.enemies:RUN.combat.party):[target]);
    if(!targets||!targets.length){
      logs.push(M(caster.name+"'s "+ability.name+' finds no one in range.',caster.name+' использует «'+ability.name+'», но там некого атаковать.'));
      return logs;
    }
    let totalDealt=0;
    targets.forEach(function(t){
      if(!t.alive)return;
      let mult=ability.mult;
      if(ability.bonusVsBack&&t.row==='back')mult+=ability.bonusVsBack;
      const burning=t.status.some(function(s){return s.type==='dot';});
      if(burning)mult*=1.25;
      const stunned=t.status.some(function(s){return s.type==='stun';});
      if(stunned)mult*=1.2;
      const dodged = t.status.some(function(s){return s.type==='dodge';});
      if(dodged){
        t.status=t.status.filter(function(s){return s.type!=='dodge';});
        logs.push(M(t.name+' dodges the attack!',t.name+' уклоняется от удара!'));
        return;
      }
      const r=dmgCalc(caster,t,mult);
      t.hp=Math.max(0,t.hp-r.amount);
      totalDealt+=r.amount;
      const tagEn=(r.crit?' (crit!)':'')+(burning?' (burning target, +25%!)':'')+(stunned?' (stunned target, +20%!)':'');
      const tagRu=(r.crit?' (крит!)':'')+(burning?' (горящая цель, +25%!)':'')+(stunned?' (оглушённая цель, +20%!)':'');
      logs.push(M(
        caster.name+"'s "+ability.name+' hits '+t.name+' for '+r.amount+tagEn+'.',
        caster.name+' использует «'+ability.name+'» и наносит '+t.name+' '+r.amount+' урона'+tagRu+'.'
      ));
      if(ability.lifesteal&&caster.alive){
        const heal=Math.max(1,Math.round(r.amount*ability.lifesteal));
        caster.hp=Math.min(caster.maxHp,caster.hp+heal);
        logs.push(M(caster.name+' drains '+heal+' HP from the wound.',caster.name+' поглощает '+heal+' HP из раны.'));
      }
      if(hasRelic(caster,'vampiric')&&caster.alive){
        const heal=Math.max(1,Math.round(r.amount*0.15));
        caster.hp=Math.min(caster.maxHp,caster.hp+heal);
        logs.push(M(caster.name+"'s Ember Charm heals them for "+heal+'.',caster.name+' исцеляется на '+heal+' благодаря Тлеющему талисману.'));
      }
      if(hasRelic(caster,'chill_on_hit')&&t.alive&&Math.random()<0.25){
        t.status.push({type:'stun',duration:1,label:M('stun','оглушение')});
        logs.push(M(caster.name+"'s Frostbrand Ring freezes "+t.name+' in place!',caster.name+' сковывает '+t.name+' Ледяным клеймом!'));
      }
      if(hasRelic(t,'thorns')&&caster!==t&&caster.alive){
        const reflect=Math.max(1,Math.round(r.amount*0.2));
        caster.hp=Math.max(0,caster.hp-reflect);
        logs.push(M(t.name+"'s Thorned Bangle reflects "+reflect+' damage onto '+caster.name+'.',t.name+' отражает '+reflect+' урона Браслетом с шипами обратно '+caster.name+'.'));
        if(caster.hp<=0&&caster.alive){caster.alive=false;if(caster.isHero)RUN.heroDied=true;logs.push(M(caster.name+' falls.',caster.name+' падает замертво.'));}
      }
      if(ability.dot){t.status.push({type:'dot',amount:ability.dot.amount,duration:ability.dot.duration,label:M('burn','ожог')});}
      if(ability.debuff){t.status.push({type:'debuff',stat:ability.debuff.stat,amount:ability.debuff.amount,duration:ability.debuff.duration,label:statAbbr(ability.debuff.stat)});}
      if(t.hp<=0&&t.alive){
        if(hasRelic(t,'revive')&&!t.usedPhoenix){
          t.usedPhoenix=true;t.hp=1;
          logs.push(M(t.name+"'s Phoenix Down flares — they cling to life at 1 HP!",t.name+' спасён Пером феникса — остаётся жить с 1 HP!'));
        } else {
          t.alive=false;if(t.isHero)RUN.heroDied=true;logs.push(M(t.name+' falls.',t.name+' падает замертво.'));
        }
      }
    });
  } else if(ability.type==='heal'){
    const targets=ability.targets==='all-ally'?anyAlive(caster.side==='hero'?RUN.combat.party:RUN.combat.enemies):[target];
    targets.forEach(function(t){
      if(!t.alive)return;
      const amt=Math.round(ability.flat+statOf(caster,'atk')*ability.mult);
      t.hp=Math.min(t.maxHp,t.hp+amt);
      logs.push(M(caster.name+' mends '+t.name+' for '+amt+'.',caster.name+' лечит '+t.name+' на '+amt+'.'));
    });
  } else if(ability.type==='buff'){
    const targets=ability.targets==='all-ally'?anyAlive(caster.side==='hero'?RUN.combat.party:RUN.combat.enemies):[caster];
    targets.forEach(function(t){t.status.push({type:'buff',stat:ability.stat,amount:ability.amount,duration:ability.duration,label:statAbbr(ability.stat)});});
    logs.push(M(caster.name+' uses '+ability.name+'.',caster.name+' использует «'+ability.name+'».'));
  } else if(ability.type==='debuff'){
    const targets = ability.targets==='all-ally'?anyAlive(caster.side==='hero'?RUN.combat.enemies:RUN.combat.party):[target];
    targets.forEach(function(t){t.status.push({type:'debuff',stat:ability.stat,amount:ability.amount,duration:ability.duration,label:statAbbr(ability.stat)});});
    logs.push(M(
      caster.name+' uses '+ability.name+' on '+(target?target.name:'the company')+'.',
      caster.name+' использует «'+ability.name+'» на '+(target?target.name:'весь отряд')+'.'
    ));
  } else if(ability.type==='special'&&ability.effect==='dodge'){
    caster.status.push({type:'dodge',duration:1,label:M('dodge','уклонение')});
    logs.push(M(caster.name+' readies to slip the next blow.',caster.name+' готовится уклониться от следующего удара.'));
  } else if(ability.type==='special'&&ability.effect==='stun'){
    if(target&&target.alive){
      target.status.push({type:'stun',duration:1,label:M('stun','оглушение')});
      logs.push(M(caster.name+' stuns '+target.name+'!',caster.name+' оглушает '+target.name+'!'));
    } else {
      logs.push(M(caster.name+' swings at nothing.',caster.name+' бьёт в пустоту.'));
    }
  } else if(ability.type==='swap_row'){
    if(target&&target.alive){
      target.row = target.row==='front'?'back':'front';
      logs.push(M(caster.name+' shoves '+target.name+' to the '+rowLabel(target.row)+' row!',caster.name+' толкает '+target.name+' в '+rowLabel(target.row)+' ряд!'));
    } else {
      logs.push(M(caster.name+' finds no one to shove.',caster.name+' не находит, кого толкнуть.'));
    }
  }
  return logs;
}

function tickStatus(unit){
  const logs=[];
  const keep=[];
  unit.status.forEach(function(s){
    if(s.type==='dot'){
      unit.hp=Math.max(0,unit.hp-s.amount);
      logs.push(M(unit.name+' burns for '+s.amount+'.',unit.name+' горит и получает '+s.amount+' урона.'));
      if(unit.hp<=0 && unit.alive){
        if(hasRelic(unit,'revive')&&!unit.usedPhoenix){
          unit.usedPhoenix=true;unit.hp=1;
          logs.push(M(unit.name+"'s Phoenix Down flares — they cling to life at 1 HP!",unit.name+' спасён Пером феникса — остаётся жить с 1 HP!'));
        } else {
          unit.alive=false;
          if(unit.isHero&&RUN.combat)RUN.heroDied=true;
          logs.push(M(unit.name+' falls.',unit.name+' падает замертво.'));
        }
      }
    }
    const nd=s.duration-1;
    if(nd>0)keep.push(Object.assign({},s,{duration:nd}));
  });
  unit.status=keep;
  return logs;
}

function buildTurnOrder(){
  const all=RUN.combat.party.concat(RUN.combat.enemies).filter(function(c){return c.alive;});
  all.sort(function(a,b){return statOf(b,'spd')-statOf(a,'spd');});
  return all;
}

function startCombat(node){
  RUN.combat={
    node:node,
    enemies:buildEncounter(node),
    party:RUN.party,
    queue:[],
    qi:0,
    round:1,
    log:[],
    selectedAbility:null,
    targetingUnit:null,
    over:false,
    autoBattle:false,
  };
  RUN.party.forEach(function(h){h.abilities.forEach(function(a){a.cdLeft=0;});h.status=[];});
  logCombat(M(
    'The company braces as '+RUN.combat.enemies.map(function(e){return e.name;}).join(', ')+' close in.',
    'Отряд готовится к бою: приближаются '+RUN.combat.enemies.map(function(e){return e.name;}).join(', ')+'.'
  ));
  show('screen-combat');
  renderTopbar();
  newRound();
}
function logCombat(msg){RUN.combat.log.push(msg);renderCombatLog();}
/* Resume a battle that was left mid-fight (page reload / closed browser). Every combat
   checkpoint saves RUN.combat.phase alongside the state it describes, so we just re-enter
   at that exact phase instead of restarting the encounter. */
function resumeCombat(){
  if(!RUN.combat)return;
  renderCombat();
  const phase=RUN.combat.phase;
  const unit=RUN.combat.activeUnit;
  if(phase==='hero_choose'||phase==='hero_target'){
    renderActionPanel();
    if(phase==='hero_choose'&&RUN.combat.autoBattle&&unit)setTimeout(function(){autoActHero(unit);},500);
  } else if(phase==='enemy_turn'&&unit&&unit.alive){
    renderActionPanel();
    setTimeout(function(){enemyAct(unit);},550);
  } else {
    advanceTurn();
  }
}

function newRound(){
  RUN.combat.queue=buildTurnOrder();
  RUN.combat.qi=0;
  advanceTurn();
}
function checkCombatEnd(){
  if(RUN.combat.over)return true;
  const heroesAlive=anyAlive(RUN.combat.party).length>0;
  const enemiesAlive=anyAlive(RUN.combat.enemies).length>0;
  if(!enemiesAlive){RUN.combat.over=true;onCombatWin();return true;}
  if(!heroesAlive){RUN.combat.over=true;onCombatLoss();return true;}
  return false;
}
function advanceTurn(){
  if(checkCombatEnd())return;
  if(RUN.combat.qi>=RUN.combat.queue.length){RUN.combat.round++;newRound();return;}
  const unit=RUN.combat.queue[RUN.combat.qi];
  if(!unit.alive){RUN.combat.qi++;RUN.combat.phase='advance';advanceTurn();return;}
  const dl=tickStatus(unit);
  dl.forEach(logCombat);
  if(checkCombatEnd())return;
  if(!unit.alive){RUN.combat.qi++;RUN.combat.phase='advance';advanceTurn();return;}
  unit.abilities.forEach(function(a){if(a.cdLeft>0)a.cdLeft--;});
  if(unit.boss&&!unit.enraged&&unit.hp<=unit.maxHp*0.5){
    unit.enraged=true;unit.atk=Math.round(unit.atk*1.3);
    logCombat(M(unit.name+' enters a hollow rage!',unit.name+' впадает в бездушную ярость!'));
  }
  if(unit.status.some(function(s){return s.type==='stun';})){
    logCombat(M(unit.name+' is stunned and cannot act.',unit.name+' оглушён и не может действовать.'));
    RUN.combat.qi++;RUN.combat.phase='advance';advanceTurn();return;
  }
  RUN.combat.activeUnit=unit;
  if(unit.side==='hero'){
    RUN.combat.activeHero=unit;
    RUN.combat.phase='hero_choose';
    renderCombat();
    renderActionPanel();
    if(RUN.combat.autoBattle)setTimeout(function(){autoActHero(unit);},500);
  } else {
    RUN.combat.activeHero=null;
    RUN.combat.phase='enemy_turn';
    RUN.combat.enemyIntent=buildEnemyIntent(unit);
    renderCombat();
    renderActionPanel();
    setTimeout(function(){enemyAct(unit);},550);
  }
}
function buildEnemyIntent(unit){
  const usable=unit.abilities.filter(function(a){return a.cdLeft<=0 && (!a.requiresEnrage||unit.enraged) && abilityHasTargets(a,unit);});
  if(!usable.length)return null;
  let ability=usable.length>1&&Math.random()<0.55?pick(usable.slice(1)):usable[0];
  let target=null;
  if(ability.type==='heal'){
    const allies=anyAlive(RUN.combat.enemies).sort(function(a,b){return (a.hp/a.maxHp)-(b.hp/b.maxHp);});
    target=allies[0];
  } else if(ability.targets==='single'){
    const valid=getValidTargets(ability,unit);
    target=valid.sort(function(a,b){return a.hp-b.hp;})[0];
  }
  const enemyIdx=RUN.combat.enemies.indexOf(unit);
  let targetSide=null,targetIdx=-1;
  if(target){
    const pIdx=RUN.combat.party.indexOf(target);
    if(pIdx>=0){targetSide='party';targetIdx=pIdx;}
    else{targetSide='enemies';targetIdx=RUN.combat.enemies.indexOf(target);}
  }
  return {enemyIdx:enemyIdx,abilityId:ability.id,abilityName:ability.name,abilityType:ability.type,targetSide:targetSide,targetIdx:targetIdx};
}
function enemyAct(unit){
  if(!unit.alive){RUN.combat.qi++;RUN.combat.phase='advance';RUN.combat.enemyIntent=null;renderCombat();setTimeout(advanceTurn,50);return;}
  const intent=RUN.combat.enemyIntent;
  const ability=intent?unit.abilities.find(function(a){return a.id===intent.abilityId;}):null;
  if(!intent||!ability){
    logCombat(M(unit.name+' finds no target and holds.',unit.name+' не находит цель и медлит.'));
    RUN.combat.qi++;
    RUN.combat.activeUnit=null;
    RUN.combat.enemyIntent=null;
    RUN.combat.phase='advance';
    renderCombat();
    setTimeout(advanceTurn,350);
    return;
  }
  const target = intent.targetSide==='party'?RUN.combat.party[intent.targetIdx]:(intent.targetSide==='enemies'?RUN.combat.enemies[intent.targetIdx]:null);
  ability.cdLeft=ability.cd;
  const logs=applyAbilityEffect(unit,ability,target);
  logs.forEach(logCombat);
  RUN.combat.qi++;
  RUN.combat.activeUnit=null;
  RUN.combat.enemyIntent=null;
  RUN.combat.phase='advance';
  renderCombat();
  setTimeout(advanceTurn,450);
}

function autoChooseForHero(unit){
  const usableAbilities=unit.abilities.filter(function(a){return a.cdLeft<=0&&(!a.minLevel||(unit.level||1)>=a.minLevel)&&abilityHasTargets(a,unit);});
  const healAbility=usableAbilities.find(function(a){return a.type==='heal';});
  if(healAbility){
    const allies=anyAlive(RUN.combat.party);
    const hurt=allies.filter(function(a){return a.hp/a.maxHp<0.6;});
    if(hurt.length){
      const target=healAbility.targets==='all-ally'?null:hurt.sort(function(a,b){return (a.hp/a.maxHp)-(b.hp/b.maxHp);})[0];
      return {ability:healAbility,target:target};
    }
  }
  const dmgAbilities=usableAbilities.filter(function(a){return a.type==='damage';});
  if(!dmgAbilities.length)return null;
  dmgAbilities.sort(function(a,b){return (b.mult||0)-(a.mult||0);});
  const ability=dmgAbilities[0];
  let target=null;
  if(ability.targets==='single'){
    const valid=getValidTargets(ability,unit);
    target=valid.sort(function(a,b){return a.hp-b.hp;})[0];
  }
  return {ability:ability,target:target};
}
function autoActHero(unit){
  if(!RUN.combat||!RUN.combat.autoBattle||RUN.combat.activeHero!==unit||!unit.alive)return;
  const decision=autoChooseForHero(unit);
  if(!decision){
    logCombat(M(unit.name+' finds no target and holds.',unit.name+' не находит цель и медлит.'));
    RUN.combat.activeHero=null;
    RUN.combat.activeUnit=null;
    RUN.combat.qi++;
    RUN.combat.phase='advance';
    renderCombat();
    setTimeout(advanceTurn,300);
    return;
  }
  resolveHeroAbility(decision.ability,decision.target);
}
function heroChooseAbility(ability){
  if(ability.cdLeft>0)return;
  if(ability.minLevel&&(RUN.combat.activeHero.level||1)<ability.minLevel)return;
  if(!abilityHasTargets(ability,RUN.combat.activeHero))return;
  RUN.combat.selectedAbility=ability;
  const needsTarget = ability.targets==='single'||ability.targets==='single-ally';
  if(!needsTarget){
    resolveHeroAbility(ability,null);
    return;
  }
  RUN.combat.phase='hero_target';
  renderActionPanel();
  renderCombat();
}
function resolveHeroAbility(ability,target){
  const unit=RUN.combat.activeHero;
  ability.cdLeft=ability.cd;
  const logs=applyAbilityEffect(unit,ability,target);
  logs.forEach(logCombat);
  RUN.combat.selectedAbility=null;
  RUN.combat.activeHero=null;
  RUN.combat.activeUnit=null;
  RUN.combat.qi++;
  RUN.combat.phase='advance';
  renderCombat();
  setTimeout(advanceTurn,250);
}
function heroChooseTarget(target){
  if(!RUN.combat.selectedAbility)return;
  resolveHeroAbility(RUN.combat.selectedAbility,target);
}

function onCombatWin(){
  logCombat(M('The foes are defeated.','Враги повержены.'));
  RUN.layersCleared=Math.max(RUN.layersCleared,RUN.combat.node.layer+1);
  const node=RUN.combat.node;
  if(node.type==='boss'){
    saveRun();
    setTimeout(function(){onVictory();},700);
    return;
  }
  const baseGold=20+node.layer*7+randInt(0,14);
  RUN.gold+=baseGold;
  const cards=buildRewardCards(node.layer);
  RUN.pendingReward={gold:baseGold,cards:cards,node:node};
  awardXp(node);
  saveRun();
  setTimeout(function(){renderRewardScreen();},700);
}
function onCombatLoss(){
  logCombat(M('The company has fallen.','Отряд пал.'));
  saveRun();
  setTimeout(function(){onDefeat();},900);
}

/* ============================= REWARD / NODES ============================= */

function buildRewardCards(layer){
  const tier=tierForLayer(layer);
  const cards=[];
  cards.push({type:'item',item:randomItem()});
  const r=Math.random();
  if(r<0.4)cards.push({type:'gold',amount:20+tier*10+randInt(0,10)});
  else if(r<0.75)cards.push({type:'elixir'});
  else cards.push({type:'item',item:randomItem()});
  const r2=Math.random();
  if(r2<0.34)cards.push({type:'gold',amount:15+tier*8+randInt(0,10)});
  else if(r2<0.67)cards.push({type:'elixir'});
  else cards.push({type:'item',item:randomItem()});
  if(Math.random()<0.14)cards.push({type:'item',item:randomRelic()});
  return cards;
}

function enterNode(node){

  else if(node.type==='shop'){startShop(node);}

}

function modsToText(mods){
  const parts=[];
  if(mods.atk)parts.push((mods.atk>0?'+':'')+mods.atk+' '+statAbbr('atk'));
  if(mods.def)parts.push((mods.def>0?'+':'')+mods.def+' '+statAbbr('def'));
  if(mods.spd)parts.push((mods.spd>0?'+':'')+mods.spd+' '+statAbbr('spd'));
  if(mods.hp)parts.push((mods.hp>0?'+':'')+mods.hp+' '+statAbbr('hp'));
  return parts.join(', ');
}
function itemDescText(item){
  const parts=[];
  const mt=modsToText(item.mods||{});
  if(mt)parts.push(mt);
  if(item.passiveDesc)parts.push(item.passiveDesc);
  return parts.join(' · ')||M('No bonus','Без бонуса');
}

function nodeColor(type){
  return {battle:'var(--accent)',elite:'var(--danger)',event:'var(--accent2)',shop:'var(--gold)',rest:'var(--good)',boss:'var(--danger)'}[type];
}
function nodeLabel(type){
  return {battle:M('BTL','БОЙ'),elite:M('ELT','ЭЛТ'),event:M('EVT','СОБ'),shop:M('SHP','МАГ'),rest:M('RST','ПРВ'),boss:'☠'}[type];
}
function renderMap(){
  const map=RUN.map;
  const layers=map.layers;
  const totalLayers=layers.length+1;
  const maxPerLayer=layers.reduce(function(m,l){return Math.max(m,l.length);},1);
  const w=60+totalLayers*92;
  const h=Math.max(220,80+(maxPerLayer-1)*90);
  const svg=$('map-svg');
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.setAttribute('width',w);
  svg.setAttribute('height',h);
  svg.innerHTML='';
  const NS='http://www.w3.org/2000/svg';
  function coordsFor(node){
    const arr = node.type==='boss'?[node]:layers[node.layer];
    const n=arr.length;
    const y = n<=1?h/2:40+node.idx*((h-80)/(n-1));
    const x = 50+node.layer*92;
    return {x:x,y:y};
  }
  const allNodes=mapAllNodes(map);
  const posMap={};
  allNodes.forEach(function(n){posMap[n.id]=coordsFor(n);});

  allNodes.forEach(function(n){
    n.next.forEach(function(nid){
      const p1=posMap[n.id],p2=posMap[nid];
      const line=document.createElementNS(NS,'line');
      line.setAttribute('x1',p1.x);line.setAttribute('y1',p1.y);
      line.setAttribute('x2',p2.x);line.setAttribute('y2',p2.y);
      line.setAttribute('stroke', n.cleared?'var(--map-line-cleared)':'var(--map-line)');
      line.setAttribute('stroke-width','2');
      svg.appendChild(line);
    });
  });
  allNodes.forEach(function(n){
    const p=posMap[n.id];
    const g=document.createElementNS(NS,'g');
    g.setAttribute('class','map-node'+(RUN.availableNodeIds&&RUN.availableNodeIds.indexOf(n.id)>=0?'':' locked'));
    const r = n.type==='boss'?18:(n.type==='elite'?15:13);
    const circle=document.createElementNS(NS,'circle');
    circle.setAttribute('cx',p.x);circle.setAttribute('cy',p.y);circle.setAttribute('r',r);
    const available=RUN.availableNodeIds&&RUN.availableNodeIds.indexOf(n.id)>=0;
    let fill=nodeColor(n.type);
    if(n.cleared)fill='var(--map-line-cleared)';
    else if(!available)fill='var(--map-locked)';
    circle.setAttribute('fill',fill);
    circle.setAttribute('stroke', n.id===RUN.currentNodeId?'var(--text)':'var(--border)');
    circle.setAttribute('stroke-width', n.id===RUN.currentNodeId?'2':'1');
    g.appendChild(circle);
    if(available&&!n.cleared){
      const glow=document.createElementNS(NS,'circle');
      glow.setAttribute('cx',p.x);glow.setAttribute('cy',p.y);glow.setAttribute('r',r+5);
      glow.setAttribute('fill','none');glow.setAttribute('stroke',fill);
      glow.setAttribute('stroke-width','1.5');glow.setAttribute('opacity','.45');
      svg.appendChild(glow);
    }
    const text=document.createElementNS(NS,'text');
    text.setAttribute('x',p.x);text.setAttribute('y',p.y+3);text.setAttribute('text-anchor','middle');
    text.textContent = n.cleared? '✓' : nodeLabel(n.type);
    g.appendChild(text);
    if(available){
      g.addEventListener('click',function(){enterNode(n);});
    }
    svg.appendChild(g);
  });
}

function statusTooltip(s){
  if(s.type==='dot')return M('Burning: loses '+s.amount+' HP at the start of each turn.','Горит: теряет '+s.amount+' HP в начале каждого хода.');
  if(s.type==='stun')return M('Stunned: skips their next turn.','Оглушён: пропускает следующий ход.');
  if(s.type==='dodge')return M('Will dodge the next attack against them.','Уклонится от следующей атаки по себе.');
  if(s.type==='buff')return M(statAbbr(s.stat)+' '+(s.amount>0?'+':'')+s.amount+' for '+s.duration+' more turn(s).',statAbbr(s.stat)+' '+(s.amount>0?'+':'')+s.amount+' ещё '+s.duration+' ход(а/ов).');
  if(s.type==='debuff')return M(statAbbr(s.stat)+' '+s.amount+' for '+s.duration+' more turn(s).',statAbbr(s.stat)+' '+s.amount+' ещё '+s.duration+' ход(а/ов).');
  return '';
}
function intentIcon(type){
  return {damage:'⚔',heal:'✚',buff:'▲',debuff:'▼',special:'✦'}[type]||'?';
}
function unitCard(unit,isTargetable,isAllyTargetable,intentBadge,isIntentTarget){
  const card=el('div','unit-card'+(unit.alive?'':' dead'));
  if(RUN.combat.activeUnit===unit)card.classList.add('active-turn');
  if(isTargetable)card.classList.add('targetable');
  if(isAllyTargetable)card.classList.add('ally-targetable');
  if(isIntentTarget)card.classList.add('intent-target');
  const av=el('div','unit-avatar',avatarContent(unit));
  av.style.background=unit.color;
  if(intentBadge){
    const ib=el('span','intent-badge',intentIcon(intentBadge.type));
    ib.title=intentBadge.name;
    av.appendChild(ib);
  }
  card.appendChild(av);
  card.title=unit.isHero?(unit.name+' · '+unit.cls+' · '+M('Lv','Ур.')+' '+(unit.level||1)):unit.name;
  card.appendChild(el('div','unit-name',unit.name));
  if(unit.isHero)card.appendChild(el('div','unit-class',unit.cls+' · '+M('Lv','Ур.')+(unit.level||1)));
  card.appendChild(el('div','unit-row-tag',rowLabel(unit.row)+(unit.elite?(' · '+M('elite','элита')):'')+(unit.boss?(' · '+M('boss','босс')):'')));
  const pct=Math.max(0,unit.hp/unit.maxHp*100);
  const bar=el('div','hpbar');
  const fill=el('div','hpbar-fill'+(pct<30?' low':''));fill.style.width=pct+'%';
  bar.appendChild(fill);card.appendChild(bar);
  card.appendChild(el('div','hp-num',unit.hp+'/'+unit.maxHp));
  const icons=el('div','status-icons');
  unit.status.forEach(function(s){
    const cls=s.type==='dot'?'debuff':(s.type==='debuff'?'debuff':'buff');
    const sign=(typeof s.amount==='number')?(s.amount>0?'+':'')+s.amount+' ':'';
    const icon=el('span','status-icon '+cls, sign+(s.label||s.type)+' '+s.duration);
    icon.title=statusTooltip(s);
    icons.appendChild(icon);
  });
  card.appendChild(icons);
  if(isTargetable){card.addEventListener('click',function(){heroChooseTarget(unit);});}
  if(isAllyTargetable){card.addEventListener('click',function(){heroChooseTarget(unit);});}
  return card;
}

function renderCombat(){
  if(!RUN.combat)return;
  const ability=RUN.combat.selectedAbility;
  const active=RUN.combat.activeHero;
  let targetableEnemies=[],targetableAllies=[];
  if(ability&&active){
    if(ability.targets==='single')targetableEnemies=getValidTargets(ability,active);
    if(ability.targets==='single-ally')targetableAllies=getValidTargets(ability,active);
  }
  const intent=RUN.combat.enemyIntent;
  const intentUnit=intent?RUN.combat.enemies[intent.enemyIdx]:null;
  const intentTarget=intent&&intent.targetSide?((intent.targetSide==='party'?RUN.combat.party:RUN.combat.enemies)[intent.targetIdx]):null;
  const eb=$('enemy-row-back'),ef=$('enemy-row-front');
  eb.innerHTML='';ef.innerHTML='';
  RUN.combat.enemies.forEach(function(en){
    const tgt=targetableEnemies.indexOf(en)>=0;
    const badge=(intentUnit===en)?{type:intent.abilityType,name:intent.abilityName}:null;
    (en.row==='back'?eb:ef).appendChild(unitCard(en,tgt,false,badge,intentTarget===en));

  const hf=$('hero-row-front'),hb=$('hero-row-back');

  updateAutoBattleButton();
  saveRun();

function computeEmbers(win){
  const allNodes = mapAllNodes(RUN.map);
  const cleared = allNodes.filter(function(n){return n.cleared;}).length;
  let embers = cleared*2 + RUN.ascension*3;
  if(win)embers+=15;
  return Math.max(1,Math.round(embers));
}
function renderAchievementUnlocks(unlocked){
  const box=$('go-achievements');box.innerHTML='';
  if(!unlocked.length)return;
  box.appendChild(el('div','eyebrow',M('Achievements unlocked','Открытые достижения')));
  unlocked.forEach(function(a){
    box.appendChild(el('div','card',
      "<strong>"+L(a.name)+"</strong> <span class='gold-badge'>+"+a.reward+M(' embers',' угольков')+"</span><br><span style='color:var(--muted);font-size:12px;'>"+L(a.desc)+"</span>"
    ));
  });
}
function onVictory(){
  const embers=computeEmbers(true);
  META.embers+=embers;
  META.wins++;
  META.bestLayer=Math.max(META.bestLayer,8);
  if(META.wins>=1)META.heroesUnlocked.ashra=true;
  if(META.wins>=3)META.heroesUnlocked.doran=true;
  if(META.wins>=5)META.heroesUnlocked.morwen=true;
  META.ascensionUnlocked=Math.max(META.ascensionUnlocked,Math.min(5,RUN.ascension+1));
  if(RUN.daily){META.dailyLastDate=RUN.daily;META.dailyLastResult={win:true,layer:8};META.embers+=10;}
  const unlocked=evaluateAchievements(true);
  recordRunHistory(true,embers);
  saveMeta();
  clearRun();
  $('go-banner').textContent=M('The March is Won','Поход завершён победой');
  $('go-banner').className='gameover-banner win';
  $('go-text').textContent=M(
    'The company breaks through the last of the ash and finds open sky. The road behind them is finally quiet.',
    'Отряд пробивается сквозь последний пепел и находит открытое небо. Дорога позади них наконец затихает.'
  );
  $('go-layers').textContent='8 / 8';
  $('go-embers').textContent=embers;
  renderAchievementUnlocks(unlocked);
  show('screen-gameover');
}
function onDefeat(){
  const embers=computeEmbers(false);
  META.embers+=embers;
  META.bestLayer=Math.max(META.bestLayer,RUN.layersCleared);
  if(RUN.daily){META.dailyLastDate=RUN.daily;META.dailyLastResult={win:false,layer:RUN.layersCleared};META.embers+=5;}
  const unlocked=evaluateAchievements(false);
  recordRunHistory(false,embers);
  saveMeta();
  clearRun();
  $('go-banner').textContent=M('The Company Falls','Отряд погиб');
  $('go-banner').className='gameover-banner lose';
  $('go-text').textContent=M(
    'The ash takes what remains. Somewhere behind, the next company is already being mustered.',
    'Пепел забирает всё, что осталось. Где-то позади уже собирают следующий отряд.'
  );
  $('go-layers').textContent=(RUN.layersCleared)+' / 8';
  $('go-embers').textContent=embers;
  renderAchievementUnlocks(unlocked);
  show('screen-gameover');
}

  if(!saved)return;
  RUN=saved;
  hydrateParty(RUN);
  if(RUN.combat&&!RUN.combat.over){
    saveRun();
    show('screen-combat');
    renderTopbar();
    resumeCombat();
    return;
  }
  if(RUN.combat&&RUN.combat.over){
    if(RUN.pendingReward){renderRewardScreen();return;}
    if(!anyAlive(RUN.combat.party).length){onDefeat();return;}
    onVictory();return;
  }
  if(RUN.pendingReward){renderRewardScreen();return;}
  saveRun();show('screen-map');renderTopbar();renderMap();
});
$('btn-open-legacy').addEventListener('click',renderLegacy);
$('btn-legacy-back').addEventListener('click',renderTitle);
$('btn-back-title').addEventListener('click',function(){dailyPendingSeed=null;renderTitle();});
$('btn-confirm-heroes').addEventListener('click',function(){
  if(heroSelectState.length===3){
    const seed=dailyPendingSeed;dailyPendingSeed=null;
    startNewRun(heroSelectState.slice(),seed);
  }
});
$('btn-formation').addEventListener('click',openFormationModal);
$('btn-auto-battle').addEventListener('click',function(){
  if(!RUN.combat)return;
  RUN.combat.autoBattle=!RUN.combat.autoBattle;
  updateAutoBattleButton();
  saveRun();
  if(RUN.combat.autoBattle&&RUN.combat.phase==='hero_choose'&&RUN.combat.activeHero){
    setTimeout(function(){autoActHero(RUN.combat.activeHero);},400);
  }
});
$('btn-abandon').addEventListener('click',function(){
  const wrap=el('div','stack');
  wrap.appendChild(el('h3','',M('Abandon this march?','Прервать этот поход?')));
  wrap.appendChild(el('div','',"<span style='color:var(--muted);font-size:13px;'>"+M('Your embers earned so far will still be banked, but the company disperses.','Заработанные угольки сохранятся, но отряд распустят.')+"</span>"));
  const row=el('div','row');
  const yes=el('button','danger-btn',M('Abandon','Прервать'));
  yes.addEventListener('click',function(){
    const embers=computeEmbers(false);
    META.embers+=embers;META.bestLayer=Math.max(META.bestLayer,RUN.layersCleared);
    if(RUN.daily){META.dailyLastDate=RUN.daily;META.dailyLastResult={win:false,layer:RUN.layersCleared};}
    saveMeta();
    clearRun();closeModal();renderTitle();
  });
  const no=el('button','',M('Keep Going','Продолжить поход'));
  no.addEventListener('click',closeModal);
  row.appendChild(yes);row.appendChild(no);
  wrap.appendChild(row);
  openModal(wrap);
});
$('btn-leave-shop').addEventListener('click',function(){completeCurrentNode(RUN._shopNode);goToMap();});
$('btn-rest-heal').addEventListener('click',function(){
  RUN.party.forEach(function(h){if(h.alive)h.hp=Math.min(h.maxHp,h.hp+Math.round(h.maxHp*0.35));});
  completeCurrentNode(RUN._restNode);goToMap();
});
$('btn-rest-train').addEventListener('click',function(){
  promptChooseHero(M('Train whom?','Кого тренировать?'),function(h){h.atk+=3;h.def+=1;completeCurrentNode(RUN._restNode);goToMap();});
});
$('btn-go-continue').addEventListener('click',renderTitle);
$('btn-theme-toggle').addEventListener('click',toggleTheme);
$('btn-toggle-animations').addEventListener('click',function(){
  META.settings.animations = META.settings.animations===false;
  saveMeta();applySettings();renderLegacy();
});
$('btn-export-save').addEventListener('click',exportSave);
$('btn-import-save').addEventListener('click',importSave);
let dailyPendingSeed=null;
$('btn-daily').addEventListener('click',function(){
  const today=todayDateStr();
  if(META.dailyLastDate===today){
    const res=META.dailyLastResult;
    const wrap=el('div','stack');
    wrap.appendChild(el('h3','',M("Today's Challenge",'Испытание дня')));
    wrap.appendChild(el('div','',"<span style='color:var(--muted);font-size:13px;'>"+(res&&res.win?M("You've already completed today's challenge. Come back tomorrow for a new march!","Вы уже прошли сегодняшнее испытание. Возвращайтесь завтра за новым походом!"):M("You've already attempted today's challenge. Come back tomorrow for a new march!","Вы уже пытались пройти сегодняшнее испытание. Возвращайтесь завтра за новым походом!"))+"</span>"));
    const close=el('button','primary',M('Got it','Понятно'));
    close.addEventListener('click',closeModal);
    wrap.appendChild(close);
    openModal(wrap);
    return;
  }
  dailyPendingSeed=today;
  renderHeroSelect();
});
applyStaticI18n();
applyTheme();
applySettings();
renderTitle();
})();
</script>
