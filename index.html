<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Embermarch</title>
<style>
:root{
  --bg:#0c0a0d;
  --surface:#17141a;
  --surface2:#211c24;
  --surface3:#2b2430;
  --border:#3a3242;
  --text:#f3ead9;
  --muted:#a89a86;
  --accent:#ff8a4c;
  --accent-deep:#c9622e;
  --accent-soft:#3a2418;
  --accent2:#7bb0c9;
  --accent2-soft:#1c2f38;
  --good:#6fbb86;
  --good-soft:#1c2e22;
  --danger:#e2665c;
  --danger-soft:#331e1c;
  --gold:#e3b563;
  --title-glow:rgba(255,138,76,.14);
  --map-line:#3a3548;
  --map-line-cleared:#514a2c;
  --map-locked:#242030;
  --map-band-a:rgba(255,255,255,.015);
  --map-band-b:rgba(255,255,255,.045);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f7f1e6;
  --surface:#fffdf9;
  --surface2:#f2e8d6;
  --surface3:#e9dcc0;
  --border:#d8c8a4;
  --text:#2b2117;
  --muted:#7a6c53;
  --accent:#c9622e;
  --accent-deep:#a04d21;
  --accent-soft:#f3ddbb;
  --accent2:#3d7791;
  --accent2-soft:#d9ecf2;
  --good:#3f8a5a;
  --good-soft:#dcf0e1;
  --danger:#b8483f;
  --danger-soft:#f6dcd8;
  --gold:#a97a2e;
  --title-glow:rgba(201,98,46,.10);
  --map-line:#cdbb98;
  --map-line-cleared:#b79a58;
  --map-locked:#e9dcc0;
  --map-band-a:rgba(43,33,23,.02);
  --map-band-b:rgba(43,33,23,.055);
  color-scheme:light;
}
*{box-sizing:border-box;}
html{height:100%;}
body{
  background:
    radial-gradient(ellipse 60% 40% at 15% 0%, var(--title-glow), transparent 65%),
    radial-gradient(ellipse 50% 35% at 100% 100%, var(--title-glow), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Work Sans',system-ui,sans-serif;
  padding-inline:16px;
  min-height:100%;
  margin:0;
  overflow-x:hidden;
}
#ember-particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.ember-spark{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:0;box-shadow:0 0 6px 1px var(--accent);animation:ember-rise linear infinite;}
@keyframes ember-rise{
  0%{transform:translateY(0) translateX(0);opacity:0;}
  8%{opacity:.75;}
  92%{opacity:.25;}
  100%{transform:translateY(-104vh) translateX(var(--drift,12px));opacity:0;}
}
html.no-anim #ember-particles{display:none;}
#app{position:relative;z-index:1;}
#modal-root{position:relative;z-index:21;}
h1,h2,h3,.display{
  font-family:'Cormorant Garamond','Marcellus',serif;
  font-weight:600;
  letter-spacing:.02em;
  text-wrap:balance;
  margin:0;
}
.mono, .num{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
}
button{
  font-family:inherit;
  cursor:pointer;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  border-radius:8px;
  padding:10px 16px;
  font-size:14px;
  transition:background .15s,border-color .15s,transform .1s;
}
button:hover:not(:disabled){background:var(--surface3);border-color:var(--accent);}
button:active:not(:disabled){transform:translateY(1px);}
button:disabled{opacity:.4;cursor:not-allowed;}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));border-color:var(--accent);color:#1a0f07;font-weight:600;box-shadow:0 4px 16px -6px var(--title-glow);}
button.primary:hover:not(:disabled){background:linear-gradient(135deg,var(--accent),var(--accent-deep));filter:brightness(1.08);transform:translateY(-1px);}
:root[data-theme="light"] button.primary{color:#fff6e9;}
button.danger-btn{background:var(--danger-soft);border-color:var(--danger);}
#app{max-width:860px;margin:0 auto;padding:52px 16px 40px;box-sizing:border-box;zoom:calc(1.18 * var(--text-scale,1));}
#modal-root{zoom:calc(1.18 * var(--text-scale,1));}
@media (max-width:720px){
  #app{padding:56px 14px 32px;zoom:calc(1 * var(--text-scale,1));}
  #modal-root{zoom:calc(1 * var(--text-scale,1));}
  .title-actions{max-width:100%!important;}
  .title-foot{font-size:12px;padding:10px 14px;gap:10px 14px;}
  section h2{word-break:break-word;}
}
[hidden]{display:none!important;}
html.no-anim *,html.no-anim *::before,html.no-anim *::after{transition:none!important;animation:none!important;}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.seg-btns{display:flex;gap:4px;}
.seg-btn{border-radius:7px;padding:6px 11px;font-size:12px;}
.seg-btn.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.toggle-switch{width:40px;height:22px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);position:relative;cursor:pointer;padding:0;}
.toggle-switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:left .15s ease,background .15s ease;}
.toggle-switch.on{border-color:var(--accent);background:var(--accent-soft);}
.toggle-switch.on .knob{left:20px;background:var(--accent);}
.ach-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);}
.ach-row:last-child{border-bottom:none;}
.ach-row.locked{opacity:.4;}
.ach-icon{width:26px;height:26px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--surface2);border:1px solid var(--border);}
.ach-row:not(.locked) .ach-icon{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
textarea.save-code{width:100%;box-sizing:border-box;min-height:90px;font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;resize:vertical;}

.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
}
.level-up-card{border-color:var(--accent);background:var(--accent-soft);}
.level-up-card .row{margin-top:8px;}
.xp-bar{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;margin-top:2px;}
.xp-bar-fill{height:100%;background:var(--accent2);}
.stack{display:flex;flex-direction:column;gap:12px;}
/* Legacy-screen tabs: split a screen that used to be one long stack of cards
   (upgrades, recruits, march setup, stats, achievements, bestiary, settings)
   into separate sections, so only one group is visible at a time. */
.legacy-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);}
.legacy-tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:10px 14px;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.legacy-tab:hover{color:var(--text);}
.legacy-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.legacy-tab-panel{margin-top:14px;}
.legacy-tab-panel[hidden]{display:none;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;}

/* ---- language switch ---- */
.lang-switch{display:flex;gap:6px;justify-content:center;margin-bottom:16px;}
.lang-btn{padding:5px 14px;font-size:11px;border-radius:99px;}
.lang-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}

/* ---- title ---- */
#screen-auth{text-align:center;padding-top:6vh;position:relative;}
#screen-auth::before{content:'';position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:640px;height:420px;max-width:90vw;background:radial-gradient(ellipse at center, var(--title-glow), transparent 70%);pointer-events:none;z-index:-1;}
#screen-auth h1{font-size:clamp(30px,8vw,44px);font-weight:600;letter-spacing:.03em;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 40%,#fff) 0%,var(--gold) 45%,var(--accent-deep) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.auth-box{max-width:340px;margin:18px auto 0;text-align:left;}
.auth-field{margin-bottom:12px;}
.auth-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
.auth-field input{width:100%;box-sizing:border-box;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit;}
.auth-field input:focus{outline:1px solid var(--accent);}
.auth-error{color:var(--danger);font-size:12px;min-height:16px;margin-top:6px;}
.auth-toggle{margin-top:14px;font-size:13px;color:var(--muted);}
.auth-toggle a{color:var(--accent);cursor:pointer;text-decoration:underline;}
#screen-title{text-align:center;padding-top:4vh;position:relative;}
#screen-title::before{content:'';position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:640px;height:420px;max-width:90vw;background:radial-gradient(ellipse at center, var(--title-glow), transparent 70%);pointer-events:none;z-index:-1;}
#screen-title h1{font-size:clamp(38px,10vw,58px);font-weight:600;letter-spacing:.03em;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 40%,#fff) 0%,var(--gold) 45%,var(--accent-deep) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
#screen-title .tagline{color:var(--muted);margin-top:6px;font-size:15px;font-style:italic;}
.title-actions{margin-top:24px;display:flex;flex-direction:column;gap:10px;max-width:280px;margin-inline:auto;}
.title-actions button{padding:14px;font-size:15px;}
.title-foot{margin-top:20px;color:var(--muted);font-size:12px;line-height:1.6;display:inline-flex;gap:18px;padding:12px 20px;background:var(--surface);border:1px solid var(--border);border-radius:12px;flex-wrap:wrap;justify-content:center;}

/* ---- topbar ---- */
#topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;margin-bottom:16px;font-size:13px;gap:10px;flex-wrap:wrap;
}
#topbar .partybit{display:flex;gap:8px;}
.pb-hp{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);}
.pb-fallen{color:var(--danger);font-weight:600;}
.pb-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Marcellus',serif;font-size:13px;color:#12141a;font-weight:700;}
.pb-dot svg,.hero-avatar svg,.unit-avatar svg,.to-item svg{width:62%;height:62%;display:block;}
.gold-badge{color:var(--gold);font-family:'JetBrains Mono',monospace;font-weight:600;}

/* ---- map ---- */
#screen-map{position:relative;}
#screen-map::before{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:520px;height:260px;max-width:100vw;background:radial-gradient(ellipse at center, var(--title-glow), transparent 72%);pointer-events:none;z-index:-1;}
#screen-shop{position:relative;}
#screen-shop::before{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:480px;height:240px;max-width:100vw;background:radial-gradient(ellipse at center, color-mix(in srgb,var(--gold) 16%,transparent), transparent 72%);pointer-events:none;z-index:-1;}
#screen-rest{position:relative;}
#screen-rest::before{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:480px;height:240px;max-width:100vw;background:radial-gradient(ellipse at center, color-mix(in srgb,var(--good) 14%,transparent), transparent 72%);pointer-events:none;z-index:-1;}
.map-wrap{
  border:1px solid var(--border);border-radius:12px;padding:10px;overflow-x:auto;position:relative;
  /* CSS-only "scroll shadow": a soft edge shadow that only shows while there is
     more map content off-screen in that direction, and fades away once scrolled
     all the way to that edge. Gives a visual hint that the map scrolls horizontally. */
  background-color:var(--surface);
  background-image:
    linear-gradient(to right, var(--surface) 30%, rgba(0,0,0,0)),
    linear-gradient(to left, var(--surface) 30%, rgba(0,0,0,0)),
    linear-gradient(to right, rgba(0,0,0,.35), rgba(0,0,0,0) 30%),
    linear-gradient(to left, rgba(0,0,0,.35), rgba(0,0,0,0) 30%);
  background-repeat:no-repeat;
  background-size:24px 100%, 24px 100%, 12px 100%, 12px 100%;
  background-position:left, right, left, right;
  background-attachment:local, local, scroll, scroll;
}
.map-svg{display:block;height:320px;width:auto;max-width:none;}
.map-node{cursor:pointer;}
.map-node text{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.05em;fill:var(--bg);font-weight:700;pointer-events:none;}
.map-node text.map-node-icon{font-size:15px;letter-spacing:0;pointer-events:none;}
.map-tier-label{font-family:'Marcellus',serif;font-size:12px;letter-spacing:.08em;fill:var(--muted);text-transform:uppercase;}
.map-hint{font-size:11px;color:var(--muted);margin-top:8px;text-align:center;}
.map-flavor{font-size:12px;font-style:italic;color:var(--accent2);text-align:center;margin-bottom:8px;min-height:15px;}
.map-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;}
.node-preview-type{font-family:'Marcellus',serif;font-size:18px;margin-bottom:4px;}
.node-preview-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700;margin-bottom:10px;color:var(--bg);}

/* ---- hero select / formation ---- */
.hero-pick{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;}
.hero-pick.selected{border-color:var(--accent);background:var(--accent-soft);}
.hero-pick.locked{opacity:.45;cursor:not-allowed;}
.hero-pick-add{border-style:dashed;justify-content:center;color:var(--accent2);font-family:'Marcellus',serif;font-size:15px;}
.hero-pick-add:hover{border-color:var(--accent);background:var(--accent-soft);}
.hero-avatar{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Marcellus',serif;font-size:18px;color:#12141a;font-weight:700;flex-shrink:0;}
.hero-info{flex:1;min-width:0;}
.hero-info .name{font-family:'Marcellus',serif;font-size:16px;}
.hero-info .cls{color:var(--muted);font-size:12px;}
.hero-stats{display:flex;gap:10px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}

/* ---- combat ---- */
.combat-zone{
  display:grid;
  grid-template-columns:1fr 1.15fr;
  grid-template-areas:"left right";
  gap:14px;
  align-items:start;
}
.combat-left{grid-area:left;display:flex;flex-direction:column;gap:14px;min-width:0;}
.combat-right{grid-area:right;display:flex;flex-direction:column;gap:14px;min-width:0;}
@media (max-width:680px){
  /* Action panel + auto-battle toggle first on mobile, enemies/party below —
     otherwise the controls the player actually needs sit below the fold at
     the start of every fight, forcing a scroll before they can act. */
  .combat-zone{grid-template-columns:1fr;grid-template-areas:"left" "right";}
}
.unit-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.unit-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:9px 8px;width:122px;text-align:center;position:relative;transition:box-shadow .15s,border-color .15s;
}
.unit-card.dead{opacity:.35;}
.unit-card.active-turn{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.unit-card.targetable{border-color:var(--danger);cursor:pointer;box-shadow:0 0 0 2px var(--danger-soft);}
.unit-card.ally-targetable{border-color:var(--good);cursor:pointer;box-shadow:0 0 0 2px var(--good-soft);}
.unit-avatar{width:36px;height:36px;border-radius:8px;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-family:'Marcellus',serif;font-size:16px;color:#12141a;font-weight:700;position:relative;}
.intent-badge{position:absolute;bottom:-4px;right:-6px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text);font-family:inherit;font-weight:400;}
.unit-card.intent-target{box-shadow:0 0 0 2px var(--gold);}
.res-badge{position:absolute;top:-4px;left:-6px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;font-family:inherit;font-weight:400;}
.res-badge.weak-phys{color:var(--accent);border-color:var(--accent);}
.res-badge.weak-magic{color:var(--accent2);border-color:var(--accent2);}
.unit-name{font-size:11.5px;font-weight:600;line-height:1.25;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;}
.unit-class{font-size:9.5px;color:var(--accent2);margin-top:1px;}
.unit-row-tag{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:1px;}
.hpbar{height:6px;border-radius:3px;background:var(--bg);margin-top:4px;overflow:hidden;}
.hpbar-fill{height:100%;background:var(--good);transition:width .25s;}
.hpbar-fill.low{background:var(--danger);}
.hp-num{font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px;}
.status-icons{display:flex;gap:2px;justify-content:center;margin-top:3px;flex-wrap:wrap;}
.status-icon{font-size:9px;padding:1px 3px;border-radius:3px;background:var(--surface3);color:var(--muted);}
.status-icon.buff{color:var(--good);}
.status-icon.debuff{color:var(--danger);}

/* ---- combat feedback fx ---- */
@keyframes fx-shake{
  10%,90%{transform:translateX(-1px);}
  20%,80%{transform:translateX(2px);}
  30%,50%,70%{transform:translateX(-4px);}
  40%,60%{transform:translateX(4px);}
}
@keyframes fx-shake-hard{
  10%,90%{transform:translateX(-2px) rotate(-0.5deg);}
  20%,80%{transform:translateX(4px) rotate(0.5deg);}
  30%,50%,70%{transform:translateX(-7px) rotate(-1deg);}
  40%,60%{transform:translateX(7px) rotate(1deg);}
}
@keyframes fx-flash{
  0%,100%{filter:none;}
  30%{filter:brightness(1.9) saturate(1.4);}
}
@keyframes fx-heal-glow{
  0%,100%{box-shadow:0 0 0 2px transparent;}
  40%{box-shadow:0 0 0 3px var(--good),0 0 14px -2px var(--good);}
}
@keyframes fx-die{
  0%{opacity:1;transform:scale(1) rotate(0);}
  60%{opacity:.5;transform:scale(.94) rotate(-2deg);}
  100%{opacity:.35;transform:scale(.9) rotate(-4deg);}
}
@keyframes float-up{
  0%{opacity:0;transform:translate(-50%,4px) scale(.85);}
  15%{opacity:1;transform:translate(-50%,-2px) scale(1.08);}
  30%{transform:translate(-50%,-6px) scale(1);}
  100%{opacity:0;transform:translate(-50%,-34px) scale(1);}
}
.unit-card.fx-hit{animation:fx-shake .32s ease;}
.unit-card.fx-crit{animation:fx-shake-hard .42s ease,fx-flash .42s ease;}
.unit-card.fx-heal{animation:fx-heal-glow .7s ease;}
.unit-card.fx-die{animation:fx-die .5s ease forwards;}
html.no-anim .unit-card.fx-hit,html.no-anim .unit-card.fx-crit,html.no-anim .unit-card.fx-heal,html.no-anim .unit-card.fx-die{animation:none!important;}
.float-text{
  position:absolute;top:34%;left:50%;pointer-events:none;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;
  text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;z-index:5;
  animation:float-up .9s ease-out forwards;
}
.float-text.dmg{color:var(--danger);}
.float-text.crit{color:#ff5a4a;font-size:19px;}
.float-text.heal{color:var(--good);}
.float-text.combo{color:var(--gold);font-size:12px;top:16%;}
.float-text.dodge{color:var(--accent2);font-size:12px;}
html.no-anim .float-text{display:none;}

.enemy-zone{background:radial-gradient(ellipse 100% 60% at 50% 0%, color-mix(in srgb,var(--danger) 10%,transparent), transparent 75%),var(--danger-soft);border:1px solid #4a2f2e;border-radius:12px;padding:12px;}
.ally-zone{background:radial-gradient(ellipse 100% 60% at 50% 100%, color-mix(in srgb,var(--good) 10%,transparent), transparent 75%),var(--good-soft);border:1px solid #2c4636;border-radius:12px;padding:12px;}
.zone-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:'JetBrains Mono',monospace;}

#combat-log{

<script>
(function(){
"use strict";

/* ============================= LANGUAGE ============================= */

const LANG_KEY='embermarch_lang_v1';
let LANG = (function(){
  try{const v=localStorage.getItem(LANG_KEY);if(v==='en'||v==='ru')return v;}catch(e){}
  return 'ru';
})();
function saveLang(){try{localStorage.setItem(LANG_KEY,LANG);}catch(e){} }
function L(field){
  if(field==null)return '';
  if(typeof field==='string')return field;
  return field[LANG]!==undefined?field[LANG]:field.en;
}
function M(en,ru){return LANG==='ru'?ru:en;}

/* ============================= ACCOUNTS / SERVER API ============================= */
/* Base URL of the accounts+progress backend (see /server for the Node.js service and DEPLOY.md).
   Change this if you deploy the backend somewhere else. */
const API_BASE='https://embermarch.lapochka.online/api';

let AUTH_TOKEN=null;      // in-memory only — never written to localStorage
let CURRENT_USER=null;    // in-memory username of the logged-in player
let AUTH_MODE='login';    // 'login' | 'register', which form the auth screen shows
let _syncTimer=null;
let _syncInFlight=false;
let _syncDirtyWhileInFlight=false;

function apiUrl(path){return API_BASE+path;}

function apiRequest(path,opts){
  opts=opts||{};
  const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(AUTH_TOKEN)headers['Authorization']='Bearer '+AUTH_TOKEN;
  return fetch(apiUrl(path),Object.assign({},opts,{headers:headers}))
    .then(function(res){
      return res.json().catch(function(){return {};}).then(function(body){
        if(!res.ok){const e=new Error((body&&body.error)||('HTTP '+res.status));e.status=res.status;e.body=body;throw e;}
        return body;
      });
    });
}

function apiRegister(username,password){
  return apiRequest('/register',{method:'POST',body:JSON.stringify({username:username,password:password})});
}
function apiLogin(username,password){
  return apiRequest('/login',{method:'POST',body:JSON.stringify({username:username,password:password})});
}
function apiLogoutRequest(){
  return apiRequest('/logout',{method:'POST'}).catch(function(){});
}
function apiGetProgress(){
  return apiRequest('/progress',{method:'GET'});
}
function apiPutProgress(data){
  return apiRequest('/progress',{method:'PUT',body:JSON.stringify(data)});
}
/* ---- Arena (asynchronous PvP) ---- */
function apiGetChampion(){return apiRequest('/arena/champion',{method:'GET'});}
function apiPutChampion(name,heroes){return apiRequest('/arena/champion',{method:'PUT',body:JSON.stringify({name:name,heroes:heroes})});}
function apiGetOpponent(){return apiRequest('/arena/opponent',{method:'GET'});}
function apiReportArena(battleToken,result){return apiRequest('/arena/report',{method:'POST',body:JSON.stringify({battleToken:battleToken,result:result})});}
function apiArenaLeaderboard(limit){return apiRequest('/arena/leaderboard?limit='+(limit||20),{method:'GET'});}

/* Debounced sync of META to the server. Called from saveMeta() everywhere the game
   already persisted progress — coalesced so we don't hit the API on every render. */
function scheduleMetaSync(){
  if(!AUTH_TOKEN)return;
  if(_syncTimer)clearTimeout(_syncTimer);
  _syncTimer=setTimeout(function(){_syncTimer=null;flushMetaSync();},1500);
}
function flushMetaSync(){
  if(!AUTH_TOKEN)return Promise.resolve();
  if(_syncInFlight){_syncDirtyWhileInFlight=true;return Promise.resolve();}
  _syncInFlight=true;
  const snapshot=JSON.stringify(META);
  return apiPutProgress(META).then(function(){
    _syncInFlight=false;
    setSyncStatus(true);
    if(_syncDirtyWhileInFlight){_syncDirtyWhileInFlight=false;scheduleMetaSync();}
  }).catch(function(e){
    _syncInFlight=false;
    setSyncStatus(false);
    console.warn('Embermarch: progress sync failed',e);
  });
}
function setSyncStatus(ok){
  const badge=$('sync-status');
  if(!badge)return;
  if(ok){badge.hidden=true;badge.textContent='';}
  else{badge.hidden=false;badge.textContent=M('⚠ Progress not saved — check your connection','⚠ Прогресс не сохранён — проверьте соединение');}
}

function authSetError(msg){const e=$('auth-error');if(e)e.textContent=msg||'';}

/* ---- session persistence: only the auth TOKEN is remembered across reloads,
   never game progress (that always comes fresh from GET /api/progress). ---- */
const AUTH_STORAGE_KEY='embermarch_auth_token';
function persistAuthToken(token){
  try{
    if(token)localStorage.setItem(AUTH_STORAGE_KEY,token);
    else localStorage.removeItem(AUTH_STORAGE_KEY);
  }catch(e){/* storage unavailable — session just won't survive a reload */}
}
function decodeJwtUsername(token){
  try{
    const parts=token.split('.');
    if(parts.length<2)return null;
    let b64=parts[1].replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length%4)b64+='=';
    const json=JSON.parse(decodeURIComponent(atob(b64).split('').map(function(c){
      return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);
    }).join('')));
    return json.username||null;
  }catch(e){return null;}
}
function applyProgressToMeta(progress){
  META=Object.assign(defaultMeta(),progress,{
    upgrades:Object.assign(defaultMeta().upgrades,progress.upgrades),
    heroesUnlocked:Object.assign(defaultMeta().heroesUnlocked,progress.heroesUnlocked),
    customHeroes:progress.customHeroes||[],
    achievements:progress.achievements||{},
    history:progress.history||[],
    theme:progress.theme==='light'?'light':'dark',
    settings:Object.assign(defaultMeta().settings,progress.settings),
    biomeChoice:BIOME_DEFS[progress.biomeChoice]?progress.biomeChoice:'ashfall',
    modifiers:Object.assign(defaultMeta().modifiers,progress.modifiers),
    bestiary:progress.bestiary||{},gearPresets:progress.gearPresets||[]
  });
}
function attemptSessionRestore(){
  let stored=null;
  try{stored=localStorage.getItem(AUTH_STORAGE_KEY);}catch(e){}
  if(!stored){renderAuthScreen();return;}
  AUTH_TOKEN=stored;
  CURRENT_USER=decodeJwtUsername(stored);
  apiGetProgress().then(function(progress){
    applyProgressToMeta(progress);
    applyTheme();applySettings();
    setSyncStatus(true);
    renderTitle();
  }).catch(function(err){
    AUTH_TOKEN=null;CURRENT_USER=null;
    persistAuthToken(null);
    renderAuthScreen();
    if(err&&err.status===401){
      authSetError(M('Your session expired — please log in again.','Сессия истекла — войдите снова.'));
    }
  });
}

function renderAuthScreen(){
  $('auth-label-username').textContent=L(STATIC_I18N['auth-label-username']);
  $('auth-label-password').textContent=L(STATIC_I18N['auth-label-password']);
  $('btn-auth-submit').textContent=AUTH_MODE==='login'?M('Log In','Войти'):M('Register','Зарегистрироваться');
  $('auth-toggle-text').textContent=AUTH_MODE==='login'?M("Don't have an account yet?",'Ещё нет аккаунта?'):M('Already have an account?','Уже есть аккаунт?');
  $('auth-toggle-link').textContent=AUTH_MODE==='login'?M('Register','Зарегистрироваться'):M('Log In','Войти');
  $('auth-password').autocomplete=AUTH_MODE==='login'?'current-password':'new-password';
  authSetError('');
  renderLangSwitch();
  show('screen-auth');
}

function onAuthToggle(){
  AUTH_MODE=(AUTH_MODE==='login')?'register':'login';
  renderAuthScreen();
}

function onAuthSubmit(e){
  e.preventDefault();
  const username=($('auth-username').value||'').trim();
  const password=$('auth-password').value||'';
  authSetError('');
  if(!username||!password){
    authSetError(M('Please fill in both fields.','Заполните оба поля.'));
    return;
  }
  const submitBtn=$('btn-auth-submit');
  submitBtn.disabled=true;
  const action=AUTH_MODE==='login'?apiLogin(username,password):apiRegister(username,password);
  action.then(function(res){
    AUTH_TOKEN=res.token;
    CURRENT_USER=res.username||username;
    persistAuthToken(AUTH_TOKEN);
    return apiGetProgress();
  }).then(function(progress){
    applyProgressToMeta(progress);
    submitBtn.disabled=false;
    applyTheme();applySettings();
    setSyncStatus(true);
    renderTitle();
  }).catch(function(err){
    submitBtn.disabled=false;
    if(!err||err.status===undefined){
      authSetError(M('Could not reach the server. This game requires a network connection to '+API_BASE+' — that may be blocked in this environment (e.g. a sandboxed preview). Try the GitHub Pages version instead.','Не удалось связаться с сервером. Игре нужен доступ к '+API_BASE+' — возможно, он заблокирован в этом окружении (например, в песочнице предпросмотра). Попробуйте версию на GitHub Pages.'));
    }else if(err&&err.status===401){
      authSetError(M('Incorrect username or password.','Неверное имя пользователя или пароль.'));
    }else if(err&&err.status===409){
      authSetError(M('That username is already taken.','Это имя пользователя уже занято.'));
    }else if(err&&err.status===429){
      authSetError(M('Too many attempts. Please wait a moment and try again.','Слишком много попыток. Подождите немного и попробуйте снова.'));
    }else{
      authSetError(M('Network error — could not reach the server. Check your connection and try again.','Ошибка сети — не удалось связаться с сервером. Проверьте соединение и попробуйте снова.'));
    }
  });
}

function doLogout(){
  flushMetaSync().then(function(){
    apiLogoutRequest();
    AUTH_TOKEN=null;CURRENT_USER=null;
    persistAuthToken(null);
    META=defaultMeta();
    clearRun();
    AUTH_MODE='login';
    renderAuthScreen();
  });
}

function applyStaticI18n(){
  Object.keys(STATIC_I18N).forEach(function(id){
    const node=document.getElementById(id);
    if(node)node.innerHTML=L(STATIC_I18N[id]);
  });
}
function renderLangSwitch(){
  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.classList.toggle('active',b.dataset.lang===LANG);
    b.onclick=function(){setLang(b.dataset.lang);};
  });
}
function setLang(l){
  if(l!=='en'&&l!=='ru')return;
  if(l===LANG)return;
  LANG=l;saveLang();
  applyStaticI18n();renderLangSwitch();
  if(!AUTH_TOKEN)renderAuthScreen();else renderTitle();
}

function heroIconInner(key){
  const full=HERO_ICON_SVG[key];
  if(!full)return '';
  const m=full.match(/^<svg[^>]*>([\s\S]*)<\/svg>$/);
  return m?m[1]:'';
}
/* Custom heroes get a composite portrait instead of a bare letter/emblem: the base
   class's silhouette (shrunk and shifted), with the player's chosen emblem shown as
   a small badge in the corner — a real portrait instead of a flat icon-in-circle. */
function customPortraitSVG(unit){
  const inner=heroIconInner(unit.tplKey);
  const badge=(unit.icon||'★');
  if(!inner)return badge;
  return '<svg viewBox="0 0 24 24">'
    +'<g transform="translate(-1.2,-1.2) scale(0.86)">'+inner+'</g>'
    +'<circle cx="18.3" cy="18.3" r="5.4" fill="#12141a" opacity="0.9"/>'
    +'<circle cx="18.3" cy="18.3" r="5.4" fill="none" stroke="#e9e4d6" stroke-width="0.6" opacity="0.5"/>'
    +'<text x="18.3" y="20.6" font-size="6.4" text-anchor="middle" fill="#e9e4d6" font-family="Marcellus,serif">'+badge+'</text>'
    +'</svg>';
}
function avatarContent(unit){
  if(unit&&unit.isHero&&unit.custom&&unit.tplKey&&HERO_ICON_SVG[unit.tplKey])return customPortraitSVG(unit);
  if(unit&&unit.isHero&&!unit.custom&&HERO_ICON_SVG[unit.tplKey||unit.key])return HERO_ICON_SVG[unit.tplKey||unit.key];
  if(unit&&!unit.isHero&&unit.key==='boss'&&typeof BOSS_ICON_SVG!=='undefined'&&BOSS_ICON_SVG[unit.bossKey])return BOSS_ICON_SVG[unit.bossKey];
  if(unit&&!unit.isHero&&typeof ENEMY_ICON_SVG!=='undefined'&&ENEMY_ICON_SVG[unit.key])return ENEMY_ICON_SVG[unit.key];
  return unit&&unit.icon?unit.icon:'';
}

/* Which offensive stat each hero's damage scales from. Physical classes (heavy/finesse
   gear archetypes) deal damage from STR; magic classes (arcane/holy) deal it from INT.
   Enemies/bosses keep a single flat 'atk' stat (no split) — see dmgTypeOf(). */

}

function customHeroToDef(customId){
  const c=(META.customHeroes||[]).find(function(x){return x.id===customId;});
  if(!c)return null;
  const tpl=HERO_DEFS[c.tplKey];
  if(!tpl)return null;
  const dmgType=HERO_DMG_TYPE[c.tplKey]||'str';
  /* pow is the new generic allocation field; atk is kept only as a fallback so
     custom heroes created before this pass (saved with an 'atk' point count)
     still come out with the right power stat. */
  const powPts=(typeof c.pow==='number')?c.pow:(c.atk||0);
  let hp=tpl.baseHp+(c.hp||0)*CUSTOM_HP_PER_POINT;
  let str=tpl.baseStr+(dmgType==='str'?powPts:0);
  let intg=tpl.baseInt+(dmgType==='int'?powPts:0);
  let def=tpl.baseDef+(c.def||0), spd=tpl.baseSpd+(c.spd||0);
  const passive=c.passive||'vitality';
  if(passive==='vitality')hp=Math.round(hp*1.15);
  else if(passive==='ironskin')def+=3;
  else if(passive==='swift')spd+=3;
  else if(passive==='ferocity'){if(dmgType==='str')str+=2;else intg+=2;}
  return {
    key:c.id,name:{en:c.name,ru:c.name},cls:tpl.cls,icon:c.icon||tpl.icon,color:c.color||tpl.color,
    baseHp:hp,baseStr:str,baseInt:intg,baseDef:def,baseSpd:spd,
    defaultRow:tpl.defaultRow,cost:0,abilities:tpl.abilities,custom:true,tplKey:c.tplKey,passive:passive,
  };
}
function getHeroDef(key){
  return HERO_DEFS[key]||customHeroToDef(key);
}

/* ============================= BESTIARY ============================= */
/* Records which foes the player has actually met in combat (win or lose — meeting
   them is what teaches the player their stats/weakness, not beating them), so the
   Legacy screen can show a compendium instead of forcing a re-fight to check a
   forgotten weakness. Keyed 'enemy:<ENEMY_DEFS key>' / 'boss:<BOSS_DEFS key>'. */
function recordBestiary(list){
  META.bestiary=META.bestiary||{};
  let changed=false;
  (list||[]).forEach(function(u){
    const dkey=u.boss?('boss:'+u.bossKey):('enemy:'+u.key);
    if(!META.bestiary[dkey]){META.bestiary[dkey]=true;changed=true;}
  });
  if(changed)saveMeta();
}
/* Same vulnerability rule as the in-combat corner badge (see renderCombat) — kept as
   a shared helper so the bestiary and the battle badge can never drift apart. */
function bestiaryWeaknessInfo(def){
  if(!def||!def.res)return null;
  const weak=def.res==='magic'?'phys':'magic';
  return {icon:weak==='phys'?'⚔':'✦',
    label:weak==='phys'?M('Weak to physical (STR) attacks','Слаб к физическим атакам (СИЛА)'):M('Weak to magic (INT) attacks','Слаб к магическим атакам (ИНТ)')};
}
/* All enemy keys a biome can throw at the party, across every tier and elites/minions,
   deduped — used to group the bestiary by march instead of dumping one flat list. */
function biomeEnemyKeys(biome){
  const set={};
  [1,2,3,4].forEach(function(t){
    (biome.pools[t]||[]).forEach(function(k){set[k]=true;});
    (biome.eliteMinions[t]||[]).forEach(function(k){set[k]=true;});
    if(biome.eliteKeys[t])set[biome.eliteKeys[t]]=true;
  });
  return Object.keys(set);
}
function bestiaryRow(wrap,key,def,isBoss){
  const dkey=(isBoss?'boss:':'enemy:')+key;
  const known=!!(META.bestiary&&META.bestiary[dkey]);
  const row=el('div','row',null);
  row.style.cssText='align-items:center;';
  const av=el('div','hero-avatar',known?def.icon:'?');
  av.style.cssText='background:'+(known?def.color:'var(--surface2)')+';flex-shrink:0;';
  row.appendChild(av);
  const info=el('div','',null);
  info.style.flex='1';
  if(known){
    const weak=bestiaryWeaknessInfo(def);
    const tag=isBoss?" <span class='item-tag' style='color:var(--danger);'>"+M('Boss','Босс')+"</span>":(def.elite?" <span class='item-tag' style='color:var(--accent2);'>"+M('Elite','Элита')+"</span>":'');
    info.innerHTML='<strong>'+L(def.name)+'</strong>'+tag+
      "<br><span style='color:var(--muted);font-size:11px;'>"+statAbbr('hp')+' '+def.hp+' &middot; '+statAbbr('atk')+' '+def.atk+' &middot; '+statAbbr('def')+' '+def.def+' &middot; '+statAbbr('spd')+' '+def.spd+"</span>"+
      (weak?"<br><span style='font-size:11px;color:var(--accent);'>"+weak.icon+' '+weak.label+"</span>":'');
  } else {
    // Keep this short: the full explanation is shown once at the top of the modal
    // instead of being repeated on every single undiscovered row, which used to
    // read as a wall of identical sentences.
    info.innerHTML="<strong style='color:var(--muted);'>"+M('Undiscovered','Не изучен')+"</strong>";
  }
  row.appendChild(info);
  wrap.appendChild(row);
}
function openBestiaryModal(){
  const wrap=el('div','stack');
  wrap.appendChild(el('h3','',M('Bestiary','Бестиарий')));
  const total=Object.keys(ENEMY_DEFS).length+Object.keys(BOSS_DEFS).length;
  const known=Object.keys(META.bestiary||{}).length;
  wrap.appendChild(el('div','eyebrow',known+' / '+total+' '+M('discovered','изучено')));
  if(known<total){
    const hint=el('div','',null);
    hint.style.cssText='font-size:12px;color:var(--muted);margin-bottom:4px;';
    hint.textContent=M('Undiscovered foes are revealed once you meet them in combat.','Неизученные враги открываются после первой встречи с ними в бою.');
    wrap.appendChild(hint);
  }
  Object.keys(BIOME_DEFS).forEach(function(bk){
    const biome=BIOME_DEFS[bk];
    wrap.appendChild(el('div','eyebrow',L(biome.name)));
    biomeEnemyKeys(biome).forEach(function(k){bestiaryRow(wrap,k,ENEMY_DEFS[k],false);});
    (biome.bosses||[]).forEach(function(bossKey){bestiaryRow(wrap,bossKey,BOSS_DEFS[bossKey],true);});
  });
  const close=el('button','primary',M('Close','Закрыть'));
  close.addEventListener('click',closeModal);
  wrap.appendChild(close);
  openModal(wrap);
}

/* ---- rarity gating: early layers mostly common, epic gear only shows up
   once the march gets dangerous (tierForLayer 1..4). Fixes gear that used
   to drop with completely flat odds, so the best items could appear on the
   very first fight. ---- */
const RARITY_WEIGHTS_BY_TIER = {
  1:{common:80,rare:20,epic:0},
  2:{common:55,rare:40,epic:5},
  3:{common:30,rare:45,epic:25},
  4:{common:15,rare:40,epic:45},
};
function rollRarity(tier){
  const w=RARITY_WEIGHTS_BY_TIER[tier]||RARITY_WEIGHTS_BY_TIER[1];
  const total=w.common+w.rare+w.epic;
  let r=Math.random()*total;
  if(r<w.common)return 'common';
  r-=w.common;
  if(r<w.rare)return 'rare';
  return 'epic';
}
function itemsOfRarity(rarity){return ITEM_POOL.filter(function(it){return it.rarity===rarity;});}
function relicsOfRarity(rarity){
  const pool=RELIC_POOL.filter(function(r){return r.rarity===rarity;});
  return pool.length?pool:RELIC_POOL.filter(function(r){return r.rarity==='rare';});
}
function randomItem(tier,forceRarity){
  const rarity=forceRarity||rollRarity(tier||1);
  const pool=itemsOfRarity(rarity);
  const base=pick(pool.length?pool:ITEM_POOL);
  return Object.assign({},base,{name:L(base.name)});
}
function randomRelic(tier){
  /* relics are rare/epic only — roll rarity but floor it at 'rare' */
  const rolled=rollRarity(tier||1);
  const rarity=rolled==='common'?'rare':rolled;
  const base=pick(relicsOfRarity(rarity));
  return Object.assign({},base,{name:L(base.name),passiveDesc:L(base.passiveDesc)});
}
function heroCanUseItem(hero,item){
  if(!item||!item.classes)return true;
  return item.classes.indexOf(hero.tplKey||hero.key)>=0;
}
/* ---- salvage: break unwanted gear down into shards (+ a little gold), so
   an item you can't use isn't just a "discard" with nothing to show for it.
   Relics salvage for more since they're rarer and can't be crafted back. */
function salvageYield(item){
  const relic=item.slot==='relic';
  const table=relic?{rare:{shards:8,gold:12},epic:{shards:15,gold:20}}
                   :{common:{shards:3,gold:5},rare:{shards:6,gold:10},epic:{shards:12,gold:18}};
  return table[item.rarity]||{shards:3,gold:5};
}
function salvageItem(item){
  const y=salvageYield(item);
  RUN.shards=(RUN.shards||0)+y.shards;
  RUN.gold+=y.gold;
  return y;
}
function randomItemForHero(hero,tier,forceRarity){
  const rarity=forceRarity||rollRarity(tier||1);
  const tplKey=hero.tplKey||hero.key;
  const pool=itemsOfRarity(rarity).filter(function(it){return !it.classes||it.classes.indexOf(tplKey)>=0;});
  const base=pick(pool.length?pool:itemsOfRarity(rarity));
  return Object.assign({},base,{name:L(base.name)});
}

function recordRunHistory(win,embers,endlessDepth){

/* Separate top-10 leaderboard of Endless March depths, independent of the
   15-entry general march history above (which would otherwise push an old
   deep Endless run out after a few ordinary marches). */
function recordEndlessDepth(depth){
  if(!depth)return;
  META.endlessRuns=META.endlessRuns||[];
  META.endlessRuns.push({depth:depth,ts:Date.now()});
  META.endlessRuns.sort(function(a,b){return b.depth-a.depth;});

function computeRunStats(){
  const hist=META.history||[];
  const total=hist.length;
  const wins=hist.filter(function(h){return h.win;}).length;
  const winRate=total?Math.round(wins/total*100):0;
  const lossLayers=hist.filter(function(h){return !h.win;}).map(function(h){return h.layer;});
  const avgLossLayer=lossLayers.length?(lossLayers.reduce(function(a,b){return a+b;},0)/lossLayers.length).toFixed(1):null;
  const heroCounts={};
  let heroRunsCounted=0;
  hist.forEach(function(h){
    if(h.heroKeys&&h.heroKeys.length){
      heroRunsCounted++;
      h.heroKeys.forEach(function(k){heroCounts[k]=(heroCounts[k]||0)+1;});
    }
  });
  let favKey=null,favCount=0;
  Object.keys(heroCounts).forEach(function(k){if(heroCounts[k]>favCount){favCount=heroCounts[k];favKey=k;}});
  const customRuns=hist.filter(function(h){return h.hadCustom;}).length;
  return {total:total,wins:wins,winRate:winRate,avgLossLayer:avgLossLayer,favKey:favKey,favCount:favCount,customRuns:customRuns,heroRunsCounted:heroRunsCounted};
}

let ORIG_MATH_RANDOM=null;
function xmur3(str){
  let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;};

function mulberry32(a){

function applyDailySeed(seedStr){

/* ---- procedural sound effects (Web Audio API) ----
   No external audio files can be fetched in this environment, so all sound is
   synthesized at runtime with short oscillator/noise beeps rather than real
   music or sampled SFX. Disabled entirely if the browser has no AudioContext,
   or if the player turns off "Sound Effects" in settings. */
let SFX_CTX=null;
function sfxEnabled(){return !!(META&&META.settings&&META.settings.sound!==false);}
function sfxCtx(){
  if(!sfxEnabled())return null;
  if(SFX_CTX)return SFX_CTX;
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;SFX_CTX=new AC();return SFX_CTX;}catch(e){return null;}
}
function sfxTone(freq,dur,opts){
  const ctx=sfxCtx();if(!ctx)return;
  opts=opts||{};
  try{
    if(ctx.state==='suspended')ctx.resume();
    const t0=ctx.currentTime;
    const osc=ctx.createOscillator();osc.type=opts.type||'sine';
    const gain=ctx.createGain();
    const vol=opts.vol!==undefined?opts.vol:0.12;
    osc.frequency.setValueAtTime(freq,t0);
    if(opts.slideTo)osc.frequency.exponentialRampToValueAtTime(Math.max(20,opts.slideTo),t0+dur);
    gain.gain.setValueAtTime(0.0001,t0);
    gain.gain.exponentialRampToValueAtTime(vol,t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(t0);osc.stop(t0+dur+0.02);
  }catch(e){}
}

function spawnFloatText(uid,text,cls){

  if(!card)return;

/* Which offensive stat a unit's damage comes from: a hero's STR or INT
   (see HERO_DMG_TYPE), or a flat 'atk' for enemies/bosses (no split there —
   see the changelog for why). A 'pow' status effect (company-wide buffs like
   Rally Cry, or enemy buffs like Blood Rite) always applies on top, whichever
   stat it actually is for that unit. */
function dmgTypeOf(unit){
  if(unit&&unit.isHero)return HERO_DMG_TYPE[unit.tplKey||unit.key]||'str';
  return 'atk';
}
function powerOf(unit){
  const dt=dmgTypeOf(unit);
  let v=unit[dt]||0;
  unit.status.forEach(function(s){if(s.stat===dt||s.stat==='pow')v+=s.amount;});
  return Math.max(0,v);
}
/* Mitigation: STR/physical damage is reduced by DEF, INT/magic damage by MDEF.
   Enemies attacking (dt 'atk') mitigate the same way a physical hit always
   did — against the target's DEF — since enemies don't have a magic attack
   split of their own. */
function mitigationKeyFor(attackerDmgType){return attackerDmgType==='int'?'mdef':'def';}
function defenseOf(unit,key){
  let v=unit[key]||0;
  unit.status.forEach(function(s){if(s.stat===key)v+=s.amount;});
  return Math.max(0,v);
}
function statAbbr(key){
  return {atk:M('ATK','АТК'),str:M('STR','СИЛ'),int:M('INT','ИНТ'),pow:M('POW','МОЩЬ'),def:M('DEF','ЗАЩ'),mdef:M('MDEF','МЗАЩ'),spd:M('SPD','СКР'),hp:M('HP','ЗДР')}[key]||key.toUpperCase();
}
function statInfo(key){
  return {
    str:M('Strength — increases the damage of every physical hit and ability this hero lands.','Сила — увеличивает урон от всех физических ударов и способностей этого героя.'),
    int:M('Intellect — increases the damage of every magical hit and ability this hero lands.','Интеллект — увеличивает урон от всех магических ударов и способностей этого героя.'),
    atk:M('Attack power — increases the damage of every hit and ability this hero lands.','Сила атаки — увеличивает урон от всех ударов и способностей этого героя.'),
    def:M('Defense — reduces the physical damage taken from every incoming hit.','Защита — уменьшает физический урон, получаемый от каждого вражеского удара.'),
    mdef:M('Magic Defense — reduces the magical damage taken from every incoming hit.','Магическая защита — уменьшает магический урон, получаемый от каждого вражеского удара.'),
    spd:M('Speed — determines turn order; a faster hero acts sooner (and more often across a long fight).','Скорость — определяет порядок ходов; чем быстрее герой, тем раньше (и чаще за долгий бой) он действует.'),
    hp:M('Max HP — the total health pool before this hero falls in battle.','Максимальное здоровье — общий запас HP, прежде чем герой падёт в бою.'),
  }[key]||'';
}
function slotName(slot){
  return {weapon:M('weapon','оружие'),armor:M('armor','броня'),trinket:M('trinket','аксессуар'),relic:M('relic','реликвия')}[slot]||slot;
}
function rarityLabel(r){
  return {common:M('common','обычный'),rare:M('rare','редкий'),epic:M('epic','эпический')}[r]||r;
}
function rowLabel(row){return row==='front'?M('front','перед'):M('back','тыл');}
function show(screenId){
  ['screen-auth','screen-title','screen-legacy','screen-arena','screen-hero-select','screen-map','screen-combat','screen-reward','screen-event','screen-shop','screen-rest','screen-gameover']
    .forEach(function(id){$(id).hidden=(id!==screenId);});
  $('topbar').hidden=(screenId==='screen-auth'||screenId==='screen-title'||screenId==='screen-legacy'||screenId==='screen-arena'||screenId==='screen-hero-select');
  if(screenId==='screen-map'||screenId==='screen-combat'){
    const el2=$(screenId);
    Object.keys(BIOME_DEFS).forEach(function(bk){el2.classList.toggle('biome-'+bk, !!(RUN&&RUN.biome===bk));});
  }
}
function closeModal(){$('modal-root').innerHTML='';}
function openModal(node){const back=el('div','modal-backdrop');const box=el('div','modal-box');box.appendChild(node);back.appendChild(box);back.addEventListener('click',function(e){if(e.target===back)closeModal();});$('modal-root').innerHTML='';$('modal-root').appendChild(back);}

/* ============================= MAP GENERATION ============================= */

function clampIdx(i,n){return clamp(i,0,n-1);}

/* The march is TOTAL_MAP_LAYERS node-layers long, plus a boss layer at the end
   (so the topbar/gameover screens show "N / TOTAL_STEPS"). The plan is built
   programmatically instead of hand-listed so the march length can be tuned by
   changing one number rather than rewriting a long array by hand. Elites start
   appearing once tier 2 begins (see tierForLayer below); shops show up on a
   steady cadence; the last few layers before the boss have a chance at a rest
   node mixed in (not a whole rest-only layer) so players can breathe without
   ever making the toughest content unreachable, the way an all-rest final
   layer once did (see the tierForLayer comment). */
const TOTAL_MAP_LAYERS = 19;
const TOTAL_STEPS = TOTAL_MAP_LAYERS+1; // +1 for the boss layer; used in "N / TOTAL_STEPS" displays
function buildLayerPlan(){
  const plan=[];
  for(let li=0;li<TOTAL_MAP_LAYERS;li++){
    const hasElite=li>=3;
    /* Shops used to only get a chance to appear every 5th layer, with a
       single low-weight pool entry — that made them rare across a whole
       march. Now every 3rd layer gets a real shot at one, weighted twice
       in the pool so it actually shows up most of the time it's eligible. */
    const hasShop=(li+1)%3===0;
    const nearEnd=li>=TOTAL_MAP_LAYERS-4;
    const pool=['battle','battle','event'];
    if(hasElite)pool.push('elite');
    if(hasShop){pool.push('shop');pool.push('shop');}
    if(nearEnd)pool.push('rest');
    const count=(li%3===2)?4:3;
    plan.push({count:count,pool:pool});
  }
  return plan;
}
const LAYER_PLAN = buildLayerPlan();

function generateMap(modifiers){
  const eliteVanguard=!!(modifiers&&modifiers.eliteVanguard);
  const layers=[];
  LAYER_PLAN.forEach(function(def,li){
    const nodes=[];
    for(let i=0;i<def.count;i++){
      const type=pick(def.pool);
      nodes.push({id:'L'+li+'N'+i,layer:li,idx:i,type:type,cleared:false,next:[]});
    }
    /* Elite Vanguard modifier: turn a plain battle into an elite fight on layers that
       already allow elites (li>=3, see buildLayerPlan), for noticeably more elite fights. */
    if(eliteVanguard&&li>=3){
      const battleNodes=nodes.filter(function(n){return n.type==='battle';});
      if(battleNodes.length&&Math.random()<0.6)pick(battleNodes).type='elite';
    }
    layers.push(nodes);
  });
  const hasShop=layers.some(function(l){return l.some(function(n){return n.type==='shop';});});
  if(!hasShop){
    const candidates=[];
    layers.forEach(function(l,li){if(li<layers.length-1)l.forEach(function(n){if(n.type!=='rest')candidates.push(n);});});
    if(candidates.length)pick(candidates).type='shop';
  }
  /* Guaranteed trader right before the boss: a company should always be able
     to spend its gold and gear up one last time before the march's final
     fight, not gamble on the random layout putting a shop there. */
  const lastLayer=layers[layers.length-1];
  if(lastLayer&&lastLayer.length&&!lastLayer.some(function(n){return n.type==='shop';})){
    const candidates=lastLayer.filter(function(n){return n.type!=='rest';});
    (candidates.length?pick(candidates):lastLayer[0]).type='shop';
  }
  const bossNode={id:'BOSS',layer:layers.length,idx:0,type:'boss',cleared:false,next:[]};

  function connect(curNodes,nextNodes){
    curNodes.forEach(function(node,i){
      const nCur=curNodes.length,nNext=nextNodes.length;
      const base=nCur<=1?Math.floor(nNext/2):Math.round(i*(nNext-1)/(nCur-1));
      const targets={};targets[clampIdx(base,nNext)]=true;
      if(Math.random()<0.5)targets[clampIdx(base+(Math.random()<0.5?1:-1),nNext)]=true;
      node.next=Object.keys(targets).map(function(k){return nextNodes[+k].id;});
    });
    nextNodes.forEach(function(n,j){
      const has=curNodes.some(function(c){return c.next.indexOf(n.id)>=0;});
      if(!has){
        const nCur=curNodes.length,nNext=nextNodes.length;
        const base=nNext<=1?Math.floor(nCur/2):Math.round(j*(nCur-1)/(nNext-1));
        curNodes[clampIdx(base,nCur)].next.push(n.id);
      }
    });
  }
  for(let li=0;li<layers.length-1;li++)connect(layers[li],layers[li+1]);
  connect(layers[layers.length-1],[bossNode]);

  return {layers:layers,bossNode:bossNode};
}
function mapAllNodes(map){
  const all=[];
  map.layers.forEach(function(l){l.forEach(function(n){all.push(n);});});
  all.push(map.bossNode);
  return all;
}
function findNode(map,id){
  if(id==='BOSS')return map.bossNode;
  let found=null;
  map.layers.forEach(function(l){l.forEach(function(n){if(n.id===id)found=n;});});
  return found;
}

/* ============================= RUN STATE ============================= */

let RUN=null;
let UID_COUNTER=0;
function nextUid(){UID_COUNTER++;return 'u'+UID_COUNTER;}

function makeHeroInstance(key){
  const def=getHeroDef(key);
  const legacy=(META.upgrades.legacy_ember||0)>0;
  const maxHp=def.baseHp+META.upgrades.bones*5+(META.upgrades.vitality_rite||0)*8+(legacy?10:0);
  const vanguard=(META.upgrades.vanguard||0)>0;
  const lethal=(META.upgrades.lethal_calling||0)>0;
  const critBonus=(META.upgrades.keen_edge||0)*0.03+(META.upgrades.deadly_precision||0)*0.05+(lethal?0.08:0);
  /* Permanent-upgrade power bonuses (whetstone/vanguard/legacy) always used to
     be a flat +ATK. Now they add to whichever stat this hero's class actually
     scales from (STR or heavy melee, INT for casters) instead of a stat that
     would otherwise sit unused. */
  const dmgType=HERO_DMG_TYPE[def.tplKey||key]||'str';
  const powBonus=(META.upgrades.whetstone||0)+(vanguard?2:0)+(legacy?2:0);
  return {
    uid:nextUid(),
    key:key,tplKey:def.tplKey||key,name:L(def.name),cls:L(def.cls),icon:def.icon,color:def.color,isHero:true,side:'hero',custom:!!def.custom,
    maxHp:maxHp,hp:maxHp,
    str:def.baseStr+(dmgType==='str'?powBonus:0),
    int:def.baseInt+(dmgType==='int'?powBonus:0),
    def:def.baseDef+(META.upgrades.aegis||0)+(META.upgrades.bulwark||0)*4+(legacy?2:0),
    mdef:(META.upgrades.wardsigils||0)+(META.upgrades.warding_rite||0)*4+(legacy?1:0),
    spd:def.baseSpd+(META.upgrades.boots||0)+(vanguard?2:0)+(legacy?2:0),
    critBonus:critBonus,critMultBonus:lethal?0.15:0,
    row:def.defaultRow,
    abilities:def.abilities.map(function(a){return Object.assign({},a,{name:L(a.name),desc:L(a.desc),cdLeft:0});}),
    equip:{weapon:null,armor:null,trinket:null,relic:null},
    status:[],alive:true,level:1,xp:0,usedPhoenix:false,
  };
}

/* ---- in-run leveling ---- */
const LEVEL_PERKS=[
  {key:'pow',name:{en:'Might',ru:'Мощь'},desc:{en:'+2 to primary damage stat (STR/INT)',ru:'+2 к основной характеристике урона (СИЛА/ИНТ)'},apply:function(h){const dt=dmgTypeOf(h);h[dt]=(h[dt]||0)+2;}},
  {key:'def',name:{en:'Warding',ru:'Стойкость'},desc:{en:'+2 DEF',ru:'+2 к защите'},apply:function(h){h.def+=2;}},
  {key:'mdef',name:{en:'Arcane Warding',ru:'Магическая стойкость'},desc:{en:'+2 MDEF',ru:'+2 к магической защите'},apply:function(h){h.mdef=(h.mdef||0)+2;}},
  {key:'spd',name:{en:'Swiftness',ru:'Проворство'},desc:{en:'+1 SPD',ru:'+1 к скорости'},apply:function(h){h.spd+=1;}},
  {key:'hp',name:{en:'Vitality',ru:'Живучесть'},desc:{en:'+6 Max HP',ru:'+6 к макс. здоровью'},apply:function(h){h.maxHp+=6;h.hp+=6;}},
];
function xpToNext(level){return 18+(level-1)*14;}
function xpForNode(node){
  const tier=tierForLayer(node.layer);
  let base=10+tier*6;
  if(node.type==='elite')base=Math.round(base*1.6);
  return base;
}
function sampleTwoPerks(){
  const a=LEVEL_PERKS.map(function(p){return p.key;});
  const first=a.splice(Math.floor(Math.random()*a.length),1)[0];
  const second=a.splice(Math.floor(Math.random()*a.length),1)[0];
  return [first,second];
}
function normalizeLeveling(h){
  if(typeof h.level!=='number')h.level=1;
  if(typeof h.xp!=='number')h.xp=0;
}
function grantXpToHero(h,gain){
  normalizeLeveling(h);
  RUN.pendingLevelUps=RUN.pendingLevelUps||[];
  h.xp+=gain;
  while(h.xp>=xpToNext(h.level)){
    h.xp-=xpToNext(h.level);
    h.level++;
    RUN.pendingLevelUps.push({heroKey:h.key,heroName:h.name,level:h.level,options:sampleTwoPerks()});
  }
}
function awardXp(node){
  const gain=xpForNode(node);
  RUN.pendingLevelUps=RUN.pendingLevelUps||[];
  RUN.party.forEach(function(h){
    if(!h.alive)return;
    grantXpToHero(h,gain);
  });
}
/* Used outside the reward-screen flow (map events): resolves any resulting level-up
   immediately with a random perk instead of queuing a UI choice. Returns levels gained. */
function grantXpAutoResolve(h,gain){
  normalizeLeveling(h);
  h.xp+=gain;
  let leveled=0;
  while(h.xp>=xpToNext(h.level)){
    h.xp-=xpToNext(h.level);
    h.level++;
    leveled++;
    applyLevelPerkByKey(h,pick(sampleTwoPerks()));
  }
  return leveled;
}
function applyLevelPerkByKey(hero,key){
  const perk=LEVEL_PERKS.find(function(p){return p.key===key;});
  if(perk&&hero)perk.apply(hero);
}
function resolvePendingLevelUps(){
  (RUN.pendingLevelUps||[]).forEach(function(pl){
    const h=RUN.party.find(function(x){return x.key===pl.heroKey;});
    if(h)applyLevelPerkByKey(h,pick(pl.options));
  });
  RUN.pendingLevelUps=[];
}
function finishRewardNode(node){
  resolvePendingLevelUps();
  if(node.endless){
    RUN.endlessDepth=(RUN.endlessDepth||0)+1;
    saveRun();
    maybeEndlessWaypoint();
    return;
  }
  completeCurrentNode(node);
  goToMap();
}
/* Leaving a shop/rest stop that was entered from the endless chain (see
   maybeEndlessWaypoint()) needs to resume that chain instead of the normal
   completeCurrentNode()+goToMap(), since there is no real map to return to. */
function afterLeaveNode(node){
  completeCurrentNode(node);
  if(node.endless){nextEndlessEncounter();return;}
  goToMap();
}
/* Every 3rd depth past the boss, the Endless March pauses for a shop or a
   rest (alternating) instead of throwing straight into the next fight —
   otherwise it's an unbroken wall of battles with nowhere to spend the gold
   it hands out or patch the company back up. Doesn't touch endlessDepth —
   only a cleared battle advances the counter used for scaling/scoring. */
function maybeEndlessWaypoint(){
  const depth=RUN.endlessDepth||0;
  if(depth>0&&depth%3===0){
    const kind=(Math.floor(depth/3)%2===0)?'shop':'rest';
    const node={id:'endless-waypoint-'+depth,type:kind,layer:TOTAL_MAP_LAYERS+depth,endless:true,endlessDepth:depth,cleared:false,next:[]};
    if(kind==='shop')RUN.shopStock=null; // force a fresh, correctly-scaled stock rather than a stale one left from the map
    enterNode(node);
    return;
  }
  nextEndlessEncounter();
}
/* Applies (sign=1) or removes (sign=-1) an item's stat mods to/from a hero.
   str/int/def/mdef/spd are explicit keys (weapon/armor items already roll the
   one that matches their archetype). 'atk' is the generic universal-item key
   (trinkets/relics) — it always lands on whichever stat this hero's class
   actually uses (STR or INT), resolved per-wearer rather than baked into the
   item, since the same trinket can be worn by any class. */
function applyModsDelta(hero,mods,sign){
  if(!mods)return;
  ['str','int','def','mdef','spd'].forEach(function(k){if(mods[k])hero[k]=(hero[k]||0)+sign*mods[k];});
  if(mods.atk){const dt=dmgTypeOf(hero);hero[dt]=(hero[dt]||0)+sign*mods.atk;}
}
function applyItemToHero(hero,item){
  const old=hero.equip[item.slot];
  if(old){
    applyModsDelta(hero,old.mods,-1);
    hero.maxHp-=old.mods.hp||0;hero.hp=Math.min(hero.hp,hero.maxHp);
    if(RUN&&RUN.inventory)RUN.inventory.push(old);
  }
  hero.equip[item.slot]=item;
  applyModsDelta(hero,item.mods,1);
  if(item.mods.hp){hero.maxHp+=item.mods.hp;hero.hp+=item.mods.hp;}
  SFX.equip();
}
function unequipFromHero(hero,slot){
  const old=hero.equip[slot];
  if(!old)return;
  applyModsDelta(hero,old.mods,-1);
  hero.maxHp-=old.mods.hp||0;hero.hp=Math.min(hero.hp,hero.maxHp);
  hero.equip[slot]=null;
  if(RUN&&RUN.inventory)RUN.inventory.push(old);
  SFX.equip();
}

function hydrateParty(run){
  if(!run||!run.party)return;
  if(!run.inventory)run.inventory=[];
  if(typeof run.shards!=='number')run.shards=0;
  if(!run.comboCount)run.comboCount=0;
  if(!BIOME_DEFS[run.biome])run.biome='ashfall';
  if(!run.modifiers)run.modifiers={eliteVanguard:false,earlyStorm:false,brokenWard:false};
  run.party.forEach(function(h){
    normalizeLeveling(h);
    if(typeof h.critBonus!=='number')h.critBonus=0;
    if(typeof h.critMultBonus!=='number')h.critMultBonus=0;
    if(h.equip&&h.equip.relic===undefined)h.equip.relic=null;
    /* Migrate an in-progress march saved before the STR/INT split: a hero used
       to carry one flat 'atk' stat. Route its value into whichever of str/int
       this hero's class actually uses, so a resumed march doesn't come back
       with 0 power, and remap any live 'atk' status buffs/debuffs to the
       generic 'pow' key so they keep applying correctly. */
    if(typeof h.str!=='number'&&typeof h.int!=='number'){
      const dt=HERO_DMG_TYPE[h.tplKey||h.key]||'str';
      h.str=dt==='str'?(h.atk||0):0;
      h.int=dt==='int'?(h.atk||0):0;
    }
    if(typeof h.str!=='number')h.str=0;
    if(typeof h.int!=='number')h.int=0;
    if(typeof h.mdef!=='number')h.mdef=0;
    (h.status||[]).forEach(function(s){if(s.stat==='atk')s.stat='pow';});
    const def=getHeroDef(h.key);
    if(!def)return;
    h.cls=L(def.cls);
    const cdMap={};
    (h.abilities||[]).forEach(function(a){cdMap[a.id]=a.cdLeft||0;});
    h.abilities=def.abilities.map(function(a){
      return Object.assign({},a,{name:L(a.name),desc:L(a.desc),cdLeft:cdMap[a.id]||0});
    });
  });
}

function startNewRun(heroKeys,dailySeed){
  if(dailySeed)applyDailySeed(dailySeed);
  const startGold=25+META.upgrades.packs*15+(META.upgrades.caravan||0)*20;
  /* Daily Challenge always runs the default Ashfall March with no modifiers, so every
     player on a given day faces the exact same seeded encounters. */
  const biomeKey=dailySeed?'ashfall':(BIOME_DEFS[META.biomeChoice]?META.biomeChoice:'ashfall');
  const modifiers=dailySeed?{eliteVanguard:false,earlyStorm:false,brokenWard:false}:Object.assign({},META.modifiers);
  RUN={
    ascension:dailySeed?0:META.ascensionChoice,
    biome:biomeKey,
    modifiers:modifiers,
    map:generateMap(modifiers),
    availableNodeIds:null,
    currentNodeId:null,
    party:heroKeys.map(makeHeroInstance),
    gold:startGold,
    layersCleared:0,
    combat:null,
    pendingReward:null,
    pendingItemPickup:null,
    heroDied:false,
    bossKey:pick(getBiome(biomeKey).bosses),
    daily:dailySeed||null,
    pendingChainEvent:null,
    inventory:[],
    comboCount:0,
    shards:0,
    endless:false,
    endlessDepth:0,
  };
  RUN.availableNodeIds=RUN.map.layers[0].map(function(n){return n.id;});
  if(META.upgrades.favor>0){
    const item=randomItemForHero(RUN.party[0],1,'common');applyItemToHero(RUN.party[0],item);
  }
  /* Daily Challenge: keep the seeded RNG active for the whole march (combat, loot,
     events, encounters), not just the map layout, so two players on the same day
     face the same fights and drops if they play the same choices. The seed is
     re-applied on resume too (see resumeSavedRun), though a mid-run reload still
     restarts the seeded sequence rather than resuming its exact position. */
  saveRun();
  show('screen-map');
  renderTopbar();
  renderMap();
}

/* ============================= COMBAT ENGINE ============================= */

/* Tier thresholds are proportional to TOTAL_MAP_LAYERS (currently 19): roughly the
   first sixth is tier 1, the next quarter tier 2, the next third tier 3, and the
   rest — including the final layer — tier 4. Every tier's layer range always has
   real battle/elite nodes in LAYER_PLAN (buildLayerPlan never makes a whole layer
   rest-only), so no tier is ever unreachable the way tier 4 once was. */
function tierForLayer(li){
  /* Early Storm modifier: pull the tier thresholds in so harder enemy pools show up
     sooner in the march, without touching TOTAL_MAP_LAYERS or the boss's position. */
  const storm=RUN&&RUN.modifiers&&RUN.modifiers.earlyStorm;
  const mul=storm?0.78:1;
  const t1=Math.round(TOTAL_MAP_LAYERS*0.16*mul),t2=Math.round(TOTAL_MAP_LAYERS*0.42*mul),t3=Math.round(TOTAL_MAP_LAYERS*0.74*mul);
  return li<t1?1:(li<t2?2:(li<t3?3:4));
}

/* Scales with how far through the WHOLE march a layer is (li / TOTAL_MAP_LAYERS),
   not with the raw layer index. The ramp and def-growth constants (0.315 / 0.14)
   are picked so the boss (li = TOTAL_MAP_LAYERS) ends up at the same difficulty
   the original 7-layer march's boss had. Scaling off the raw index instead —
   as an earlier version of this function did — meant every layer added to
   lengthen the march also added flat extra ramp, so extending the march from
   8 to 20 steps made the MID-game spike far past where the boss itself used to
   land, well before the final layers. Playtesting (scripted full auto-battle
   runs) showed parties dying right at the tier 2→3 jump (layer ~8 of 20) under
   the old per-layer formula; this keeps that same relative difficulty curve,
   just stretched to fit the longer march instead of compounding on top of it. */
/* The +frac^3 terms below are new: a convex "late spike" layered on top of the
   original linear ramp. At low/mid fracs it adds almost nothing (frac^3 is
   tiny), so the early-to-mid march plays the same as before; by the final
   stretch — and especially the boss, frac=1 — it adds a real extra jump on
   top of the old flat ramp. That's the steeper difficulty curve toward the
   end the "нет превозмогания" feedback asked for, without also making the
   early layers (now starved of good loot by the rarity gate) any harder. */
function enemyScale(li){
  const asc=1+RUN.ascension*0.14;
  const storm=RUN.modifiers&&RUN.modifiers.earlyStorm;
  const frac=Math.max(0,Math.min(1,(li||0)/TOTAL_MAP_LAYERS*(storm?1.18:1)));
  const ramp=1+frac*0.315+Math.pow(frac,3)*0.25;
  return {atk:asc*ramp,hp:asc*ramp,def:1+RUN.ascension*0.07+frac*0.14+Math.pow(frac,3)*0.10};
}
/* Same curve as enemyScale(), but without the frac<=1 clamp — used only past the
   final boss, in the Endless March (see buildEndlessEncounter()), where li keeps
   growing past TOTAL_MAP_LAYERS on purpose so the fights keep getting harder
   instead of plateauing at boss-tier forever. */
function enemyScaleEndless(li){
  const asc=1+RUN.ascension*0.14;
  const frac=Math.max(0,(li||0)/TOTAL_MAP_LAYERS);
  const ramp=1+frac*0.315+Math.pow(frac,3)*0.25;
  return {atk:asc*ramp,hp:asc*ramp,def:1+RUN.ascension*0.07+frac*0.14+Math.pow(frac,3)*0.10};
}
/* Enemies don't get a full STR/INT split (that's a player-class thing per the
   request) — but they do get a magic-defense split, cheaply, by deriving MDEF
   from the same base DEF number rather than hand-tuning every monster:
   res:'magic' (casters/curse-users — shaman, caster, banshee, zealot,
   frostwitch, wailingblizzard, vessel, rimesovereign) are tougher to hit with
   INT-based damage but a little softer to STR; res:'phys' (armored brutes —
   revenant, wraith, hand, knight, ashlord, glacier line, colossus, warden)
   are the opposite: their armor stops blades, not spells. Untagged enemies
   (skirmishers/archers) have MDEF == DEF, no bias either way. */
function enemyDefSplit(d,s){
  const physMult=d.res==='magic'?0.85:1;
  const magicMult=d.res==='magic'?1.35:(d.res==='phys'?0.6:1);
  return {def:Math.round(d.def*s.def*physMult),mdef:Math.round(d.def*s.def*magicMult)};
}
function makeEnemyInstance(defKey,li,uncapped){
  const d=ENEMY_DEFS[defKey];
  const s=uncapped?enemyScaleEndless(li):enemyScale(li);
  const ds=enemyDefSplit(d,s);
  return {
    uid:nextUid(),
    key:defKey,name:L(d.name),icon:d.icon,color:d.color,isHero:false,side:'enemy',res:d.res||null,
    maxHp:Math.round(d.hp*s.hp),hp:Math.round(d.hp*s.hp),
    atk:Math.round(d.atk*s.atk),def:ds.def,mdef:ds.mdef,spd:d.spd,row:d.row,elite:!!d.elite,
    abilities:d.abilities.map(function(a){return Object.assign({},a,{name:L(a.name),cdLeft:0});}),
    status:[],alive:true,enraged:false,
  };
}
function makeBossInstance(){
  const s=enemyScale(TOTAL_MAP_LAYERS);
  const BOSS_DEF=BOSS_DEFS[RUN.bossKey]||BOSS_DEFS.warden;
  const ds=enemyDefSplit(BOSS_DEF,s);
  return {
    uid:nextUid(),
    key:'boss',bossKey:RUN.bossKey||'warden',name:L(BOSS_DEF.name),icon:BOSS_DEF.icon,color:BOSS_DEF.color,isHero:false,side:'enemy',res:BOSS_DEF.res||null,
    maxHp:Math.round(BOSS_DEF.hp*s.hp),hp:Math.round(BOSS_DEF.hp*s.hp),
    atk:Math.round(BOSS_DEF.atk*s.atk),def:ds.def,mdef:ds.mdef,spd:BOSS_DEF.spd,row:'front',boss:true,
    abilities:BOSS_DEF.abilities.map(function(a){return Object.assign({},a,{name:L(a.name),cdLeft:0});}),
    status:[],alive:true,enraged:false,
  };
}
function disambiguateNames(list){
  const counts={};
  list.forEach(function(u){counts[u.name]=(counts[u.name]||0)+1;});
  const seen={};
  const roman=['I','II','III','IV','V'];
  list.forEach(function(u){
    if(counts[u.name]>1){
      seen[u.name]=(seen[u.name]||0)+1;
      u.name=u.name+' '+(roman[seen[u.name]-1]||seen[u.name]);
    }
  });
  return list;
}
/* Endless March encounters: always tier-4 pressure, growing steadily past the
   boss via enemyScaleEndless(). Every 4th depth throws an elite (with its usual
   minions) instead of a plain skirmish, so the climb still has rhythm to it. */
function buildEndlessEncounter(depth){
  const li=TOTAL_MAP_LAYERS+depth;
  const biome=getBiome(RUN&&RUN.biome);
  const pool=biome.pools[4];
  if(depth>0&&depth%4===0){
    const list=[makeEnemyInstance(biome.eliteKeys[4],li,true)];
    const minions=biome.eliteMinions[4];
    if(Math.random()<0.85)list.push(makeEnemyInstance(pick(minions),li,true));
    if(Math.random()<0.4)list.push(makeEnemyInstance(pick(minions),li,true));
    return disambiguateNames(list);
  }
  const count=randInt(2,3)+(Math.random()<0.4?1:0);
  const list=[];
  for(let i=0;i<count;i++)list.push(makeEnemyInstance(pick(pool),li,true));
  return disambiguateNames(list);
}
function buildEncounter(node){
  const li=node.layer;
  if(node.endless)return buildEndlessEncounter(node.endlessDepth||0);
  const tier=tierForLayer(li);
  if(node.type==='boss')return disambiguateNames([makeBossInstance()]);
  const biome=getBiome(RUN&&RUN.biome);
  if(node.type==='elite'){
    const eliteKey=biome.eliteKeys[tier];
    const minions=biome.eliteMinions[tier];
    const list=[makeEnemyInstance(eliteKey,li)];
    const minionChance=tier>=4?0.9:(tier===3?0.8:0.7);
    if(Math.random()<minionChance)list.push(makeEnemyInstance(pick(minions),li));
    if(tier>=4&&Math.random()<0.35)list.push(makeEnemyInstance(pick(minions),li));
    return disambiguateNames(list);
  }
  const pool=biome.pools[tier];
  const count=randInt(2,3)+(tier>=3&&Math.random()<0.35?1:0);
  const list=[];
  for(let i=0;i<count;i++)list.push(makeEnemyInstance(pick(pool),li));
  return disambiguateNames(list);
}

function hasRelic(unit,passive){
  return !!(unit&&unit.isHero&&unit.equip&&unit.equip.relic&&unit.equip.relic.passive===passive);
}
function dmgCalc(actor,target,mult){
  const dt=dmgTypeOf(actor);
  const atk=powerOf(actor);
  let def=defenseOf(target,mitigationKeyFor(dt));
  if(hasRelic(target,'last_stand')&&target.hp/target.maxHp<0.25)def=Math.round(def*1.3);
  let base=Math.max(1,Math.round(atk*mult - def*0.5));
  base=Math.round(base*(0.88+Math.random()*0.24));
  /* Broken Ward modifier: heroes take 15% extra damage (paid off by its gold bonus in onCombatWin). */
  if(target.isHero&&RUN&&RUN.modifiers&&RUN.modifiers.brokenWard)base=Math.round(base*1.15);
  let crit=false;
  let critChance=0.12+(hasRelic(actor,'crit_boost')?0.15:0)+(actor.critBonus||0);
  if(Math.random()<critChance){base=Math.round(base*(1.5+(actor.critMultBonus||0)));crit=true;}
  return {amount:Math.max(1,base),crit:crit};
}
function frontAlive(list){return list.filter(function(c){return c.alive&&c.row==='front';});}
function backAlive(list){return list.filter(function(c){return c.alive&&c.row==='back';});}
function anyAlive(list){return list.filter(function(c){return c.alive;});}
/* "Nearest row": the front row if anyone's alive there, otherwise the back row acts as the front line. */
function nearestRowAlive(list){
  const f=frontAlive(list);
  return f.length?f:backAlive(list);
}

function getValidTargets(ability,caster){
  const enemySide=caster.side==='hero'?RUN.combat.enemies:RUN.combat.party;
  const allySide=caster.side==='hero'?RUN.combat.party:RUN.combat.enemies;
  if(ability.targets==='single-ally'||ability.targets==='all-ally')return anyAlive(allySide);
  if(ability.targets==='self')return [caster];
  if(ability.reach==='melee'){
    return nearestRowAlive(enemySide);
  }
  return anyAlive(enemySide);
}
function targetsForRow(ability,caster){
  if(ability.targets!=='row')return null;
  const enemySide=caster.side==='hero'?RUN.combat.enemies:RUN.combat.party;
  return nearestRowAlive(enemySide);
}
function abilityHasTargets(ability,caster){
  if(ability.targets==='row'){
    const enemySide=caster.side==='hero'?RUN.combat.enemies:RUN.combat.party;
    return nearestRowAlive(enemySide).length>0;
  }
  if(ability.targets==='single'||ability.targets==='single-ally'){
    return getValidTargets(ability,caster).length>0;
  }
  return true;
}

function applyAbilityEffect(caster,ability,target){
  const logs=[];
  const fx=[];
  if(ability.type==='damage'){
    const targets = ability.targets==='row'?targetsForRow(ability,caster):(ability.targets==='all'?anyAlive(caster.side==='hero'?RUN.combat.enemies:RUN.combat.party):[target]);
    if(!targets||!targets.length){
      logs.push(M(caster.name+"'s "+ability.name+' finds no one in range.',caster.name+' использует «'+ability.name+'», но там некого атаковать.'));
      logs.fx=fx;
      return logs;
    }
    let totalDealt=0;
    targets.forEach(function(t){
      if(!t.alive)return;
      let mult=ability.mult;
      if(ability.bonusVsBack&&t.row==='back')mult+=ability.bonusVsBack;
      const burning=t.status.some(function(s){return s.type==='dot';});
      if(burning)mult*=1.25;
      const stunned=t.status.some(function(s){return s.type==='stun';});
      if(stunned)mult*=1.2;
      const dodged = t.status.some(function(s){return s.type==='dodge';});
      if(dodged){
        t.status=t.status.filter(function(s){return s.type!=='dodge';});
        logs.push(M(t.name+' dodges the attack!',t.name+' уклоняется от удара!'));
        fx.push({uid:t.uid,text:M('Dodge!','Уклон!'),textCls:'dodge'});
        return;
      }
      /* Combo: Doran's Pack Tackle leaves a foe 'exposed' — Kest's Backstab/Assassinate
         cashes it in for bonus damage. A direct hero-to-hero link, not just a status threshold. */
      const exposedMark=(ability.id==='backstab'||ability.id==='assassinate')?t.status.find(function(s){return s.type==='mark'&&s.tag==='exposed';}):null;
      /* Combo: Yvana's healing blesses the healed ally — their next hit lands harder. */
      const blessedMark=caster.status.find(function(s){return s.type==='mark'&&s.tag==='blessed';});
      /* Combo: Sael's Pin Down leaves a foe 'pinned' — a front-liner's basic strike
         (Bram, Doran or Torvin) cashes it in for bonus damage, rewarding pairing the
         ranger with a melee opener. */
      const pinnedMark=(ability.id==='strike'||ability.id==='claw'||ability.id==='shieldbash')?t.status.find(function(s){return s.type==='mark'&&s.tag==='pinned';}):null;
      /* Combo: Ashra's Ember Flick leaves a foe 'scorched' — Sael's ranged attacks
         (Quick Shot, Pin Down, Deadeye Shot) cash it in for bonus damage, rewarding
         pairing the pyromancer's marker with the ranger's precision follow-up. */
      const scorchedMark=(ability.id==='shot'||ability.id==='pin'||ability.id==='deadeye')?t.status.find(function(s){return s.type==='mark'&&s.tag==='scorched';}):null;

      /* Combo: Kest's Backstab/Assassinate leaves a foe 'bleeding' — Morwen's Withering

      const bleedingMark=(ability.id==='wither'||ability.id==='siphon')?t.status.find(function(s){return s.type==='mark'&&s.tag==='bleeding';}):null;
      if(exposedMark){mult+=0.4;t.status=t.status.filter(function(s){return s!==exposedMark;});RUN.comboCount=(RUN.comboCount||0)+1;}
      if(blessedMark){mult+=0.25;caster.status=caster.status.filter(function(s){return s!==blessedMark;});RUN.comboCount=(RUN.comboCount||0)+1;}
      if(pinnedMark){mult+=0.3;t.status=t.status.filter(function(s){return s!==pinnedMark;});RUN.comboCount=(RUN.comboCount||0)+1;}
      if(scorchedMark){mult+=0.35;t.status=t.status.filter(function(s){return s!==scorchedMark;});RUN.comboCount=(RUN.comboCount||0)+1;}
      if(staggeredMark){mult+=0.25;t.status=t.status.filter(function(s){return s!==staggeredMark;});RUN.comboCount=(RUN.comboCount||0)+1;}
      if(bleedingMark){mult+=0.25;t.status=t.status.filter(function(s){return s!==bleedingMark;});RUN.comboCount=(RUN.comboCount||0)+1;}

      const tagEn=(r.crit?' (crit!)':'')+(burning?' (burning target, +25%!)':'')+(stunned?' (stunned target, +20%!)':'')+(exposedMark?' (combo: exposed target, +40%!)':'')+(blessedMark?' (combo: blessed strike, +25%!)':'')+(pinnedMark?' (combo: pinned target, +30%!)':'')+(scorchedMark?' (combo: scorched target, +35%!)':'')+(staggeredMark?' (combo: staggered target, +25%!)':'')+(bleedingMark?' (combo: bleeding target, +25%!)':'');
      const tagRu=(r.crit?' (крит!)':'')+(burning?' (горящая цель, +25%!)':'')+(stunned?' (оглушённая цель, +20%!)':'')+(exposedMark?' (комбо: уязвимая цель, +40%!)':'')+(blessedMark?' (комбо: благословенный удар, +25%!)':'')+(pinnedMark?' (комбо: пригвождённая цель, +30%!)':'')+(scorchedMark?' (комбо: обожжённая цель, +35%!)':'')+(staggeredMark?' (комбо: оглушённая ударом цель, +25%!)':'')+(bleedingMark?' (комбо: кровоточащая цель, +25%!)':'');
      logs.push(M(
