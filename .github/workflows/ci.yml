# Проверки на каждый push в main и каждый PR: синтаксис клиента и сервера, паритет боя и запуск сервера.
# Секреты не нужны: сервер в проверке стартует с одноразовым случайным ключом и временной базой.
# Деплой на VPS и сборка APK здесь не затрагиваются.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Синтаксис клиента
        run: |
          for f in js/*.js sw.js; do node --check "$f"; done
          node -e "require('./tools/load-client').loadClient({quiet:true})"

      - name: Синтаксис сервера и инструментов
        run: |
          for f in server/*.js tools/*.js; do node --check "$f"; done

      - name: Паритет боя клиента и сервера
        run: node tools/parity-check.js --duels 1000 --equip | tee parity.txt && grep -q "all identical" parity.txt

      - name: Зависимости сервера
        working-directory: server
        run: npm ci

      # Сервер поднимается на временной базе, проходят регистрация и вход
      - name: Запуск сервера (проверка живости)
        shell: bash
        run: |
          export PORT=4011
          export JWT_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          export DB_PATH="$RUNNER_TEMP/embermarch-ci.sqlite"
          node server/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:$PORT/api/health" > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://localhost:$PORT/api/health"; echo
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"username":"ci_user","password":"ci-password-123"}' "http://localhost:$PORT/api/register" > /dev/null
          LOGIN=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"username":"ci_user","password":"ci-password-123"}' "http://localhost:$PORT/api/login")
          case "$LOGIN" in *'"token"'*) ;; *) echo "Вход не вернул токен"; exit 1 ;; esac
          PAGE=$(curl -fsS "http://localhost:$PORT/")
          case "$PAGE" in *'<html'*) ;; *) echo "Клиент не раздаётся"; exit 1 ;; esac
          echo "Сервер отвечает, вход работает"

      - name: Лог сервера (при ошибке)
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true
