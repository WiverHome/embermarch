# nginx reverse-proxy for embermarch.lapochka.online
# Copy to /etc/nginx/sites-available/ and symlink into sites-enabled/, then run:
#   sudo certbot --nginx -d embermarch.lapochka.online
# certbot will rewrite this file to add the TLS (443) server block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name embermarch.lapochka.online;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
